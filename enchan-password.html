<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>T-matrix｜新增账号密码增强</title>
  <style>
    :root {
      --navy: #001827;
      --navy-2: #002237;
      --teal: #10b9b5;
      --blue: #2ea8f2;
      --primary: #1677ff;
      --text: #262626;
      --muted: #8c8c8c;
      --border: #d9d9d9;
      --line: #ededed;
      --danger: #f5222d;
      --success: #26a269;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 1120px;
      color: var(--text);
      background: #f5f5f5;
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }

    .sidebar {
      position: fixed;
      z-index: 4;
      inset: 0 auto 0 0;
      width: 186px;
      color: #a7b4bd;
      background: var(--navy);
    }
    .logo {
      height: 58px;
      padding: 10px 28px;
      color: #fff;
      font-size: 28px;
      font-weight: 700;
      font-style: italic;
      letter-spacing: -1px;
      white-space: nowrap;
    }
    .logo-mark { display: inline-block; margin-right: 6px; font-style: normal; font-family: Arial, sans-serif; font-weight: 800; }
    .menu-title {
      height: 44px;
      padding: 10px 24px 10px 58px;
      color: #11c5c2;
      position: relative;
    }
    .menu-title::after { content: "⌃"; position: absolute; right: 18px; }
    .menu-item {
      height: 55px;
      padding: 17px 18px 17px 49px;
      color: #a8b1b9;
    }
    .menu-item.active { color: #fff; background: var(--teal); }
    .menu-item.center { text-align: center; padding-left: 18px; }
    .menu-section {
      position: relative;
      height: 55px;
      padding: 17px 20px 17px 58px;
      background: var(--navy-2);
    }
    .menu-section::after { content: "⌄"; position: absolute; right: 18px; }

    .topbar {
      position: fixed;
      z-index: 3;
      top: 0;
      right: 0;
      left: 186px;
      height: 58px;
      display: flex;
      align-items: stretch;
      color: #8fa0aa;
      background: var(--navy);
    }
    .top-tab { padding: 18px 18px; }
    .top-tab.active { color: #fff; background: var(--teal); }
    .top-spacer { flex: 1; }
    .language-wrap { position: relative; align-self: center; margin-right: 22px; }
    .language {
      align-self: center;
      min-width: 102px;
      padding: 6px 13px;
      color: #333;
      background: #fff;
      border: 1px solid #a7d2ff;
      border-radius: 6px;
    }
    .language-menu {
      position: absolute;
      z-index: 12;
      top: 39px;
      right: 0;
      width: 130px;
      padding: 6px 0;
      border-radius: 7px;
      background: #fff;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .16);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-5px);
      transition: .15s ease;
    }
    .language-menu.show { opacity: 1; visibility: visible; transform: translateY(0); }
    .language-option {
      width: 100%;
      height: 36px;
      padding: 0 14px;
      border: 0;
      color: #444;
      background: #fff;
      text-align: left;
    }
    .language-option:hover, .language-option.active { color: var(--primary); background: #f2f7ff; }
    .profile-wrap { position: relative; display: flex; align-items: center; }
    .profile {
      height: 58px;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 0 28px 0 0;
      border: 0;
      color: #e7edf1;
      background: transparent;
    }
    .avatar {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border: 2px solid #5b7890;
      border-radius: 50%;
      background: #d8e4ea;
      color: #456070;
    }
    .profile-menu {
      position: absolute;
      z-index: 12;
      top: 51px;
      right: 18px;
      width: 150px;
      padding: 10px 0;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 10px 28px rgba(0, 0, 0, .16);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-5px);
      transition: .15s ease;
    }
    .profile-menu::before {
      content: "";
      position: absolute;
      top: -7px;
      right: 30px;
      width: 14px;
      height: 14px;
      background: #fff;
      transform: rotate(45deg);
    }
    .profile-menu.show { opacity: 1; visibility: visible; transform: translateY(0); }
    .profile-action {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 42px;
      padding: 0 18px;
      border: 0;
      color: #777;
      background: #fff;
      text-align: left;
      font-size: 15px;
    }
    .profile-action:hover { color: var(--primary); background: #f5f9ff; }
    .profile-icon { display: inline-block; width: 24px; color: #a9a9a9; font-size: 17px; }

    .main { margin: 58px 15px 0 194px; min-height: calc(100vh - 64px); background: #fff; }
    .crumb { height: 40px; padding: 11px 14px; color: #999; font-size: 12px; background: #fafafa; }
    .content { padding: 19px 33px 28px; }
    .filters { display: flex; align-items: center; gap: 19px; margin-bottom: 20px; }
    .field-inline { display: flex; align-items: center; gap: 8px; }
    .filter-input, .filter-select {
      width: 200px;
      height: 30px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      outline: none;
      background: #fff;
    }
    .filter-input:focus, .filter-select:focus { border-color: #69b7f5; box-shadow: 0 0 0 2px rgba(46,168,242,.1); }
    .btn {
      min-width: 60px;
      height: 32px;
      padding: 0 15px;
      border-radius: 5px;
      border: 1px solid var(--border);
      color: #333;
      background: #fff;
    }
    .btn.primary { color: #fff; border-color: var(--primary); background: var(--primary); }
    .btn.sky { color: #fff; border-color: var(--blue); background: var(--blue); }
    .btn.outline-blue { color: var(--blue); border-color: var(--blue); }
    .create-row { margin-bottom: 18px; }

    .table-wrap { overflow: hidden; border-radius: 8px 8px 0 0; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th { height: 41px; background: #fafafa; font-weight: 600; }
    td { height: 40px; text-align: center; border-bottom: 1px solid var(--line); font-size: 13px; }
    th + th { position: relative; }
    th + th::before { content: ""; position: absolute; left: 0; top: 10px; height: 21px; border-left: 1px solid #eee; }
    .ops { white-space: nowrap; }
    .link-btn { padding: 2px 5px; border: 0; background: transparent; color: #222; font-size: 12px; }
    .pagination { height: 55px; display: flex; justify-content: center; align-items: center; gap: 18px; }
    .page { min-width: 28px; height: 30px; border: 1px solid transparent; border-radius: 6px; background: #fff; }
    .page.active { color: var(--primary); border-color: var(--primary); }
    .per-page { height: 30px; padding: 0 10px; border: 1px solid var(--border); border-radius: 6px; background: #fff; }

    .overlay {
      position: fixed;
      z-index: 20;
      inset: 0;
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding-top: 44px;
      background: rgba(0, 0, 0, .46);
    }
    .overlay.show { display: flex; }
    .modal {
      width: min(1000px, calc(100vw - 72px));
      min-height: 545px;
      position: relative;
      padding: 20px 24px 28px;
      border-radius: 9px;
      background: #fff;
      box-shadow: 0 16px 48px rgba(0,0,0,.2);
      animation: modalIn .18s ease-out;
    }
    @keyframes modalIn { from { opacity: 0; transform: translateY(-8px); } }
    .modal-head { display: flex; align-items: center; height: 31px; font-size: 17px; font-weight: 600; }
    .close {
      position: absolute;
      top: 12px;
      right: 13px;
      width: 34px;
      height: 34px;
      border: 0;
      color: #888;
      background: transparent;
      font-size: 29px;
      font-weight: 200;
    }
    .form { padding: 20px 0 76px; }
    .form-row { display: grid; grid-template-columns: 140px 1fr; align-items: start; min-height: 51px; }
    .form-label { padding: 7px 16px 0 0; text-align: right; }
    .required { margin-right: 4px; color: var(--danger); }
    .control { position: relative; }
    .input, .select {
      width: 100%;
      height: 31px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      outline: none;
      color: #333;
      background: #fff;
      transition: border-color .15s, box-shadow .15s;
    }
    .input::placeholder { color: #c5c5c5; }
    .input:focus, .select:focus { border-color: #69b7f5; box-shadow: 0 0 0 2px rgba(46,168,242,.1); }
    .input.error { border-color: var(--danger); box-shadow: 0 0 0 2px rgba(245,34,45,.08); }
    .input.valid { border-color: var(--success); }
    .error-text { min-height: 18px; padding-top: 2px; color: var(--danger); font-size: 12px; }
    .password-hint { margin-top: 4px; color: #999; font-size: 12px; }
    .site-list { display: flex; gap: 14px; align-items: center; min-height: 31px; }
    .checkbox { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
    .checkbox input { width: 16px; height: 16px; margin: 0; accent-color: var(--primary); }
    .form-row.password-row { min-height: 82px; }
    .modal-foot {
      position: absolute;
      right: 34px;
      bottom: 29px;
      display: flex;
      gap: 9px;
    }
    .modal-foot .btn { height: 33px; }

    .change-password-modal {
      width: min(760px, calc(100vw - 72px));
      min-height: 370px;
      padding: 24px 34px 28px;
    }
    .change-password-form { padding: 30px 0 82px; }
    .change-password-row {
      display: grid;
      grid-template-columns: 190px 1fr;
      align-items: start;
      min-height: 66px;
    }
    .change-password-row.new-password-row { min-height: 90px; }
    .change-password-label { padding: 7px 18px 0 0; text-align: right; font-size: 16px; }
    .change-password-modal .input { height: 40px; font-size: 15px; }
    .change-password-modal .modal-foot { right: 34px; bottom: 32px; }
    .change-password-modal .modal-foot .btn { min-width: 72px; height: 40px; font-size: 15px; }

    .reset-password-modal { min-height: 430px; }
    .reset-password-form { padding: 54px 0 88px; }
    .reset-password-row {
      display: grid;
      grid-template-columns: 140px 1fr;
      align-items: start;
      min-height: 66px;
    }
    .reset-password-row.new-password-row { min-height: 92px; }
    .reset-password-label { padding: 7px 18px 0 0; text-align: right; font-size: 15px; }
    .reset-password-modal .input { height: 40px; font-size: 15px; }
    .input[readonly] { color: #999; background: #f5f5f5; cursor: default; }
    .reset-password-modal .modal-foot { right: 34px; bottom: 32px; }
    .reset-password-modal .modal-foot .btn { min-width: 72px; height: 40px; font-size: 15px; }

    .weak-password-modal {
      width: min(540px, calc(100vw - 48px));
      min-height: 270px;
      padding: 26px 34px 28px;
    }
    .weak-password-content {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      padding: 38px 12px 82px;
    }
    .weak-password-icon {
      flex: none;
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #1677ff;
      background: #eaf3ff;
      font-size: 22px;
      font-weight: 700;
    }
    .weak-password-message { padding-top: 1px; }
    .weak-password-message strong { display: block; margin-bottom: 7px; font-size: 16px; }
    .weak-password-message p { margin: 0; color: #666; line-height: 1.8; }
    .weak-password-modal .modal-foot { right: 34px; bottom: 30px; }
    .weak-password-modal .modal-foot .btn { min-width: 88px; height: 38px; font-size: 15px; }

    .toast {
      position: fixed;
      z-index: 40;
      top: 74px;
      left: 50%;
      transform: translateX(-50%) translateY(-12px);
      min-width: 220px;
      padding: 11px 18px;
      border: 1px solid #b7ebc6;
      border-radius: 6px;
      color: #237846;
      background: #f1fff5;
      box-shadow: 0 8px 22px rgba(0,0,0,.12);
      opacity: 0;
      pointer-events: none;
      transition: .2s;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error-toast { color: #b42318; border-color: #ffd0cc; background: #fff3f2; }

    @media (max-height: 650px) {
      .overlay { padding-top: 18px; overflow-y: auto; }
      .modal { min-height: 535px; margin-bottom: 18px; }
    }

    body.lang-en .sidebar { width: 220px; }
    body.lang-en .topbar { left: 220px; }
    body.lang-en .main { margin-left: 228px; }
    body.lang-en .menu-title,
    body.lang-en .menu-item,
    body.lang-en .menu-item.center,
    body.lang-en .menu-section { padding-left: 28px; text-align: left; }
    body.lang-en .top-tab { padding-right: 15px; padding-left: 15px; }
    body.lang-en table col:nth-child(1),
    body.lang-en table col:nth-child(2) { width: 13% !important; }
    body.lang-en table col:nth-child(3) { width: 14% !important; }
    body.lang-en table col:nth-child(4),
    body.lang-en table col:nth-child(5) { width: 12% !important; }
    body.lang-en table col:nth-child(6) { width: 36% !important; }
    body.lang-en .link-btn { padding-right: 4px; padding-left: 4px; font-size: 11px; }
  </style>
</head>
<body>
  <aside class="sidebar" aria-label="侧边导航">
    <div class="logo"><span class="logo-mark">T</span>-matrix</div>
    <div class="menu-title" data-i18n="nav.permission">权限管理</div>
    <div class="menu-item active" data-i18n="nav.adminAccounts">管理员账户</div>
    <div class="menu-item center" data-i18n="nav.giftProviderAccounts">礼品卡服务商账户</div>
    <div class="menu-item center" data-i18n="nav.roleManagement">角色管理</div>
    <div class="menu-item center" data-i18n="nav.pointsProviderAccounts">积分服务商账户</div>
    <div class="menu-item center" data-i18n="nav.supportAccounts">平台客服账户</div>
    <div class="menu-section" data-i18n="nav.security">安全设置</div>
    <div class="menu-section" data-i18n="nav.system">系统设置</div>
    <div class="menu-section" data-i18n="nav.finance">财务设置</div>
  </aside>

  <header class="topbar">
    <div class="top-tab active" data-i18n="top.system">系统管理</div>
    <div class="top-tab" data-i18n="top.business">业务管理</div>
    <div class="top-tab" data-i18n="top.marketing">营销管理</div>
    <div class="top-tab" data-i18n="top.analytics">数据统计</div>
    <div class="top-spacer"></div>
    <div class="language-wrap">
      <button class="language" id="languageBtn" type="button" aria-haspopup="menu" aria-expanded="false"><span id="languageLabel">简体中文</span>　⌄</button>
      <div class="language-menu" id="languageMenu" role="menu">
        <button class="language-option active" type="button" role="menuitem" data-lang="zh-CN">简体中文</button>
        <button class="language-option" type="button" role="menuitem" data-lang="en">English</button>
      </div>
    </div>
    <div class="profile-wrap">
      <button class="profile" id="profileBtn" type="button" aria-haspopup="menu" aria-expanded="false">
        <span class="avatar">👤</span><span>xiabing</span>
      </button>
      <div class="profile-menu" id="profileMenu" role="menu">
        <button class="profile-action" id="openChangePassword" type="button" role="menuitem"><span class="profile-icon">▣</span><span data-i18n="action.changePassword">修改密码</span></button>
        <button class="profile-action" id="logoutBtn" type="button" role="menuitem"><span class="profile-icon">⇥</span><span data-i18n="action.logout">退出登录</span></button>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="crumb" data-i18n="breadcrumb.adminAccounts">系统管理 / 权限管理 / 管理员账户</div>
    <section class="content">
      <div class="filters">
        <label class="field-inline"><span data-i18n="field.account">账户：</span><input class="filter-input" id="accountFilter"></label>
        <label class="field-inline"><span data-i18n="field.username">用户名：</span><input class="filter-input" id="nameFilter"></label>
        <label class="field-inline"><span data-i18n="field.status">状态：</span>
          <select class="filter-select" id="statusFilter"><option value="全部" data-i18n="status.all">全部</option><option value="启用" data-i18n="status.enabled">启用</option><option value="禁用" data-i18n="status.disabled">禁用</option></select>
        </label>
        <button class="btn sky" id="searchBtn" data-i18n="action.search">查询</button>
        <button class="btn outline-blue" id="resetBtn" data-i18n="action.reset">重置</button>
      </div>
      <div class="create-row"><button class="btn sky" id="openCreate" data-i18n="action.addUser">新增用户</button></div>

      <div class="table-wrap">
        <table>
          <colgroup><col style="width:15%"><col style="width:15%"><col style="width:15%"><col style="width:14%"><col style="width:16%"><col style="width:25%"></colgroup>
          <thead><tr><th data-i18n="table.account">账户</th><th data-i18n="table.username">用户名</th><th data-i18n="table.role">角色</th><th data-i18n="table.status">状态</th><th data-i18n="table.mfa">MFA认证</th><th data-i18n="table.actions">操作</th></tr></thead>
          <tbody id="accountRows"></tbody>
        </table>
      </div>
      <div class="pagination"><span id="totalText">共 17 条</span><button class="page">‹</button><button class="page active">1</button><button class="page">2</button><button class="page">›</button><select class="per-page"><option data-i18n="pagination.perPage">10 条/页</option></select></div>
    </section>
  </main>

  <div class="overlay" id="weakPasswordOverlay" role="dialog" aria-modal="true" aria-labelledby="weakPasswordTitle">
    <section class="modal weak-password-modal">
      <div class="modal-head" id="weakPasswordTitle" data-i18n="weak.title">密码安全提示</div>
      <div class="weak-password-content">
        <div class="weak-password-icon">!</div>
        <div class="weak-password-message">
          <strong data-i18n="weak.heading">当前密码安全强度较低</strong>
          <p data-i18n="weak.body">为保障账号安全，请将密码修改为字母、数值和特殊字符的组合。</p>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" type="button" id="remindLater" data-i18n="action.remindLater">下次再说</button>
        <button class="btn primary" type="button" id="changePasswordNow" data-i18n="action.changePassword">修改密码</button>
      </div>
    </section>
  </div>

  <div class="overlay" id="createOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <section class="modal">
      <div class="modal-head" id="modalTitle" data-i18n="create.title">新增</div>
      <button class="close" id="closeModal" aria-label="关闭">×</button>
      <form class="form" id="createForm" novalidate>
        <div class="form-row">
          <label class="form-label" for="account"><span class="required">*</span><span data-i18n="field.account">账号：</span></label>
          <div class="control"><input class="input" id="account" maxlength="50" placeholder="最多50个字符" data-i18n-placeholder="placeholder.max50" autocomplete="off"><div class="error-text" id="accountError"></div></div>
        </div>
        <div class="form-row">
          <div class="form-label"><span class="required">*</span><span data-i18n="field.sitePermission">站点权限：</span></div>
          <div class="control site-list">
            <label class="checkbox"><input type="checkbox" id="allSites"><span data-i18n="field.allSites">全部站点</span></label>
            <label class="checkbox"><input type="checkbox" name="site" value="TroveLoop">TroveLoop</label>
            <label class="checkbox"><input type="checkbox" name="site" value="TrustCard">TrustCard</label>
            <label class="checkbox"><input type="checkbox" name="site" value="LuckCard">LuckCard</label>
            <span class="error-text" id="siteError"></span>
          </div>
        </div>
        <div class="form-row">
          <label class="form-label" for="username"><span class="required">*</span><span data-i18n="field.username">用户名：</span></label>
          <div class="control"><input class="input" id="username" maxlength="50" placeholder="最多50个字符" data-i18n-placeholder="placeholder.max50" autocomplete="off"><div class="error-text" id="usernameError"></div></div>
        </div>
        <div class="form-row password-row">
          <label class="form-label" for="password"><span class="required">*</span><span data-i18n="field.password">密码：</span></label>
          <div class="control">
            <input class="input" id="password" maxlength="30" type="password" placeholder="请输入6-30位密码" data-i18n-placeholder="placeholder.password" autocomplete="new-password">
            <div class="password-hint" data-i18n="password.hint">字母、数值和特殊字符的组合</div>
            <div class="error-text" id="passwordError"></div>
          </div>
        </div>
        <div class="form-row">
          <label class="form-label" for="role"><span class="required">*</span><span data-i18n="field.role">角色：</span></label>
          <div class="control"><select class="select" id="role"><option value="" data-i18n="role.select">请选择角色</option><option value="管理员" data-i18n="role.admin">管理员</option><option value="运营人员" data-i18n="role.operator">运营人员</option><option value="只读人员" data-i18n="role.readonly">只读人员</option></select><div class="error-text" id="roleError"></div></div>
        </div>
        <div class="form-row">

        'action.enable': 'Enable', 'action.resetMfa': 'Reset MFA',
        'weak.title': 'Password security', 'weak.heading': 'Your current password is weak',

        'create.title': 'Add user', 'change.title': 'Change password', 'resetPassword.title': 'Reset password',
        'placeholder.max50': 'Up to 50 characters', 'placeholder.password': 'Enter a 6–30 character password', 'placeholder.currentPassword': 'Enter current password',
        'password.hint': 'Use a combination of letters, numbers, and special characters', 'pagination.perPage': '10 / page', 'pagination.total': '{count} total',
        'error.accountRequired': 'Enter an account', 'error.accountDuplicate': 'This account already exists', 'error.usernameRequired': 'Enter a username',
        'error.roleRequired': 'Select a role', 'error.siteRequired': 'Select at least one site', 'error.passwordRequired': 'Enter a password',
        'error.newPasswordRequired': 'Enter a new password', 'error.currentPasswordRequired': 'Enter the current password',
        'error.passwordWhitespaceOrChinese': 'The password cannot contain spaces or Chinese characters',
        'error.passwordUnsupported': 'Use only letters, numbers, or supported special characters',
        'error.passwordLength': 'The password must be 6–30 characters', 'error.passwordLetter': 'Include at least one letter',
        'error.passwordNumber': 'Include at least one number', 'error.passwordSpecial': 'Include at least one special character',
        'toast.outOfScope': 'is outside this prototype', 'toast.checkRequired': 'Check all required fields', 'toast.accountCreated': 'Account created',
        'toast.checkPassword': 'Check the password fields', 'toast.passwordChanged': 'Password changed', 'toast.checkNewPassword': 'Check the new password',
        'toast.passwordReset': 'Password reset for {account}; previous sessions are signed out'
      }
    };

    let currentLanguage = localStorage.getItem('tMatrixLanguage') || 'zh-CN';
    let currentRows = accounts;
    let currentTotal = Math.max(17, accounts.length);

    function t(key, values = {}) {
      let text = translations[currentLanguage][key] || key;
      Object.entries(values).forEach(([name, value]) => { text = text.replace(`{${name}}`, value); });
      return text;
    }

    const $ = id => document.getElementById(id);
    const weakPasswordOverlay = $('weakPasswordOverlay');
    const overlay = $('createOverlay');
    const changePasswordOverlay = $('changePasswordOverlay');
    const resetPasswordOverlay = $('resetPasswordOverlay');
    const passwordInput = $('password');
    const newPasswordInput = $('newPassword');
    const resetNewPasswordInput = $('resetNewPassword');
    const allowedSpecials = '!@#$%^&*()_+-=[]{}|;:,.<>?';
    const roleKeys = { '管理员': 'role.admin', '运营人员': 'role.operator', '只读人员': 'role.readonly' };
    const statusKeys = { '启用': 'status.enabled', '禁用': 'status.disabled' };
    const mfaKeys = { '待绑定': 'mfa.pending', '已绑定': 'mfa.bound' };
    const actionKeys = { '删除': 'action.delete', '编辑': 'action.edit', '重置密码': 'action.resetPassword', '禁用': 'action.disable', '启用': 'action.enable', '重置MFA': 'action.resetMfa' };
    let toastTimer;

    function applyLanguage(language) {
      currentLanguage = language;
      localStorage.setItem('tMatrixLanguage', language);
      document.documentElement.lang = language;
      document.body.classList.toggle('lang-en', language === 'en');
      document.title = language === 'en' ? 'T-matrix | Password Security' : 'T-matrix｜新增账号密码增强';
      document.querySelectorAll('[data-i18n]').forEach(element => { element.textContent = t(element.dataset.i18n); });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(element => { element.placeholder = t(element.dataset.i18nPlaceholder); });
      $('languageLabel').textContent = language === 'en' ? 'English' : '简体中文';
      document.querySelectorAll('.language-option').forEach(option => option.classList.toggle('active', option.dataset.lang === language));
      renderRows(currentRows, currentTotal);
    }

    function renderRows(list = accounts, total = Math.max(17, accounts.length)) {
      currentRows = list;
      currentTotal = total;
      const body = $('accountRows');
      body.textContent = '';
      list.slice(0, 10).forEach(item => {
        const tr = document.createElement('tr');
        [item.account, item.username, t(roleKeys[item.role]), t(statusKeys[item.status]), t(mfaKeys[item.mfa])].forEach(value => {
          const td = document.createElement('td');
          td.textContent = value;
          tr.appendChild(td);
        });
        const ops = document.createElement('td');
        ops.className = 'ops';
        ['删除', '编辑', '重置密码', item.status === '启用' ? '禁用' : '启用'].concat(item.mfa === '已绑定' ? ['重置MFA'] : []).forEach(label => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'link-btn';
          button.textContent = t(actionKeys[label]);
          button.addEventListener('click', () => {
            if (label === '重置密码') openResetPasswordModal(item);
            else showToast(`${t(actionKeys[label])} ${t('toast.outOfScope')}`);
          });
          ops.appendChild(button);
        });
        tr.appendChild(ops);
        body.appendChild(tr);
      });
      $('totalText').textContent = t('pagination.total', { count: total });
    }

    function showToast(message, isError = false) {
      const toast = $('toast');
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.toggle('error-toast', isError);
      toast.classList.add('show');
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function setError(inputId, errorId, message) {
      const input = $(inputId);
      if (input) input.classList.toggle('error', Boolean(message));
      $(errorId).textContent = message;
      return !message;
    }

    function resetForm() {
      $('createForm').reset();
      ['account', 'username', 'password'].forEach(id => $(id).classList.remove('error', 'valid'));
      ['accountError', 'siteError', 'usernameError', 'passwordError', 'roleError'].forEach(id => $(id).textContent = '');
      passwordInput.type = 'password';
    }

    function openModal() {
      resetForm();
      overlay.classList.add('show');
      document.body.style.overflow = 'hidden';
      setTimeout(() => $('account').focus(), 80);
    }

    function closeModal() {
      overlay.classList.remove('show');
      document.body.style.overflow = '';
    }

    function openWeakPasswordPrompt() {
      weakPasswordOverlay.classList.add('show');
      document.body.style.overflow = 'hidden';
      setTimeout(() => $('changePasswordNow').focus(), 80);
    }

    function closeWeakPasswordPrompt() {
      weakPasswordOverlay.classList.remove('show');
      document.body.style.overflow = '';
    }

    function resetChangePasswordForm() {
      $('changePasswordForm').reset();
      ['currentPassword', 'newPassword'].forEach(id => $(id).classList.remove('error', 'valid'));
      ['currentPasswordError', 'newPasswordError'].forEach(id => $(id).textContent = '');
    }

    function openChangePasswordModal() {
      resetChangePasswordForm();
      $('profileMenu').classList.remove('show');
      $('profileBtn').setAttribute('aria-expanded', 'false');
      changePasswordOverlay.classList.add('show');
      document.body.style.overflow = 'hidden';
      setTimeout(() => $('currentPassword').focus(), 80);
    }

    function closeChangePasswordModal() {
      changePasswordOverlay.classList.remove('show');
      document.body.style.overflow = '';
    }

    function resetResetPasswordForm() {
      $('resetPasswordForm').reset();
      resetNewPasswordInput.classList.remove('error', 'valid');
      $('resetNewPasswordError').textContent = '';
    }

    function openResetPasswordModal(account) {
      resetResetPasswordForm();
      $('resetAccount').value = account.account;
      resetPasswordOverlay.classList.add('show');
      document.body.style.overflow = 'hidden';
      setTimeout(() => resetNewPasswordInput.focus(), 80);
    }

    function closeResetPasswordModal() {
      resetPasswordOverlay.classList.remove('show');
      document.body.style.overflow = '';
    }

    function passwordState(value) {
      return {
        length: value.length >= 6 && value.length <= 30,
        letter: /[A-Za-z]/.test(value),
        number: /[0-9]/.test(value),
        special: [...value].some(char => allowedSpecials.includes(char)),
        clean: value.length > 0 && !/[\s\u4e00-\u9fff]/.test(value),
        allowed: [...value].every(char => /[A-Za-z0-9]/.test(char) || allowedSpecials.includes(char))
      };
    }

    function passwordError(value, emptyKey = 'error.passwordRequired') {
      if (!value) return t(emptyKey);
      const state = passwordState(value);
      if (!state.clean) return t('error.passwordWhitespaceOrChinese');
      if (!state.allowed) return t('error.passwordUnsupported');
      if (!state.length) return t('error.passwordLength');
      if (!state.letter) return t('error.passwordLetter');
      if (!state.number) return t('error.passwordNumber');
      if (!state.special) return t('error.passwordSpecial');
      return '';
    }

    function updatePasswordUI(showError = false) {
      const value = passwordInput.value;
      const message = showError ? passwordError(value) : '';
      $('passwordError').textContent = message;
      passwordInput.classList.toggle('error', Boolean(message));
      passwordInput.classList.toggle('valid', Boolean(value) && !passwordError(value));
    }

    function updateNewPasswordUI(showError = false) {
      const value = newPasswordInput.value;
      const message = showError ? passwordError(value, 'error.newPasswordRequired') : '';
      $('newPasswordError').textContent = message;
      newPasswordInput.classList.toggle('error', Boolean(message));
      newPasswordInput.classList.toggle('valid', Boolean(value) && !passwordError(value));
    }

    function updateResetPasswordUI(showError = false) {
      const value = resetNewPasswordInput.value;
      const message = showError ? passwordError(value, 'error.newPasswordRequired') : '';
      $('resetNewPasswordError').textContent = message;
      resetNewPasswordInput.classList.toggle('error', Boolean(message));
      resetNewPasswordInput.classList.toggle('valid', Boolean(value) && !passwordError(value));
    }

    function validateForm() {
      const account = $('account').value.trim();
      const username = $('username').value.trim();
      const selectedSites = [...document.querySelectorAll('input[name="site"]:checked')];
      const role = $('role').value;
      const duplicate = accounts.some(item => item.account.toLowerCase() === account.toLowerCase());
      const results = [
        setError('account', 'accountError', !account ? t('error.accountRequired') : duplicate ? t('error.accountDuplicate') : ''),
        setError('username', 'usernameError', username ? '' : t('error.usernameRequired')),
        setError('role', 'roleError', role ? '' : t('error.roleRequired'))
      ];
      $('siteError').textContent = selectedSites.length ? '' : t('error.siteRequired');
      results.push(Boolean(selectedSites.length));
      const pwdMessage = passwordError(passwordInput.value);
      $('passwordError').textContent = pwdMessage;
      passwordInput.classList.toggle('error', Boolean(pwdMessage));
      passwordInput.classList.toggle('valid', !pwdMessage);
      results.push(!pwdMessage);
      return results.every(Boolean);
    }

    $('openCreate').addEventListener('click', openModal);
    $('remindLater').addEventListener('click', closeWeakPasswordPrompt);
    $('changePasswordNow').addEventListener('click', () => {
      closeWeakPasswordPrompt();
      openChangePasswordModal();
    });
    $('closeModal').addEventListener('click', closeModal);
    $('cancelCreate').addEventListener('click', closeModal);
    overlay.addEventListener('mousedown', event => { if (event.target === overlay) closeModal(); });
    $('closeChangePassword').addEventListener('click', closeChangePasswordModal);
    $('cancelChangePassword').addEventListener('click', closeChangePasswordModal);
    changePasswordOverlay.addEventListener('mousedown', event => { if (event.target === changePasswordOverlay) closeChangePasswordModal(); });
    $('closeResetPassword').addEventListener('click', closeResetPasswordModal);
    $('cancelResetPassword').addEventListener('click', closeResetPasswordModal);
    resetPasswordOverlay.addEventListener('mousedown', event => { if (event.target === resetPasswordOverlay) closeResetPasswordModal(); });
    document.addEventListener('keydown', event => {
      if (event.key !== 'Escape') return;
      if (resetPasswordOverlay.classList.contains('show')) closeResetPasswordModal();
      else if (changePasswordOverlay.classList.contains('show')) closeChangePasswordModal();
      else if (overlay.classList.contains('show')) closeModal();
      $('profileMenu').classList.remove('show');
      $('profileBtn').setAttribute('aria-expanded', 'false');
      $('languageMenu').classList.remove('show');
      $('languageBtn').setAttribute('aria-expanded', 'false');
    });

    $('languageBtn').addEventListener('click', event => {
      event.stopPropagation();
      const willOpen = !$('languageMenu').classList.contains('show');
      $('languageMenu').classList.toggle('show', willOpen);
      $('languageBtn').setAttribute('aria-expanded', String(willOpen));
      $('profileMenu').classList.remove('show');
      $('profileBtn').setAttribute('aria-expanded', 'false');
    });
    $('languageMenu').addEventListener('click', event => event.stopPropagation());
    document.querySelectorAll('.language-option').forEach(option => option.addEventListener('click', () => {
      applyLanguage(option.dataset.lang);
      $('languageMenu').classList.remove('show');
      $('languageBtn').setAttribute('aria-expanded', 'false');
    }));

    $('profileBtn').addEventListener('click', event => {
      event.stopPropagation();
      const willOpen = !$('profileMenu').classList.contains('show');
      $('profileMenu').classList.toggle('show', willOpen);
      $('profileBtn').setAttribute('aria-expanded', String(willOpen));
      $('languageMenu').classList.remove('show');
      $('languageBtn').setAttribute('aria-expanded', 'false');
    });
    $('profileMenu').addEventListener('click', event => event.stopPropagation());
    document.addEventListener('click', () => {
      $('profileMenu').classList.remove('show');
      $('profileBtn').setAttribute('aria-expanded', 'false');
      $('languageMenu').classList.remove('show');
      $('languageBtn').setAttribute('aria-expanded', 'false');
    });
    $('openChangePassword').addEventListener('click', openChangePasswordModal);
    $('logoutBtn').addEventListener('click', () => {
      $('profileMenu').classList.remove('show');
      $('profileBtn').setAttribute('aria-expanded', 'false');
      showToast(`${t('action.logout')} ${t('toast.outOfScope')}`);
    });

    passwordInput.addEventListener('input', () => updatePasswordUI(false));
    passwordInput.addEventListener('blur', () => updatePasswordUI(true));
    newPasswordInput.addEventListener('input', () => updateNewPasswordUI(false));
    newPasswordInput.addEventListener('blur', () => updateNewPasswordUI(true));
    resetNewPasswordInput.addEventListener('input', () => updateResetPasswordUI(false));
    resetNewPasswordInput.addEventListener('blur', () => updateResetPasswordUI(true));

    $('allSites').addEventListener('change', event => {
      document.querySelectorAll('input[name="site"]').forEach(input => input.checked = event.target.checked);
      $('siteError').textContent = '';
    });
    document.querySelectorAll('input[name="site"]').forEach(input => input.addEventListener('change', () => {
      const sites = [...document.querySelectorAll('input[name="site"]')];
      $('allSites').checked = sites.every(site => site.checked);
      $('siteError').textContent = sites.some(site => site.checked) ? '' : $('siteError').textContent;
    }));

    $('createForm').addEventListener('submit', event => {
      event.preventDefault();
      if (!validateForm()) {
        showToast(t('toast.checkRequired'), true);
        const firstError = document.querySelector('.input.error, .select.error');
        if (firstError) firstError.focus();
        return;
      }
      accounts.unshift({
        id: Date.now(),
        account: $('account').value.trim(),
        username: $('username').value.trim(),
        role: $('role').value,
        status: '启用',
        mfa: '待绑定'
      });
      renderRows();
      closeModal();
      showToast(t('toast.accountCreated'));
    });

    $('changePasswordForm').addEventListener('submit', event => {
      event.preventDefault();
      const currentPasswordOk = setError('currentPassword', 'currentPasswordError', $('currentPassword').value ? '' : t('error.currentPasswordRequired'));
      const newPasswordMessage = passwordError(newPasswordInput.value, 'error.newPasswordRequired');
      $('newPasswordError').textContent = newPasswordMessage;
      newPasswordInput.classList.toggle('error', Boolean(newPasswordMessage));
      newPasswordInput.classList.toggle('valid', !newPasswordMessage);
      if (!currentPasswordOk || newPasswordMessage) {
        showToast(t('toast.checkPassword'), true);
        const firstError = $('changePasswordForm').querySelector('.input.error');
        if (firstError) firstError.focus();
        return;
      }
      closeChangePasswordModal();
      showToast(t('toast.passwordChanged'));
    });

    $('resetPasswordForm').addEventListener('submit', event => {
      event.preventDefault();
      const resetPasswordMessage = passwordError(resetNewPasswordInput.value, 'error.newPasswordRequired');
      $('resetNewPasswordError').textContent = resetPasswordMessage;
      resetNewPasswordInput.classList.toggle('error', Boolean(resetPasswordMessage));
      resetNewPasswordInput.classList.toggle('valid', !resetPasswordMessage);
      if (resetPasswordMessage) {
        showToast(t('toast.checkNewPassword'), true);
        resetNewPasswordInput.focus();
        return;
      }
      const accountName = $('resetAccount').value;
      closeResetPasswordModal();
      showToast(t('toast.passwordReset', { account: accountName }));
    });

    $('searchBtn').addEventListener('click', () => {
      const account = $('accountFilter').value.trim().toLowerCase();
      const username = $('nameFilter').value.trim().toLowerCase();
      const status = $('statusFilter').value;
      const list = accounts.filter(item => (!account || item.account.toLowerCase().includes(account)) && (!username || item.username.toLowerCase().includes(username)) && (status === '全部' || item.status === status));
      renderRows(list, list.length);
    });
    $('resetBtn').addEventListener('click', () => {
      $('accountFilter').value = '';
      $('nameFilter').value = '';
      $('statusFilter').value = '全部';
      renderRows(accounts, Math.max(17, accounts.length));
    });

    applyLanguage(currentLanguage);
    setTimeout(openWeakPasswordPrompt, 180);
  </script>
</body>
</html>
