<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>T-matrix · 礼品卡服务商账户</title>
  <style>
    :root{--header:#021529;--side:#001529;--sub:#000c17;--teal:#00c1ba;--blue:#3cbafb;--line:#f0f0f0;--border:#d9d9d9;--text:rgba(0,0,0,.88);--muted:#939191}*{box-sizing:border-box}body{margin:0;min-width:1100px;background:#f3f5f9;color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif}.topbar{height:60px;display:flex;align-items:center;background:var(--header);box-shadow:0 2px 5px rgba(0,0,0,.1);color:#fff}.brand{width:188px;padding-left:30px;display:flex;align-items:center;gap:8px;font-size:29px;font-weight:600;font-style:italic;letter-spacing:-1px}.mark{width:26px;height:26px;border:3px solid #fff;border-radius:2px;display:inline-block;position:relative;transform:skewY(-8deg)}.mark:after{content:"";position:absolute;width:10px;height:15px;background:var(--header);right:-4px;bottom:-5px;border-left:3px solid #fff;border-top:3px solid #fff}.topnav{height:100%;display:flex}.topnav span{height:55px;display:flex;align-items:center;padding:0 17px;color:rgba(255,255,255,.65)}.topnav .selected{background:var(--teal);color:#fff}.header-right{margin-left:auto;display:flex;align-items:center;gap:20px;padding-right:30px}.locale{width:100px;height:32px;display:flex;align-items:center;justify-content:space-around;background:#fff;color:#333;border-radius:6px;font-size:13px}.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#dcecff 0 42%,#496e95 43%);border:2px solid #d7e7fa}.account{display:flex;align-items:center;gap:10px;font-size:13px}.layout{display:flex;min-height:calc(100vh - 60px)}aside{flex:0 0 188px;background:var(--side);color:rgba(255,255,255,.65)}.menu-group{height:45px;display:flex;align-items:center;justify-content:space-between;padding:0 18px 0 60px;color:#2fecff}.menu-sub{background:var(--sub)}.menu-item{height:55px;display:flex;align-items:center;padding-left:50px}.menu-item.current{background:var(--teal);color:#fff}.menu-section{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 18px 0 60px}main{flex:1;padding:10px 14px 28px 20px;min-width:0}.crumb{height:28px;color:var(--muted);font-size:13px;display:flex;align-items:center}.card{min-height:520px;padding:0 20px 20px;background:#fff}.tabs{height:55px;display:flex;gap:31px;border-bottom:1px solid var(--line)}.tab{height:55px;padding:0 3px;border:0;border-bottom:2px solid transparent;background:transparent;color:#666;font-size:14px;cursor:pointer}.tab.active{color:var(--teal);border-bottom-color:var(--teal)}.panel{display:none;padding-top:20px}.panel.active{display:block}.filters{display:flex;flex-wrap:wrap;align-items:center;gap:11px 20px}.filter{display:flex;align-items:center}.filter label{margin-right:8px;color:#555}.input,.select{width:200px;height:32px;padding:4px 11px;border:1px solid var(--border);border-radius:6px;background:#fff;color:#333;font-size:13px;outline:0}.input:focus,.select:focus{border-color:#40a9ff;box-shadow:0 0 0 2px rgba(24,144,255,.15)}.select{appearance:auto}.button-row{display:flex;gap:10px}.primary,.secondary{height:32px;padding:0 16px;border-radius:4px;font-size:13px;cursor:pointer}.primary{border:1px solid var(--blue);background:var(--blue);color:#fff}.primary:hover{background:#20aaf1}.secondary{border:1px solid var(--blue);background:rgba(60,186,251,.1);color:var(--blue)}.toolbar{height:61px;display:flex;align-items:flex-end;justify-content:flex-start}table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12px}thead{height:41px;background:#fafafa}th{font-weight:600;text-align:center;position:relative}th:not(:last-child):after{content:"";position:absolute;right:0;top:10px;width:1px;height:21px;background:#eee}tbody tr{height:40px;border-bottom:1px solid var(--line)}td{text-align:center;color:#333;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.link{border:0;padding:0 7px;background:none;color:#333;font-size:12px;cursor:pointer}.link:hover{color:#1677ff}.pager{display:flex;align-items:center;justify-content:center;gap:18px;height:70px;color:#333;font-size:12px}.page{width:28px;height:28px;border:1px solid #1677ff;border-radius:6px;display:grid;place-items:center;color:#1677ff}.per-page{border:1px solid var(--border);border-radius:6px;padding:6px 10px;color:#666}.overlay{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45)}.overlay.show{display:flex}.modal{width:460px;background:#fff;border-radius:8px;box-shadow:0 5px 18px rgba(0,0,0,.18)}.modal.wide{width:min(1000px,calc(100vw - 68px))}.modal.small{width:416px}.modal-head{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--line);font-size:16px;font-weight:500}.close{border:0;background:none;color:#999;font-size:23px;line-height:1;cursor:pointer}.modal-body{padding:26px 30px 18px}.account-modal-body{padding:18px 46px 14px}.notice{height:34px;display:flex;align-items:center;padding:0 12px;margin:0 0 17px 70px;border:1px solid #ffe58f;background:#fffbe6;color:#8c6d1f;font-size:13px}.notice b{margin-right:7px;color:#faad14}.field{display:flex;align-items:flex-start;min-height:51px}.field label{width:106px;padding-top:6px;text-align:right;font-size:14px}.required{color:#ff4d4f;margin-right:4px}.field-main{flex:1;margin-left:10px}.field .input,.field .select{width:100%;height:32px}.input.readonly{background:#f5f5f5;color:#aaa;cursor:not-allowed}.error{min-height:18px;margin-top:3px;color:#ff4d4f;font-size:12px}.confirm-content{display:flex;gap:14px;padding:25px 28px 4px;line-height:24px}.warning{width:22px;height:22px;flex:0 0 22px;border-radius:50%;display:grid;place-items:center;background:#faad14;color:#fff;font-weight:700}.modal-foot{height:62px;display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:0 20px;border-top:1px solid var(--line)}.modal-foot .secondary{border-color:var(--border);background:#fff;color:#333}.toast{position:fixed;z-index:9;top:76px;left:50%;transform:translateX(-50%) translateY(-10px);opacity:0;pointer-events:none;padding:9px 16px;border-radius:4px;background:rgba(0,0,0,.76);color:#fff;font-size:13px;transition:.22s ease}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.empty{padding:48px 0;text-align:center;color:#999}
    .select-wrap{position:relative}.clear-select{position:absolute;right:28px;top:1px;width:29px;height:30px;border:0;background:#fff;color:#999;font-size:18px;cursor:pointer}.clear-select:hover{color:#666}.clear-select.hidden{display:none}.group-provider-list{max-height:164px;overflow:auto;padding:4px 11px;border:1px solid var(--border);border-radius:6px;background:#fff}.group-provider-option{display:flex;align-items:center;min-height:30px;gap:8px;color:#333;cursor:pointer}.group-provider-option input{width:14px;height:14px;margin:0;accent-color:var(--blue);cursor:pointer}.group-provider-option.disabled{color:#999;cursor:not-allowed}.group-provider-option input:disabled{cursor:not-allowed}.group-provider-tip{margin-top:6px;color:#999;font-size:12px;line-height:18px}
  </style>
</head>
<body>
  <header class="topbar"><div class="brand"><i class="mark"></i><span>- matrix</span></div><nav class="topnav"><span class="selected">系统管理</span><span>业务管理</span><span>营销管理</span><span>数据统计</span></nav><div class="header-right"><div class="locale">简体中文　⌄</div><div class="account"><i class="avatar"></i><b>xiabing</b></div></div></header>
  <div class="layout"><aside><div class="menu-group">权限管理 <b>⌃</b></div><div class="menu-sub"><div class="menu-item">管理员账户</div><div class="menu-item current">礼品卡服务商账户</div><div class="menu-item">角色管理</div><div class="menu-item">积分服务商账户</div><div class="menu-item">平台客服账户</div></div><div class="menu-section">安全设置 <b>⌄</b></div><div class="menu-section">系统设置 <b>⌄</b></div><div class="menu-section">财务设置 <b>⌄</b></div></aside>
  <main><div class="crumb">系统管理 / 权限管理 / 礼品卡服务商账户</div><section class="card"><div class="tabs"><button class="tab active" data-tab="accounts">服务商账号</button><button class="tab" data-tab="groups">分组管理</button></div>
    <div class="panel active" id="accounts"><div class="filters"><div class="filter"><label>账户：</label><input class="input" id="filterAccount" placeholder="请输入账户" /></div><div class="filter"><label>用户名：</label><input class="input" id="filterUsername" placeholder="请输入用户名" /></div><div class="filter"><label>状态：</label><select class="select" id="filterStatus"><option value="">全部</option><option>启用</option><option>禁用</option></select></div><div class="button-row"><button class="primary" id="searchBtn">查询</button><button class="secondary" id="resetBtn">重置</button></div></div><div class="toolbar"><button class="primary" id="newAccountBtn">新增用户</button></div><table><thead><tr><th style="width:24%">账户</th><th style="width:24%">用户名</th><th style="width:18%">状态</th><th style="width:34%">操作</th></tr></thead><tbody id="accountRows"></tbody></table><div class="pager"><span id="accountCount">共 0 条</span><span style="color:#bbb">‹</span><span class="page">1</span><span style="color:#bbb">›</span><span class="per-page">10 条/页⌄</span></div></div>
    <div class="panel" id="groups"><div class="toolbar"><button class="primary" id="createGroupBtn">新增分组</button></div><table><thead><tr><th style="width:25%">分组名称</th><th style="width:39%">服务商</th><th style="width:21%">更新时间</th><th style="width:15%">操作</th></tr></thead><tbody id="groupRows"></tbody></table><div class="pager"><span id="groupCount">共 0 条</span><span style="color:#bbb">‹</span><span class="page">1</span><span style="color:#bbb">›</span><span class="per-page">10 条/页⌄</span></div></div>
  </section></main></div>
  <div class="overlay" id="groupOverlay"><section class="modal" role="dialog" aria-modal="true"><div class="modal-head"><span id="groupModalTitle">新增分组</span><button class="close" data-close="groupOverlay">×</button></div><div class="modal-body"><div class="field"><label><span class="required">*</span>分组名称：</label><div class="field-main"><input class="input" id="groupName" maxlength="30" placeholder="请输入分组名称" autocomplete="off" /><div class="error" id="groupError"></div></div></div><div class="field"><label>服务商：</label><div class="field-main"><div class="group-provider-list" id="groupProviderList"></div><div class="group-provider-tip">可多选；每个服务商账号仅可归属一个分组。</div></div></div></div><div class="modal-foot"><button class="secondary" data-close="groupOverlay">取消</button><button class="primary" id="saveGroupBtn">确定</button></div></section></div>
  <div class="overlay" id="accountOverlay"><section class="modal wide" role="dialog" aria-modal="true"><div class="modal-head"><span id="accountModalTitle">新增</span><button class="close" data-close="accountOverlay">×</button></div><div class="account-modal-body"><div class="field"><label><span class="required">*</span>账号：</label><div class="field-main"><input class="input" id="accountField" maxlength="50" placeholder="最多50个字符" /><div class="error" id="accountError"></div></div></div><div class="field"><label><span class="required">*</span>用户名：</label><div class="field-main"><input class="input" id="usernameField" maxlength="50" placeholder="最多50个字符" /><div class="error" id="usernameError"></div></div></div><div class="field" id="passwordRow"><label><span class="required">*</span>密码：</label><div class="field-main"><input class="input" id="passwordField" maxlength="30" type="password" placeholder="最多30个字符" /><div class="error" id="passwordError"></div></div></div></div><div class="modal-foot"><button class="secondary" data-close="accountOverlay">取消</button><button class="primary" id="saveAccountBtn">确认</button></div></section></div>
  <div class="overlay" id="deleteOverlay"><section class="modal small" role="dialog" aria-modal="true"><div class="modal-head"><span>删除确认</span><button class="close" data-close="deleteOverlay">×</button></div><div class="confirm-content"><span class="warning">!</span><div>确定删除分组“<span id="deleteName"></span>”吗？<br>删除后不可恢复，请谨慎操作。</div></div><div class="modal-foot"><button class="secondary" data-close="deleteOverlay">取消</button><button class="primary" id="confirmDelete">确定</button></div></section></div><div class="toast" id="toast" role="status"></div>
  <script>
    let groups=[{id:1,name:'默认分组',updatedAt:'2026-07-15 10:24:36',providerIds:[101]},{id:2,name:'华东区域',updatedAt:'2026-07-14 16:08:22',providerIds:[102]},{id:3,name:'重点服务商',updatedAt:'2026-07-12 09:35:18',providerIds:[]}];
    let accounts=[{id:101,account:'lilifws-yf',username:'lili服务商预发',password:'123456',status:'启用',groupId:1},{id:102,account:'Service_xb',username:'Service_xb',password:'123456',status:'启用',groupId:2},{id:103,account:'muzi_fws',username:'muzi_fws',password:'123456',status:'启用',groupId:null}];
    let editingGroupId=null,deletingGroupId=null,editingAccountId=null,filters={account:'',username:'',status:''};
    const $=id=>document.getElementById(id),now=()=>new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date()).replaceAll('/','-');
    const escapeHtml=v=>{const d=document.createElement('div');d.textContent=v;return d.innerHTML};
    const groupName=id=>groups.find(g=>g.id===id)?.name||'−';
    function toast(text){const e=$('toast');e.textContent=text;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1800)}
    function show(id){$(id).classList.add('show')} function hide(id){$(id).classList.remove('show')}
    function groupProviders(id){const group=groups.find(g=>g.id===id);return (group?.providerIds||[]).map(providerId=>accounts.find(a=>a.id===providerId)?.account).filter(Boolean)}
    function renderGroups(){$('groupCount').textContent=`共 ${groups.length} 条`;$('groupRows').innerHTML=groups.length?groups.map(g=>{const providers=groupProviders(g.id);return `<tr><td>${escapeHtml(g.name)}</td><td title="${escapeHtml(providers.join('，'))}">${providers.length?providers.map(escapeHtml).join('，'):'−'}</td><td>${g.updatedAt}</td><td><button class="link" data-group-action="edit" data-id="${g.id}">编辑</button><button class="link" data-group-action="delete" data-id="${g.id}">删除</button></td></tr>`}).join(''):'<tr><td colspan="4"><div class="empty">暂无分组数据</div></td></tr>'}
    function getFilteredAccounts(){return accounts.filter(a=>(!filters.account||a.account.toLowerCase().includes(filters.account.toLowerCase()))&&(!filters.username||a.username.toLowerCase().includes(filters.username.toLowerCase()))&&(!filters.status||a.status===filters.status))}
    function renderAccounts(){const list=getFilteredAccounts();$('accountCount').textContent=`共 ${list.length} 条`;$('accountRows').innerHTML=list.length?list.map(a=>`<tr><td>${escapeHtml(a.account)}</td><td>${escapeHtml(a.username)}</td><td>${a.status}</td><td><button class="link" data-account-action="edit" data-id="${a.id}">编辑</button><button class="link">重置密码</button><button class="link">${a.status==='启用'?'禁用':'启用'}</button><button class="link">关联服务商</button></td></tr>`).join(''):'<tr><td colspan="4"><div class="empty">暂无账号数据</div></td></tr>'}
    function renderGroupProviderList(groupId){$('groupProviderList').innerHTML=accounts.map(a=>{const occupiedBy=groups.find(g=>g.id!==groupId&&(g.providerIds||[]).includes(a.id));const checked=groupId!==null&&(groups.find(g=>g.id===groupId)?.providerIds||[]).includes(a.id);return `<label class="group-provider-option ${occupiedBy?'disabled':''}"><input type="checkbox" name="groupProvider" value="${a.id}" ${checked?'checked':''} ${occupiedBy?'disabled':''} /><span>${escapeHtml(a.account)}</span></label>`}).join('')||'<span class="group-provider-tip">暂无服务商账号</span>'}
    function openGroup(id=null){editingGroupId=id;const g=groups.find(x=>x.id===id);$('groupModalTitle').textContent=g?'编辑分组':'新增分组';$('groupName').value=g?.name||'';$('groupError').textContent='';renderGroupProviderList(id);show('groupOverlay');setTimeout(()=>$('groupName').focus(),30)}
    function openAccount(id=null){editingAccountId=id;const a=accounts.find(x=>x.id===id);$('accountModalTitle').textContent=a?'编辑':'新增';$('accountField').value=a?.account||'';$('accountField').readOnly=!!a;$('accountField').classList.toggle('readonly',!!a);$('usernameField').value=a?.username||'';$('passwordField').value='';$('passwordRow').style.display=a?'none':'flex';['accountError','usernameError','passwordError'].forEach(id=>$ (id).textContent='');show('accountOverlay');setTimeout(()=>$('usernameField').focus(),30)}
    $('createGroupBtn').onclick=()=>openGroup();$('newAccountBtn').onclick=()=>openAccount();
    $('groupRows').onclick=e=>{const b=e.target.closest('[data-group-action]');if(!b)return;const id=Number(b.dataset.id);if(b.dataset.groupAction==='edit')openGroup(id);else{deletingGroupId=id;$('deleteName').textContent=groups.find(g=>g.id===id).name;show('deleteOverlay')}};
    $('accountRows').onclick=e=>{const b=e.target.closest('[data-account-action]');if(b?.dataset.accountAction==='edit')openAccount(Number(b.dataset.id))};
    $('saveGroupBtn').onclick=()=>{const value=$('groupName').value.trim();if(!value){$('groupError').textContent='请输入分组名称';return}if(groups.some(g=>g.id!==editingGroupId&&g.name.localeCompare(value,'zh-CN',{sensitivity:'accent'})===0)){$('groupError').textContent='分组名称已存在，请重新输入';return}const selectedIds=[...document.querySelectorAll('input[name="groupProvider"]:checked')].map(input=>Number(input.value));let groupId=editingGroupId;if(editingGroupId){const g=groups.find(x=>x.id===editingGroupId);g.name=value;g.providerIds=selectedIds;g.updatedAt=now();toast('编辑成功')}else{groupId=Date.now();groups.unshift({id:groupId,name:value,updatedAt:now(),providerIds:selectedIds});toast('新增成功')}renderGroups();renderAccounts();hide('groupOverlay')};
    $('confirmDelete').onclick=()=>{groups=groups.filter(g=>g.id!==deletingGroupId);accounts.forEach(a=>{if(a.groupId===deletingGroupId)a.groupId=null});renderGroups();renderAccounts();hide('deleteOverlay');toast('删除成功')};
    $('saveAccountBtn').onclick=()=>{const account=$('accountField').value.trim(),username=$('usernameField').value.trim(),password=$('passwordField').value;let ok=true;['accountError','usernameError','passwordError'].forEach(id=>$ (id).textContent='');if(!editingAccountId&&!account){$('accountError').textContent='请输入账号';ok=false}if(!username){$('usernameError').textContent='请输入用户名';ok=false}if(!editingAccountId&&!password){$('passwordError').textContent='请输入密码';ok=false}if(!ok)return;if(editingAccountId){const a=accounts.find(x=>x.id===editingAccountId);a.username=username;toast('编辑成功')}else{accounts.unshift({id:Date.now(),account,username,password,status:'启用',groupId:null});toast('新增成功')}renderAccounts();hide('accountOverlay')};
    $('searchBtn').onclick=()=>{filters={account:$('filterAccount').value.trim(),username:$('filterUsername').value.trim(),status:$('filterStatus').value};renderAccounts()};
    $('resetBtn').onclick=()=>{filters={account:'',username:'',status:''};$('filterAccount').value='';$('filterUsername').value='';$('filterStatus').value='';renderAccounts()};
    document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===t.dataset.tab))});
    document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>hide(b.dataset.close));[$('groupOverlay'),$('accountOverlay'),$('deleteOverlay')].forEach(o=>o.onclick=e=>{if(e.target===o)hide(o.id)});document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.overlay').forEach(o=>hide(o.id))});$('groupName').oninput=()=>$('groupError').textContent='';renderGroups();renderAccounts();
  </script>
</body>
</html>
