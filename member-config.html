function applyLanguage(refresh=true){document.documentElement.lang=currentLang==='zh'?'zh-CN':'en';document.title=t('pageTitle');$$('[data-i18n]').forEach(node=>node.textContent=t(node.dataset.i18n));$('#langSelect').value=currentLang;$('#crumb').textContent=t('breadcrumb',currentSite?.name||'');if(refresh){renderSites();if(currentSite)renderAll()}const openModal=$('#levelModal').classList.contains('show');if(openModal){if(modalType==='level'&&editIndex>=0)openLevel(editIndex);else if(modalType==='benefit')openBenefit(editIndex);else if(modalType==='task'&&editIndex>=0)openTask(editIndex)}if($('#deleteConfirmModal').classList.contains('show')&&deleteBenefitIndex>=0)openDeleteBenefitConfirm(deleteBenefitIndex)}

 '<div class="form-item"><label class="req">'+t('benefitIcon')+'</label><button type="button" class="pack-icon-upload" id="packIconUpload" aria-label="'+bi('上传权益图标','Upload benefit icon')+'">'+(benefit.iconImage?'<img src="'+safeText(benefit.iconImage)+'" alt="">':packIconSvg)+'</button><input type="file" id="packIconFile" accept="image/png,image/jpeg,image/svg+xml,image/webp" hidden><input type="hidden" id="packIconValue" value="'+safeText(benefit.iconImage||'')+'"><div class="help">'+bi('支持PNG/JPG/SVG/WEBP，不超过2MB，建议64px*64px','PNG/JPG/SVG/WEBP, up to 2MB. Recommended: 64 × 64px.')+'</div><div class="pack-icon-error" id="packIconError" role="status"></div></div>'+
 '<div class="form-item"><label class="req">'+bi('各会员等级券包配置','Coupon Packs by Level')+'</label>'+levels.map(l=>{
  const selected=new Set(benefit.coupons?.[l.no]||[]);
  return '<div class="pack-select-row"><span>'+safeText(l.no)+'</span><div class="pack-select" data-level="'+safeText(l.no)+'"><div class="pack-control" role="combobox" tabindex="0" aria-expanded="false" aria-haspopup="dialog" aria-label="'+safeText(l.no+' '+bi('券包配置','coupon pack'))+'"></div><div class="pack-options" role="dialog" aria-label="'+safeText(l.no+' '+bi('选择优惠券','Select coupons'))+'" hidden>'+trustCoupons.map(c=>{
   return '<div class="pack-option"><label><input class="trust-coupon-choice" type="checkbox" value="'+safeText(c.id)+'" '+(selected.has(c.id)?'checked':'')+'>'+safeText(packCouponLabel(c))+'</label></div>';
  }).join('')+'</div></div></div>';
 }).join('')+'</div><div class="form-item"><label class="req" for="packDesc">'+t('description')+'</label><textarea class="textarea field" id="packDesc" maxlength="300">'+safeText(benefit.desc)+'</textarea></div>';
 $$('.pack-select').forEach(section=>{
  updatePackTags(section);
  const control=section.querySelector('.pack-control'),panel=section.querySelector('.pack-options');
  panel.id='pack-options-'+section.dataset.level;control.setAttribute('aria-controls',panel.id);
  control.onclick=()=>setPackDropdown(section,!section.classList.contains('is-open'));
  control.onkeydown=event=>{if(event.target!==control)return;if(['Enter',' ','ArrowDown'].includes(event.key)){event.preventDefault();setPackDropdown(section,true);if(event.key==='ArrowDown')panel.querySelector('input')?.focus();}};
  section.onkeydown=event=>{if(event.key==='Escape'){event.preventDefault();event.stopPropagation();setPackDropdown(section,false);control.focus();}};
  section.onfocusout=()=>setTimeout(()=>{if(!section.contains(document.activeElement))setPackDropdown(section,false)},0);
  section.querySelectorAll('.trust-coupon-choice').forEach(box=>box.onchange=()=>updatePackTags(section));
 });
 $('#packIconUpload').onclick=()=>$('#packIconFile').click();
 const iconValue=$('#packIconValue'),iconPreview=$('#packIconUpload'),iconError=$('#packIconError');
 $('#packIconFile').onchange=event=>{
  const file=event.target.files[0];if(!file)return;
  if(!['image/png','image/jpeg','image/svg+xml','image/webp'].includes(file.type)||file.size>2*1024*1024){iconError.textContent=bi('请上传不超过2MB的PNG/JPG/SVG/WEBP图片','Upload a PNG/JPG/SVG/WEBP image no larger than 2MB');event.target.value='';return;}
  const reader=new FileReader();
  reader.onerror=()=>iconError.textContent=bi('图片读取失败，请重试','Unable to read the image. Please retry.');
  reader.onload=()=>{const img=new Image();img.onload=()=>{iconValue.value=String(reader.result);iconPreview.innerHTML='<img src="'+safeText(reader.result)+'" alt="">';iconError.textContent=''};img.onerror=()=>iconError.textContent=bi('图片无效，请重新上传','Invalid image. Please upload another file.');img.src=String(reader.result)};
  reader.readAsDataURL(file);
 };
 $('#overlay').classList.add('show');$('#levelModal').classList.add('show');
 $('#levelModalBody').scrollTop=0;
 if(focusLevel){const section=[...$$('.pack-select')].find(node=>node.dataset.level===focusLevel);if(section){section.scrollIntoView({block:'nearest'});setPackDropdown(section,true);}}
}
$('#levelModalSave').addEventListener('click',event=>{
 if(modalType!=='trust-coupon')return;
 event.preventDefault();event.stopImmediatePropagation();
 const title=$('#packTitle').value.trim(),desc=$('#packDesc').value.trim();
 if(!title||!desc){toast(bi('请填写展示标题和描述说明','Complete the display title and description'));(!title?$('#packTitle'):$('#packDesc')).focus();return;}
 if(title.length>60||desc.length>300){toast(bi('展示标题最多60字符，描述说明最多300字符','Title: up to 60 characters; description: up to 300'));return;}
 const next={};
 $$('.pack-select').forEach(section=>{
  next[section.dataset.level]=[...new Set([...section.querySelectorAll('.trust-coupon-choice:checked')].map(box=>box.value))];
 });
 Object.assign(benefits[editIndex],{name:'等级券包',displayTitle:title,desc,iconImage:$('#packIconValue').value,coupons:next,expiry:'coupon-template',issuance:'level-upgrade'});
 levels.forEach(l=>{l.benefits=l.benefits.filter(id=>id!=='coupon');if(next[l.no]?.length)l.benefits.push('coupon')});
 renderAll();persistConfig();closeLevelModal();toast(bi('升级券包已更新','Upgrade coupon packs updated'));
},true);
const applyBaseLanguage=applyLanguage;
applyLanguage=function(refresh=true){
 const couponOpen=modalType==='trust-coupon'&&$('#levelModal').classList.contains('show');
 applyBaseLanguage(refresh);if(couponOpen)openTrustCoupon(editIndex);
};

applyLanguage();
enterSite('TrustCard');
</script>
</body></html>
