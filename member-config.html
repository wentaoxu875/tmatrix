$('#levelModalClose').onclick=$('#levelModalCancel').onclick=closeLevelModal;$('#levelModalSave').onclick=()=>{if(modalType==='level'){const l=levels[editIndex];l.name=$('#fName').value.trim()||l.name;l.growth=Number($('#fGrowth').value)||0;l.benefits=[...document.querySelectorAll('[name=levelBenefit]:checked')].map(x=>x.value);renderAll();closeLevelModal();toast(bi('等级配置已更新','Level configuration updated'));return}if(modalType==='task'){const task=tasks[editIndex],icon=$('#tIcon').value.trim(),title=$('#tTitle').value.trim(),subtitle=$('#tSubtitle').value.trim(),buttonText=$('#tButtonText').value.trim(),jumpUrl=$('#tJumpUrl').value.trim(),calc=task.type==='事件类'?'固定':$('#tCalc').value;[['#tTitle',title],['#tSubtitle',subtitle],['#tButtonText',buttonText],['#tJumpUrl',jumpUrl]].forEach(([selector,value])=>$(selector).setAttribute('aria-invalid',String(!value)));if(!icon||!title||!subtitle||!buttonText||!jumpUrl){toast(bi('请完整填写所有必填项','Complete all required fields'));return}if(buttonText.length>10){$('#tButtonText').setAttribute('aria-invalid','true');toast(bi('按钮文案不能超过10个字符','Button label cannot exceed 10 characters'));return}if(jumpUrl.length>100){$('#tJumpUrl').setAttribute('aria-invalid','true');toast(bi('跳转地址不能超过100个字符','Destination URL cannot exceed 100 characters'));return}let growth=Number($('#tGrowth').value)||0;if(calc==='比例'){growth=Math.min(100,Math.max(0,Math.round(growth*10)/10));task.growth=`1 Points = ${growth.toFixed(1)}% 成长值`}else{task.growth=String(Math.max(0,growth))}task.icon=icon;task.iconName=$('#tIconName').textContent;task.title=title;task.subtitle=subtitle;task.buttonText=buttonText;task.jumpUrl=jumpUrl;task.calc=calc;renderAll();closeLevelModal();toast(bi('成长任务已更新','Growth task updated'));return}if(modalType==='benefit'){const current=editIndex>=0?benefits[editIndex]:null;const name=$('#bName').value.trim(),displayTitle=$('#bDisplayTitle').value.trim(),desc=$('#bDesc').value.trim();if(!name||!displayTitle||!desc){toast(bi('请完整填写权益名称、展示标题和描述说明','Complete the benefit name, display title, and description'));return}if(current){if(current.type!=='系统预设')current.name=name;current.displayTitle=displayTitle;current.desc=desc;if(current.id==='premium'){current.rates={};$$('.benefit-rate').forEach(input=>current.rates[input.dataset.level]=Number(Math.max(0,Number(input.value)||0).toFixed(2)))}if(current.id==='coupon'){current.coupons={};$$('.coupon-multi').forEach(select=>{current.coupons[select.dataset.level]=[...select.querySelectorAll('.coupon-choice:checked')].map(input=>input.value)})}}else{benefits.push({id:'custom_'+Date.now(),icon:'☆',name,displayTitle,type:'自定义',desc,on:true})}renderAll();closeLevelModal();toast(bi('权益配置已更新','Benefit configuration updated'))}};$('#deleteConfirmCancel').onclick=closeDeleteBenefitConfirm;$('#deleteConfirmSubmit').onclick=deleteBenefit;$('#overlay').onclick=()=>{closeDrawer();closeLevelModal();closeDeleteBenefitConfirm()};
$('#levelModalSave').addEventListener('click',()=>{if(modalType!=='task'||$('#levelModal').classList.contains('show'))return;const input=$('#tSort'),sort=Number(input?.dataset.validatedSort);if(Number.isInteger(sort)&&sort>=1){tasks[editIndex].sort=sort;renderTasks()}});

$('#levelModalSave').addEventListener('click',event=>{if(modalType!=='level')return;const input=$('#fGrowth');if(editIndex===0){input.value='0';input.disabled=true;input.setAttribute('aria-invalid','false');return}const raw=input.value.trim(),growth=Number(raw),previous=Number(levels[editIndex-1].growth),invalid=!raw||!Number.isFinite(growth)||growth<=previous;input.setAttribute('aria-invalid',String(invalid));if(!invalid)return;event.preventDefault();event.stopImmediatePropagation();input.focus();toast(bi(`当前成长值必须大于上一等级成长值 ${previous}`,`Growth Points must be greater than the previous level threshold of ${previous}`))},true);
$('#levelModal').addEventListener('input',event=>{if(event.target.id==='fGrowth')event.target.setAttribute('aria-invalid','false')});
