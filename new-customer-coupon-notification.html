const dict={'营销管理 / 活动管理 / 消息通知管理':'Marketing / Activities / Notifications','手动通知':'Manual Notifications','自动通知':'Automatic Notifications','站点:':'Site:','触发场景:':'Trigger:','发送方式:':'Channel:','状态:':'Status:','全部站点':'All sites','全部':'All','查询':'Search','重置':'Reset','新增通知':'Add Notification','编辑通知':'Edit Notification','查看通知':'View Notification','消息名称':'Message Name','站点':'Site','触发场景':'Trigger Scenario','发送方式':'Channel','站内通知':'In-app','站外Push':'Push','启用中':'Enabled','已停用':'Disabled','状态':'Status','发送次数':'Sent','送达次数':'Delivered','点击次数':'Clicks','操作':'Actions','基础信息':'Basic Information','请选择站点':'Select a site','请选择触发场景':'Select a trigger','规则配置':'Reminder Rule','提醒天数':'Reminder Days','发送时间':'Send Time','天':'days','发送设置':'Delivery Settings','内容设置':'Content Settings','标题':'Title','正文':'Body','跳转设置':'Link Settings','跳转页面':'Destination','优惠券中心':'Coupon Center','首页':'Home','取消':'Cancel','提交':'Submit','关闭':'Close','查看':'View','编辑':'Edit','停用':'Disable','启用':'Enable','暂无手动通知':'No manual notifications','暂无匹配通知':'No matching notifications','新客优惠券发放':'New User Coupon Issued','每日未签到提醒':'Daily Check-in Reminder','长时间未活跃':'Inactive User','连续签到断签预警':'Check-in Streak Warning','订单交易失败':'Transaction Failed','订单交易成功':'Transaction Completed','新用户注册':'New Registration','请输入消息名称':'Enter a message name','请输入通知标题':'Enter a title','请输入消息正文':'Enter the message body','请输入':'Enter a value','检查条件：有可使用的新客优惠券，且没有已使用的新客优惠券':'Check conditions: At least one new user coupon is usable, and no new user coupon has been used.','请输入0至365之间的整数天数':'Enter a whole number between 0 and 365.','请选择发送时间':'Select a send time.','消息名称不能超过50个字符':'Use no more than 50 characters.','同一站点、相同发送方式下消息名称已存在':'This message name already exists for the same site and channel.','请输入通知标题（最多100个字符）':'Enter a title of up to 100 characters.','请输入消息正文（最多1000个字符）':'Enter a message of up to 1,000 characters.','保存失败，请重试':'Could not save. Please try again.','通知已保存':'Notification saved','通知已启用':'Notification enabled','通知已停用':'Notification disabled'};
let lang='zh-CN',editId=null,readonly=false,page=1,query={};
const t=s=>lang==='en'?(dict[s]||s):s;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const seed=[{id:'coupon-1',site:'TroveLoop',name:'新客优惠券到账提醒',trigger:triggers[6],channel:'push',days:1,time:'10:00',title:'Your welcome coupon is ready',body:'You have a new user coupon available. Visit the Coupon Center to use it.',destination:'coupon',enabled:true,sent:0,delivered:0,clicks:0},...Array.from({length:10},(_,i)=>({id:'existing-'+i,site:i%3===0?'TrustCard':'LuckCard',name:['每日签到提醒','活跃召回提醒','连续签到提醒','订单交易提醒'][Math.floor(i/3)]+' '+(i+1),trigger:triggers[Math.floor(i/3)],channel:i%2?'inbox':'push',title:'Reminder',body:'View your latest update.',destination:'home',enabled:true,sent:[17,17,742,732,7,19,18,2,2,7][i],delivered:[0,17,48,732,0,19,18,2,0,7][i],clicks:[0,1,1,2,0,2,1,0,0,6][i]}))];
let items=seed;try{const saved=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(saved)&&saved.every(x=>x.id&&x.name&&x.site))items=saved;lang=localStorage.getItem(KEY+'-language')||lang;}catch{}
function persist(next){try{localStorage.setItem(KEY,JSON.stringify(next));items=next;return true;}catch{return false;}}
function toast(s){$('toast').textContent=t(s);$('toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').hidden=true,2800);}
function options(el,placeholder,value){el.innerHTML=`<option value="">${t(placeholder)}</option>`+triggers.map(x=>`<option value="${esc(x)}">${t(x)}</option>`).join('');el.value=value||'';}
function setError(id,msg){$(id+'-error').textContent=t(msg);$(id).classList.toggle('invalid',!!msg);$(id).setAttribute('aria-invalid',String(!!msg));}
function duplicate(candidate,list=items){return list.some(x=>x.id!==candidate.id&&x.site===candidate.site&&x.channel===candidate.channel&&x.name.trim().toLocaleLowerCase()===candidate.name.trim().toLocaleLowerCase());}
function nameError(){const name=$('name').value.trim();return !name?'请输入消息名称':Array.from(name).length>50?'消息名称不能超过50个字符':duplicate({id:editId,site:$('site').value,name,channel:document.querySelector('[name=channel]:checked').value})?'同一站点、相同发送方式下消息名称已存在':'';}
function ruleVisibility(){const on=$('trigger').value===triggers[6];$('rule-box').hidden=!on;$('days').required=on;$('send-time').required=on;if(on)$('destination').value='coupon';$('destination').disabled=readonly||on;}
function counters(){['name','title','body'].forEach((id,i)=>$(id+'-count').textContent=Array.from($(id).value).length+' / '+[50,100,1000][i]);}
function render(){const list=items.filter(n=>(!query.site||n.site===query.site)&&(!query.trigger||n.trigger===query.trigger)&&(!query.channel||n.channel===query.channel)&&(!query.status||n.enabled===(query.status==='on')));const size=Number($('size').value),last=Math.max(1,Math.ceil(list.length/size));page=Math.min(page,last);$('rows').innerHTML=list.slice((page-1)*size,page*size).map(n=>`<tr><td>${esc(n.site)}</td><td class="notification-name">${esc(n.name)}</td><td>${t(n.trigger)}</td><td>${t(n.channel==='push'?'站外Push':'站内通知')}</td><td><span class="state ${n.enabled?'':'off'}">${t(n.enabled?'启用中':'已停用')}</span></td><td>${n.sent}</td><td>${n.delivered}</td><td>${n.clicks}</td><td>${n.delivered?(n.clicks/n.delivered*100).toFixed(2)+'%':'-'}</td><td class="row-actions"><button class="link" data-action="view" data-id="${esc(n.id)}">${t('查看')}</button><button class="link" data-action="edit" data-id="${esc(n.id)}">${t('编辑')}</button><button class="link" data-action="toggle" data-id="${esc(n.id)}">${t(n.enabled?'停用':'启用')}</button></td></tr>`).join('')||`<tr><td colspan="10" class="empty">${t('暂无匹配通知')}</td></tr>`;$('total').textContent=lang==='en'?`${list.length} total`:`共 ${list.length} 条`;$('pages').innerHTML=Array.from({length:last},(_,i)=>`<button class="page-button ${page===i+1?'current':''}" data-page="${i+1}" aria-label="${i+1}">${i+1}</button>`).join(' ');$('prev').disabled=page===1;$('next').disabled=page===last;}
function open(id=null,view=false){editId=id;readonly=view;$('notification-form').reset();$('fields').disabled=view;$('form-error').textContent='';['site','name','trigger','days','send-time','title','body'].forEach(k=>setError(k,''));const n=items.find(x=>x.id===id);if(n){['site','name','trigger','days','title','body','destination'].forEach(k=>$(k).value=n[k]??'');$('send-time').value=n.time||'';document.querySelector(`[name=channel][value=${n.channel}]`).checked=true;}$('dialog-title').textContent=t(view?'查看通知':id?'编辑通知':'新增通知');$('submit').hidden=view;$('cancel').textContent=t(view?'关闭':'取消');ruleVisibility();counters();$('notification-dialog').showModal();$('notification-dialog').querySelector('.modal-body').scrollTop=0;if(!view)$('site').focus();}
$('notification-form').onsubmit=e=>{e.preventDefault();if(readonly)return;const coupon=$('trigger').value===triggers[6];const errors={site:$('site').value?'':'请选择站点',name:nameError(),trigger:$('trigger').value?'':'请选择触发场景',days:coupon&&($('days').value===''||!Number.isInteger(Number($('days').value))||Number($('days').value)<0||Number($('days').value)>365)?'请输入0至365之间的整数天数':'','send-time':coupon&&!/^([01]\d|2[0-3]):[0-5]\d$/.test($('send-time').value)?'请选择发送时间':'',title:!$('title').value.trim()||Array.from($('title').value).length>100?'请输入通知标题（最多100个字符）':'',body:!$('body').value.trim()||Array.from($('body').value).length>1000?'请输入消息正文（最多1000个字符）':''};Object.entries(errors).forEach(([k,v])=>setError(k,v));const bad=Object.keys(errors).find(k=>errors[k]);if(bad){$(bad).focus();return;}const prev=items.find(x=>x.id===editId);const n={...(prev||{enabled:true,sent:0,delivered:0,clicks:0}),id:editId||crypto.randomUUID(),site:$('site').value,name:$('name').value.trim(),trigger:$('trigger').value,channel:document.querySelector('[name=channel]:checked').value,title:$('title').value.trim(),body:$('body').value.trim(),destination:$('destination').value,days:coupon?Number($('days').value):null,time:coupon?$('send-time').value:null,timezone:coupon?TIMEZONE:null};const next=editId?items.map(x=>x.id===editId?n:x):[n,...items];if(!persist(next)){$('form-error').textContent=t('保存失败，请重试');return;}$('notification-dialog').close();page=1;render();toast('通知已保存');};
$('rows').onclick=e=>{const b=e.target.closest('[data-action]');if(!b)return;const n=items.find(x=>x.id===b.dataset.id);if(b.dataset.action==='toggle'){if(persist(items.map(x=>x.id===n.id?{...x,enabled:!x.enabled}:x))){render();toast(n.enabled?'通知已停用':'通知已启用');}else toast('保存失败，请重试');}else open(n.id,b.dataset.action==='view');};
$('add').onclick=()=>open();document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$('notification-dialog').close());$('trigger').onchange=ruleVisibility;$('notification-form').oninput=counters;$('name').onblur=()=>setError('name',nameError());$('site').onchange=()=>{if($('name').value.trim())setError('name',nameError());};document.querySelectorAll('[name=channel]').forEach(el=>el.onchange=()=>{if($('name').value.trim())setError('name',nameError());});
$('filters').onsubmit=e=>{e.preventDefault();query=Object.fromEntries(['site','trigger','channel','status'].map(k=>[k,$('filter-'+k).value]));page=1;render();};$('reset').onclick=()=>{$('filters').reset();query={};page=1;render();};$('size').onchange=()=>{page=1;render();};$('prev').onclick=()=>{page--;render();};$('next').onclick=()=>{page++;render();};$('pages').onclick=e=>{if(e.target.dataset.page){page=Number(e.target.dataset.page);render();}};
['manual','auto'].forEach(k=>$(k+'-tab').onclick=()=>{['manual','auto'].forEach(x=>{$(x+'-tab').classList.toggle('active',k===x);$(x+'-tab').setAttribute('aria-selected',k===x);$(x+'-panel').hidden=k!==x;});});
function language(){document.documentElement.lang=lang;document.body.classList.toggle('lang-en',lang==='en');document.querySelectorAll('[data-t]').forEach(el=>{el.dataset.source=el.dataset.source||el.textContent;el.textContent=t(el.dataset.source);});document.querySelectorAll('[placeholder]').forEach(el=>{el.dataset.placeholder=el.dataset.placeholder||el.placeholder;el.placeholder=t(el.dataset.placeholder);});const current=$('trigger').value,filter=$('filter-trigger').value;options($('trigger'),'请选择触发场景',current);options($('filter-trigger'),'全部',filter);$('timezone').textContent=lang==='en'?TIMEZONE_EN:TIMEZONE_ZH;$('language-switch').value=lang;[...$('size').options].forEach(o=>o.textContent=lang==='en'?o.value+' / page':o.value+' 条/页');render();}
$('language-switch').onchange=e=>{lang=e.target.value;try{localStorage.setItem(KEY+'-language',lang);}catch{}language();};
const TIMEZONE='Asia/Shanghai',TIMEZONE_ZH='北京时间（UTC+8）',TIMEZONE_EN='Beijing Time (UTC+8)';language();
</script></body></html>
