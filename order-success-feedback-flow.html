<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Troveloop Order Success Feedback Flow</title>
  <style>
    :root {
      --brand: #123c38;
      --brand-dark: #0b2e2b;
      --brand-soft: #e7f4f0;
      --bg: #f1f3f4;
      --card: #fff;
      --line: #e4e9eb;
      --text: #17312e;
      --muted: #7b8a89;
      --tertiary: #a5afae;
      --warning: #f5b73f;
      --success: #16a36a;
      --danger: #e5484d;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      background: #e9ecef;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Arial, sans-serif;
      letter-spacing: 0;
    }

    button, textarea, input { font: inherit; }

    .prototype-panel {
      width: 375px;
      margin-top: 16px;
      padding: 10px 12px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #fff;
      box-shadow: 0 10px 28px rgba(12, 24, 30, .12);
    }

    .scenario-title {
      font-size: 13px;
      line-height: 18px;
      font-weight: 800;
      white-space: nowrap;
    }

    .scenario-control {
      display: inline-grid;
      grid-template-columns: 1fr 42px 1fr;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 16px;
      font-weight: 800;
    }

    .scenario-control input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .scenario-label { white-space: nowrap; }
    .prototype-panel[data-reward="false"] .scenario-label:first-of-type,
    .prototype-panel[data-reward="true"] .scenario-label:last-of-type { color: var(--brand); }

    .switch-track {
      width: 42px;
      height: 24px;
      border-radius: 999px;
      position: relative;
      background: #d8dee0;
      cursor: pointer;
      transition: background .18s ease;
    }

    .switch-track::after {
      content: "";
      position: absolute;
      left: 3px;
      top: 3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 8px rgba(16, 28, 26, .22);
      transition: transform .18s ease;
    }

    #rewardScenarioToggle:checked + .switch-track { background: var(--brand); }
    #rewardScenarioToggle:checked + .switch-track::after { transform: translateX(18px); }

    .phone {
      width: 375px;
      min-height: 812px;
      position: relative;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 24px 80px rgba(12, 24, 30, .22);
    }

    .status-bar {
      height: 45px;
      padding: 16px 24px 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      color: #000;
      font-size: 15px;
      line-height: 18px;
      font-weight: 700;
    }

    .system-icons {
      display: flex;
      align-items: center;
      gap: 5px;
      height: 16px;
    }

    .bars {
      width: 17px;
      height: 12px;
      display: flex;
      align-items: end;
      gap: 2px;
    }

    .bars span {
      width: 3px;
      border-radius: 2px;
      background: #000;
    }

    .bars span:nth-child(1) { height: 5px; }
    .bars span:nth-child(2) { height: 7px; }
    .bars span:nth-child(3) { height: 9px; }
    .bars span:nth-child(4) { height: 11px; }

    .wifi {
      width: 15px;
      height: 12px;
      position: relative;
    }

    .wifi::before,
    .wifi::after {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      border: 2px solid #000;
      border-left-color: transparent;
      border-right-color: transparent;
      border-bottom-color: transparent;
      border-radius: 50%;
    }

    .wifi::before {
      width: 17px;
      height: 17px;
      top: 2px;
    }

    .wifi::after {
      width: 9px;
      height: 9px;
      top: 7px;
    }

    .battery {
      width: 21px;
      height: 10px;
      border: 1.5px solid #000;
      border-radius: 3px;
      position: relative;
    }

    .battery::before {
      content: "";
      position: absolute;
      right: -4px;
      top: 3px;
      width: 2px;
      height: 4px;
      background: #000;
      border-radius: 0 2px 2px 0;
    }

    .battery::after {
      content: "";
      position: absolute;
      left: 2px;
      top: 2px;
      width: 15px;
      height: 5px;
      border-radius: 2px;
      background: #000;
    }

    .back-btn {
      position: absolute;
      left: 20px;
      top: 59px;
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--brand);
      cursor: pointer;
    }

    .back-btn::before {
      content: "";
      width: 8px;
      height: 8px;
      border-left: 2px solid currentColor;
      border-bottom: 2px solid currentColor;
      transform: rotate(45deg);
      margin-left: 3px;
    }

    .success-content {
      padding: 121px 20px 0;
      display: grid;
      justify-items: center;
    }

    .success-art {
      width: 108px;
      height: 112px;
      position: relative;
    }

    .success-art::before {
      content: "";
      position: absolute;
      left: 22px;
      top: 27px;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #bdded8;
      border: 5px solid #2c7474;
      box-shadow: inset 0 0 0 8px #d9eee9;
    }

    .check {
      position: absolute;
      left: 49px;
      top: 51px;
      width: 20px;
      height: 11px;
      border-left: 5px solid #fff;
      border-bottom: 5px solid #fff;
      transform: rotate(-45deg);
      z-index: 2;
    }

    .cash-card {
      position: absolute;
      left: 35px;
      top: 64px;
      width: 52px;
      height: 36px;
      border: 4px solid #2c7474;
      background: #bdded8;
      transform: rotate(-28deg);
      z-index: 3;
    }

    .cash-card::before {
      content: "";
      position: absolute;
      inset: 8px 9px;
      border: 2px solid rgba(44, 116, 116, .5);
      transform: rotate(10deg);
    }

    .coin {
      position: absolute;
      right: 11px;
      bottom: 4px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #2c7474;
      background: #8dbcb7;
      border: 4px solid #2c7474;
      font-size: 14px;
      font-weight: 900;
      z-index: 4;
    }

    .spark {
      position: absolute;
      width: 16px;
      height: 16px;
      color: #2c7474;
    }

    .spark::before,
    .spark::after {
      content: "";
      position: absolute;
      background: currentColor;
      border-radius: 999px;
    }

    .spark::before {
      left: 7px;
      top: 0;
      width: 3px;
      height: 16px;
    }

    .spark::after {
      left: 0;
      top: 7px;
      width: 16px;
      height: 3px;
    }

    .spark.one { left: 15px; top: 26px; transform: rotate(20deg); }
    .spark.two { right: 7px; top: 21px; transform: rotate(32deg) scale(.75); }

    .ray {
      position: absolute;
      top: 0;
      left: 50%;
      width: 4px;
      height: 17px;
      border-radius: 999px;
      background: #2c7474;
    }

    .ray.left { transform: translateX(-22px) rotate(-32deg); }
    .ray.mid { transform: translateX(-2px); }
    .ray.right { transform: translateX(18px) rotate(32deg); }

    .shadow {
      position: absolute;
      left: 32px;
      bottom: 0;
      width: 64px;
      height: 8px;
      border-radius: 50%;
      background: #d9eee9;
    }

    .success-title {
      margin: 12px 0 0;
      font-size: 16px;
      line-height: 22px;
      font-weight: 800;
    }

    .feedback-entry {
      margin-top: 28px;
      width: 100%;
      min-height: 62px;
      border: 1px solid #d8ebe7;
      border-radius: 12px;
      padding: 12px 14px;
      display: grid;
      grid-template-columns: 32px 1fr auto 14px;
      gap: 10px;
      align-items: center;
      color: var(--text);
      background: #f4fbf9;
      cursor: pointer;
      text-align: left;
    }

    .feedback-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--brand);
      font-size: 15px;
      font-weight: 900;
    }

    .feedback-main {
      min-width: 0;
    }

    .feedback-title {
      font-size: 15px;
      line-height: 20px;
      font-weight: 800;
    }

    .feedback-subtitle {
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
      line-height: 16px;
      font-weight: 600;
    }

    .reward-badge {
      padding: 4px 8px;
      border-radius: 999px;
      color: var(--success);
      background: #e8f7ef;
      font-size: 11px;
      line-height: 14px;
      font-weight: 800;
      white-space: nowrap;
    }

    .chevron {
      width: 0;
      height: 0;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-left: 6px solid currentColor;
      color: var(--brand);
    }

    .bottom-actions {
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: 42px;
      display: grid;
      grid-template-columns: 126px 1fr;
      gap: 14px;
    }

    .secondary-btn,
    .primary-btn {
      height: 40px;
      border: 0;
      border-radius: 9px;
      font-size: 13px;
      line-height: 18px;
      font-weight: 800;
      cursor: pointer;
    }

    .secondary-btn {
      color: var(--text);
      background: var(--brand-soft);
    }

    .primary-btn {
      color: #fff;
      background: var(--brand);
    }

    .home-indicator {
      position: absolute;
      left: 117px;
      bottom: 9px;
      width: 141px;
      height: 5px;
      border-radius: 999px;
      background: #000;
      z-index: 8;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      align-items: end;
      background: rgba(0, 0, 0, .48);
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s ease;
      z-index: 20;
    }

    .overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .sheet {
      padding: 10px 20px 30px;
      border-radius: 16px 16px 0 0;
      background: var(--card);
      transform: translateY(28px);
      transition: transform .22s ease;
    }

    .overlay.show .sheet {
      transform: translateY(0);
    }

    .grabber {
      width: 42px;
      height: 4px;
      margin: 0 auto 14px;
      border-radius: 999px;
      background: #d5dcde;
    }

    .sheet-head {
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .sheet-title {
      margin: 0;
      font-size: 18px;
      line-height: 24px;
      font-weight: 800;
    }

    .close-btn {
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 50%;
      background: #f4f6f7;
      color: var(--text);
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
    }

    .reward-banner {
      margin-top: 8px;
      min-height: 82px;
      padding: 12px;
      border-radius: 12px;
      display: grid;
      grid-template-columns: 42px 1fr;
      gap: 10px;
      align-items: center;
      overflow: hidden;
      position: relative;
      color: var(--text);
      background:
        radial-gradient(circle at 94% 15%, rgba(245, 183, 63, .42) 0 18px, transparent 19px),
        linear-gradient(135deg, #fff5cf 0%, #e7f7ee 48%, #d9f0ec 100%);
      border: 1px solid #cce8d7;
    }

    .reward-banner::after {
      content: "";
      position: absolute;
      right: -18px;
      bottom: -26px;
      width: 88px;
      height: 88px;
      border-radius: 50%;
      border: 14px solid rgba(255, 215, 76, .35);
    }

    .reward-medal {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      position: relative;
      color: #8a5a00;
      background: linear-gradient(135deg, #ffeb7d, #f5b73f);
      box-shadow: 0 8px 18px rgba(245, 183, 63, .26);
      font-size: 23px;
      font-weight: 800;
      z-index: 1;
    }

    .reward-copy {
      position: relative;
      z-index: 1;
    }

    .reward-title {
      font-size: 14px;
      line-height: 18px;
      font-weight: 800;
      color: var(--brand);
    }

    .reward-text {
      margin-top: 3px;
      color: #0d9367;
      font-size: 12px;
      line-height: 16px;
      font-weight: 700;
    }

    .form {
      padding-top: 20px;
    }

    .field {
      margin-bottom: 18px;
    }

    .field-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    label,
    .field-title {
      display: block;
      font-size: 14px;
      line-height: 20px;
      font-weight: 800;
    }

    .counter {
      color: var(--tertiary);
      font-size: 12px;
      line-height: 16px;
    }

    .stars {
      display: flex;
      gap: 9px;
    }

    .star {
      width: 36px;
      height: 36px;
      border: 0;
      padding: 0;
      background: transparent;
      color: #d8dee0;
      font-size: 32px;
      line-height: 36px;
      cursor: pointer;
    }

    .star.active {
      color: var(--warning);
    }

    .field-error {
      min-height: 18px;
      margin-top: 7px;
      color: var(--danger);
      font-size: 12px;
      line-height: 18px;
    }

    textarea {
      width: 100%;
      min-height: 118px;
      resize: none;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      color: var(--text);
      background: #fff;
      font-size: 14px;
      line-height: 20px;
      outline: none;
    }

    textarea:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(18, 60, 56, .08);
    }

    textarea.invalid {
      border-color: var(--danger);
      box-shadow: 0 0 0 3px rgba(229, 72, 77, .08);
    }

    textarea::placeholder {
      color: var(--tertiary);
    }

    .submit-btn {
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 8px;
      color: #fff;
      background: var(--brand);
      font-size: 16px;
      line-height: 22px;
      font-weight: 800;
      cursor: pointer;
    }

    .toast {
      position: absolute;
      left: 50%;
      top: 52%;
      min-width: 184px;
      min-height: 44px;
      padding: 11px 18px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: #fff;
      background: rgba(16, 28, 26, .88);
      font-size: 14px;
      line-height: 20px;
      font-weight: 700;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(.96);
      transition: opacity .18s ease, transform .18s ease;
      z-index: 30;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
  </style>
</head>
<body>
  <section class="prototype-panel" id="scenarioPanel" data-reward="true" aria-label="Prototype scenario control">
    <div class="scenario-title">Reward scenario</div>
    <label class="scenario-control">
      <span class="scenario-label">No reward</span>
      <input id="rewardScenarioToggle" type="checkbox" checked>
      <span class="switch-track" aria-hidden="true"></span>
      <span class="scenario-label">Rewarded</span>
    </label>
  </section>

  <main class="phone" aria-label="Troveloop order success feedback prototype">
    <div class="status-bar" aria-hidden="true">
      <div>9:41</div>
      <div class="system-icons">
        <span class="bars"><span></span><span></span><span></span><span></span></span>
        <span class="wifi"></span>
        <span class="battery"></span>
      </div>
    </div>

    <button class="back-btn" type="button" aria-label="Back"></button>

    <section class="success-content">
      <div class="success-art" aria-hidden="true">
        <span class="ray left"></span>
        <span class="ray mid"></span>
        <span class="ray right"></span>
        <span class="spark one"></span>
        <span class="spark two"></span>
        <span class="check"></span>
        <span class="cash-card"></span>
        <span class="coin">₦</span>
        <span class="shadow"></span>
      </div>
      <h1 class="success-title">Submit Success</h1>

      <button class="feedback-entry" id="feedbackEntry" type="button">
        <span class="feedback-icon" aria-hidden="true">★</span>
        <span class="feedback-main">
          <span class="feedback-title">Rate our service</span>
          <span class="feedback-subtitle">Help us improve this trade experience</span>
        </span>
        <span class="reward-badge" id="rewardBadge">Claim rewards</span>
        <span class="chevron" aria-hidden="true"></span>
      </button>
    </section>

    <div class="bottom-actions">
      <button class="secondary-btn" type="button">View Order</button>
      <button class="primary-btn" type="button">Back</button>
    </div>
    <div class="home-indicator" aria-hidden="true"></div>

    <section class="overlay" id="feedbackOverlay" aria-hidden="true">
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="feedbackTitle">
        <div class="grabber" aria-hidden="true"></div>
        <header class="sheet-head">
          <h2 class="sheet-title" id="feedbackTitle">Rate our service</h2>
          <button class="close-btn" id="closeSheet" type="button" aria-label="Close">×</button>
        </header>

        <div class="reward-banner" id="rewardBanner">
          <div class="reward-medal" aria-hidden="true">★</div>
          <div class="reward-copy">
            <div class="reward-title">Reward available</div>
            <div class="reward-text">Once your feedback is valid, you may have a chance to receive rewards.</div>
          </div>
        </div>

        <form class="form" id="rateForm" novalidate>
          <div class="field">
            <div class="field-title">Rating</div>
            <div class="stars" aria-label="Rating">
              <button class="star" type="button" data-star="1" aria-label="1 star">★</button>
              <button class="star" type="button" data-star="2" aria-label="2 stars">★</button>
              <button class="star" type="button" data-star="3" aria-label="3 stars">★</button>
              <button class="star" type="button" data-star="4" aria-label="4 stars">★</button>
              <button class="star" type="button" data-star="5" aria-label="5 stars">★</button>
            </div>
            <div class="field-error" id="ratingError" aria-live="polite"></div>
          </div>

          <div class="field">
            <div class="field-row">
              <label for="rateContent">Feedback Content</label>
              <span class="counter" id="rateCounter">0/500</span>
            </div>
            <textarea id="rateContent" maxlength="500" required placeholder="Share your experience with us"></textarea>
            <div class="field-error" id="rateContentError" aria-live="polite"></div>
          </div>

          <button class="submit-btn" type="submit">Submit</button>
        </form>
      </div>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite">Thanks for your feedback.</div>
  </main>

  <script>
    const scenarioPanel = document.getElementById("scenarioPanel");
    const rewardScenarioToggle = document.getElementById("rewardScenarioToggle");
    const feedbackEntry = document.getElementById("feedbackEntry");
    const rewardBadge = document.getElementById("rewardBadge");
    const rewardBanner = document.getElementById("rewardBanner");
    const overlay = document.getElementById("feedbackOverlay");
    const closeSheet = document.getElementById("closeSheet");
    const rateForm = document.getElementById("rateForm");
    const rateContent = document.getElementById("rateContent");
    const rateCounter = document.getElementById("rateCounter");
    const ratingError = document.getElementById("ratingError");
    const rateContentError = document.getElementById("rateContentError");
    const toast = document.getElementById("toast");
    const stars = Array.from(document.querySelectorAll(".star"));
    let currentRating = null;
    let hasSubmitted = false;

    function setRewardState(hasReward) {
      rewardBadge.hidden = !hasReward;
      rewardBanner.hidden = !hasReward;
      scenarioPanel.dataset.reward = hasReward ? "true" : "false";
    }

    function openSheet() {
      overlay.classList.add("show");
      overlay.setAttribute("aria-hidden", "false");
    }

    function hideSheet() {
      overlay.classList.remove("show");
      overlay.setAttribute("aria-hidden", "true");
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1500);
    }

    function handleFeedbackEntryClick() {
      if (hasSubmitted) {
        showToast("You have already submitted feedback.");
        return;
      }
      openSheet();
    }

    function updateStars(value) {
      currentRating = value;
      ratingError.textContent = "";
      stars.forEach((star) => {
        star.classList.toggle("active", Number(star.dataset.star) <= currentRating);
      });
    }

    function updateCounter() {
      rateCounter.textContent = `${rateContent.value.length}/500`;
    }

    function clearContentError() {
      if (rateContent.value.trim().length > 0) {
        rateContentError.textContent = "";
        rateContent.classList.remove("invalid");
      }
    }

    function validateContent() {
      if (rateContent.value.trim().length === 0) {
        rateContentError.textContent = "Please enter feedback content.";
        rateContent.classList.add("invalid");
        return false;
      }
      rateContentError.textContent = "";
      rateContent.classList.remove("invalid");
      return true;
    }

    function submitFeedback(event) {
      event.preventDefault();
      let isValid = validateContent();
      if (currentRating === null) {
        ratingError.textContent = "Please select a rating.";
        isValid = false;
      }
      if (!isValid) return;
      hasSubmitted = true;
      hideSheet();
      showToast("Thanks for your feedback.");
    }

    rewardScenarioToggle.addEventListener("change", () => {
      setRewardState(rewardScenarioToggle.checked);
    });
    feedbackEntry.addEventListener("click", handleFeedbackEntryClick);
    closeSheet.addEventListener("click", hideSheet);
    overlay.addEventListener("click", (event) => {
      if (event.target === overlay) hideSheet();
    });
    stars.forEach((star) => {
      star.addEventListener("click", () => updateStars(Number(star.dataset.star)));
    });
    rateContent.addEventListener("input", () => {
      updateCounter();
      clearContentError();
    });
    rateForm.addEventListener("submit", submitFeedback);
    setRewardState(rewardScenarioToggle.checked);
  </script>
</body>
</html>
