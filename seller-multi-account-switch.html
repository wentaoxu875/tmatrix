<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CardLight · 供销卖家多账号切换</title>
  <style>
    :root{--blue:#1595ff;--dark:#181c21;--page:#f4f7fb;--line:#e8edf4;--text:#343840;--muted:#8992a0}*{box-sizing:border-box}body{margin:0;min-width:1180px;color:var(--text);background:var(--page);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",Arial,sans-serif}.side{position:fixed;inset:0 auto 0 0;width:190px;background:var(--dark);color:#fff}.brand{height:70px;display:flex;align-items:center;gap:10px;padding:0 20px;color:#27c5e9;font-size:21px;font-weight:800}.brand i{width:35px;height:35px;border-radius:50% 50% 50% 10px;background:linear-gradient(135deg,#2bd4e3 36%,#1075ef 37%);transform:rotate(-35deg)}.side a{display:flex;gap:12px;align-items:center;height:51px;padding-left:20px;color:#f4f7fb;text-decoration:none;font-size:16px}.side a.active{color:var(--blue);background:linear-gradient(90deg,rgba(21,149,255,.18),transparent)}.side a b{color:var(--blue);font-weight:400}.shell{margin-left:190px}.top{height:59px;display:flex;align-items:center;padding:0 28px 0 9px;background:#fff;border-bottom:1px solid #e7edf4}.title{height:59px;display:flex;align-items:center;border-bottom:4px solid var(--blue);font-size:20px;font-weight:600}.actions{display:flex;align-items:center;gap:24px;margin-left:auto;color:#818791;font-size:14px}.lang{height:32px;padding:0 13px;border:1px solid #dfe3e9;background:#fff;color:#555}.blue{color:var(--blue)}.account-wrap{position:relative}.account{display:flex;gap:12px;align-items:center;border:0;background:#fff;color:#4e535b;font-size:14px;cursor:pointer}.avatar{width:30px;height:30px;border-radius:50%;background:#cfcfcf}.menu{position:absolute;top:44px;right:-8px;z-index:5;display:none;width:228px;padding:8px 0;background:#fff;border-radius:3px;box-shadow:0 6px 18px rgba(21,45,76,.2)}.menu.show{display:block}.menu-label{padding:5px 14px 7px;color:#99a1ad;font-size:12px}.menu button{display:flex;align-items:center;width:100%;min-height:38px;padding:0 14px;border:0;background:#fff;color:#4e5560;text-align:left;font-size:14px;cursor:pointer}.menu button:hover{background:#f4f9ff}.menu .current{color:var(--blue);font-weight:600}.menu .check{margin-left:auto;color:var(--blue);font-size:16px}.divider{height:1px;margin:7px 0;background:#edf0f4}.menu .more{color:var(--blue)}.main{padding:20px 9px}.card{min-height:730px;padding:20px;background:#fff;border-radius:4px;box-shadow:0 1px 4px rgba(43,66,99,.05)}.filters{display:grid;grid-template-columns:repeat(12,1fr);gap:12px 10px;align-items:center}.field{grid-column:span 3;display:flex;align-items:center;gap:8px;white-space:nowrap;color:#6c717b;font-size:14px}.field.short{grid-column:span 2}.field input,.field select{width:100%;height:33px;padding:0 10px;border:1px solid #d9dee6;background:#fff;color:#858c97;outline:0}.tools{display:flex;gap:20px;margin:14px 0 31px 20px}.btn{height:33px;padding:0 17px;border:1px solid var(--blue);border-radius:2px;background:#fff;color:var(--blue);font-size:14px}.btn.primary{background:var(--blue);color:#fff}.orders{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px}.orders th{height:60px;padding:0 10px;background:#d5d5d5;text-align:left;font-weight:500}.orders td{height:60px;padding:10px 14px;border-bottom:1px solid var(--line);word-break:break-all}.thumb{display:grid;place-items:center;width:36px;height:36px;border-radius:3px;background:#278ef9;color:#dbeaff;font-size:10px}.status{color:#9297a0}.status:before{content:"";display:inline-block;width:7px;height:7px;margin-right:7px;border-radius:50%;background:#e2e4e7}.status.ok{color:#81af45}.status.ok:before{background:#83b44b}.after{padding:3px 6px;border:1px solid var(--blue);border-radius:2px;color:var(--blue)}.link{color:var(--blue)}.toast{position:fixed;top:74px;left:50%;z-index:10;padding:10px 17px;border-radius:3px;background:rgba(0,0,0,.76);color:#fff;font-size:14px;opacity:0;transform:translate(-50%,-8px);transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
  </style>
</head>
<body>
  <aside class="side"><div class="brand"><i></i><span>CardLight</span></div><nav><a href="#"><b>▣</b>我的商品</a><a class="active" href="#"><b>▤</b>订单中心</a><a href="#"><b>●</b>个人中心</a></nav></aside>
  <div class="shell"><header class="top"><div class="title">订单中心</div><div class="actions"><button class="lang">简体中文⌄</button><span>♙&nbsp; 操作人：夏冰</span><span class="blue">♧</span><span class="blue">我的消息</span><div class="account-wrap"><button class="account" id="accountBtn"><span id="currentName">夏冰</span><i class="avatar"></i></button><div class="menu" id="menu"><div class="menu-label">已登录账号</div><div id="accountList"></div><div class="divider"></div><button class="more" id="moreBtn">⊕　登录更多账号</button><button id="logoutBtn">⇥　退出登录</button></div></div></div></header>
    <main class="main"><section class="card"><div class="filters"><label class="field">订单编号：<input placeholder="请输入订单号"></label><label class="field">订单号：<input placeholder="请输入订单号"></label><label class="field">卡号：<input placeholder="请输入卡号"></label><label class="field short">卡种：<select><option>全部卡种</option></select></label><label class="field short">订单状态：<select><option>全部状态</option></select></label><label class="field short">修改售出：<select><option></option></select></label><label class="field short">卖家：<select><option>全部卖家</option></select></label><label class="field">订单创建：<input placeholder="Start date　→　End date"></label><label class="field">用户注册时间：<input placeholder="Start date　→　End date"></label><label class="field short">订单类型：<select><option>全部订单</option></select></label></div><div class="tools"><button class="btn primary">自建订单</button><button class="btn primary">查询</button><button class="btn">重置</button><button class="btn">导出</button><button class="btn primary">指标管理</button></div><table class="orders"><thead><tr><th style="width:15%">订单编号</th><th style="width:15%">订单号</th><th style="width:14%">卡种</th><th style="width:12%">卡图</th><th style="width:14%">卡号</th><th style="width:4%">成本</th><th style="width:10%">订单状态</th><th style="width:9%">售后</th><th style="width:9%">操作</th></tr></thead><tbody id="rows"></tbody></table></section></main></div>
  <div class="toast" id="toast"></div>
  <script>
    const $=id=>document.getElementById(id);const accounts=['夏冰'];let current='夏冰';const data=[['2082641233018720258','1532320587144237056','SDOI43838398','交易取消'],['2082640432858763266','GO20260730093120755527370','DFI04834843048343','交易取消'],['2082639976480739330','GO20260730092926327293089','GFGDZ544353343434','交易取消'],['2082305165831528450','GO20260729112012660600263','J4889CFHKNT3AH','交易取消'],['2082303956873732098','GO202607291115242434653499','KJH2299SFL010','交易成功']];
    function toast(message){const t=$('toast');t.textContent=message;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),1800)}
    function renderAccounts(){$('currentName').textContent=current;$('accountList').innerHTML=accounts.map(account=>`<button class="${account===current?'current':''}" data-account="${account}"><span>${account}</span>${account===current?'<span class="check">✓</span>':''}</button>`).join('');document.querySelectorAll('[data-account]').forEach(btn=>btn.onclick=()=>{current=btn.dataset.account;renderAccounts();$('menu').classList.remove('show');toast(`已切换至账号：${current}`)})}
    function renderOrders(){$('rows').innerHTML=data.map(order=>`<tr><td>${order[0]}</td><td>${order[1]}</td><td>Razer Gift Card / America</td><td><span class="thumb">CARD</span></td><td>${order[2]}</td><td>10</td><td><span class="status ${order[3]==='交易成功'?'ok':''}">${order[3]}</span></td><td><span class="after">☻ 售后沟通</span></td><td><span class="link">成本信息</span></td></tr>`).join('')}
    function loginPage(){return `<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>登录更多账号 · CardLight</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",Arial;color:#343944}.wrap{min-height:100vh;display:grid;grid-template-columns:42% 58%}.form{padding:28px 13%}.logo{margin-bottom:58px;color:#21c0ea;font-size:29px;font-weight:800}.form h1{font-size:35px;margin:0 0 12px}.form h2{font-size:24px;margin:0 0 32px}.user{text-align:center;font-size:55px}.field{position:relative;margin:16px 0}.field input{box-sizing:border-box;width:100%;height:48px;padding:0 15px;border:1px solid #d8dde7;border-radius:5px;font-size:15px}.field label{position:absolute;top:-9px;left:16px;padding:0 7px;background:#fff}.agree,.note{color:#78839a;font-size:14px}.btn{width:100%;height:48px;border:0;border-radius:5px;background:#2d94f5;color:#fff;font-size:16px;cursor:pointer}.visual{padding:76px 10%;background:linear-gradient(145deg,#f2f6ff,#fbfdff);color:#94a6df}.visual h2{font-size:36px}.mfa{display:none}.steps{line-height:2;color:#778197}.code{display:flex;gap:12px;margin:28px 0}.code input{width:54px;height:57px;border:2px solid #d8e1f2;border-radius:12px;text-align:center;font-size:24px}.qr{width:260px;margin:100px auto;padding:34px;background:#fff;text-align:center;box-shadow:0 1px 10px #dfe8fb}.qr-box{width:150px;height:150px;margin:auto;background:repeating-linear-gradient(45deg,#111 0 5px,#fff 5px 10px)}</style><main class="wrap"><section class="form"><div class="logo">◉ CardLight</div><section id="login"><h1>Welcome To Login</h1><h2>欢迎登录CardLight</h2><div class="user">👤</div><div class="field"><label>账号</label><input id="loginAccount" placeholder="请输入邮箱" value="seller_shop_02"></div><div class="field"><label>密码</label><input type="password" placeholder="请输入密码" value="123456"></div><p class="agree">☑ 登录即代表您已同意《用户协议》和《用户隐私政策》</p><button class="btn" id="loginBtn">登录</button></section><section class="mfa" id="mfa"><h1>启用 MFA 认证</h1><p class="note">使用身份验证器扫描二维码并完成绑定，保护账户安全。</p><div class="steps"><b>1　扫描二维码</b><br>　　使用身份验证器扫描右侧二维码。<br><b>2　输入验证码</b><br>　　输入身份验证器生成的 6 位动态验证码。</div><div class="code"><input maxlength="1" autofocus><input maxlength="1"><input maxlength="1"><input maxlength="1"><input maxlength="1"><input maxlength="1"></div><button class="btn" id="verifyBtn">验证</button></section></section><aside class="visual"><h2>卖礼品卡 · 上CardLight</h2><p>高效 / 专业 / 智能</p><div class="qr"><div class="qr-box"></div><p class="note">请使用身份验证器扫描此二维码</p></div></aside></main></html>`}
    function openMoreAccounts(){const tab=window.open('','cardLightMoreAccount','width=1200,height=760');if(!tab){toast('浏览器拦截了新标签页，请允许弹窗后重试');return}tab.document.open();tab.document.write(loginPage());tab.document.close();const doc=tab.document;doc.getElementById('loginBtn').onclick=()=>{doc.getElementById('login').style.display='none';doc.getElementById('mfa').style.display='block'};doc.getElementById('verifyBtn').onclick=()=>{const account=doc.getElementById('loginAccount').value.trim()||'seller_shop_02';if(!accounts.includes(account))accounts.push(account);current=account;renderAccounts();toast(`账号 ${account} 绑定成功并已切换`);tab.close()}}
    $('accountBtn').onclick=e=>{e.stopPropagation();$('menu').classList.toggle('show')};$('moreBtn').onclick=()=>{$('menu').classList.remove('show');openMoreAccounts()};$('logoutBtn').onclick=()=>{toast('已退出登录（原型演示）');$('menu').classList.remove('show')};document.addEventListener('click',e=>{if(!e.target.closest('.account-wrap'))$('menu').classList.remove('show')});renderAccounts();renderOrders();
  </script>
</body>
</html>
