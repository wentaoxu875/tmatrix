<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>服务商工作台 - 系统设置客户管理原型</title>
  <style>
    :root {
      --page: #f4f6f7;
      --panel: #ffffff;
      --header: #ffffff;
      --text: #263c3f;
      --muted: #6f8588;
      --line: #edf1f1;
      --soft: #eef9f9;
      --brand: #ccefee;
      --brand-strong: #12beb8;
      --brand-dark: #32575b;
      --danger: #d94c4c;
      --warning: #ff8a1f;
      --shadow: 0 1px 8px rgba(38, 60, 63, .05);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 1180px;
      color: var(--text);
      background: var(--page);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      font-size: 14px;
      letter-spacing: 0;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .topbar {
      height: 86px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px 0 6px;
      background: var(--header);
      box-shadow: var(--shadow);
    }

    .brand-area,
    .user-area,
    .workspace,
    .lang {
      display: flex;
      align-items: center;
    }

    .workspace {
      width: 278px;
      gap: 12px;
    }

    .workspace-logo {
      width: 50px;
      height: 50px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: #e9f8f8;
      color: #167b7a;
      font-size: 25px;
      font-weight: 800;
    }

    .workspace-name {
      font-size: 18px;
      font-weight: 700;
      white-space: nowrap;
    }

    .chevron {
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 9px solid #243b3e;
    }

    .main-nav {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .nav-item {
      min-width: 104px;
      height: 48px;
      border: 0;
      border-radius: 7px;
      color: #20393c;
      background: transparent;
      font-size: 17px;
      font-weight: 700;
    }

    .nav-item.active {
      background: var(--brand);
    }

    .right-tools {
      display: flex;
      align-items: center;
      gap: 26px;
    }

    .avatar {
      width: 50px;
      height: 50px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: #ffffff;
      background: #0fc0bd;
      font-size: 25px;
      font-weight: 800;
    }

    .account {
      margin-left: 10px;
      line-height: 1.3;
    }

    .account strong {
      display: block;
      font-size: 19px;
      color: #233c40;
    }

    .account span {
      display: block;
      color: var(--warning);
      font-weight: 700;
    }

    .operator {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 700;
      font-size: 16px;
    }

    .operator-icon {
      font-size: 24px;
      color: #222;
    }

    .lang {
      min-width: 145px;
      height: 44px;
      justify-content: center;
      gap: 18px;
      border: 0;
      border-radius: 7px;
      background: #f4f6f7;
      color: #20393c;
      font-size: 16px;
      font-weight: 700;
    }

    .lang:hover {
      background: #eaf3f3;
    }

    .shell {
      padding: 18px 6px 24px;
    }

    .content {
      min-height: calc(100vh - 128px);
      padding: 18px 20px 28px;
      border-radius: 6px;
      background: var(--panel);
    }

    .settings-tabs {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 48px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }

    .settings-tab {
      position: relative;
      height: 48px;
      min-width: 108px;
      padding: 0 18px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 16px;
      font-weight: 700;
    }

    .settings-tab.active {
      color: var(--brand-dark);
    }

    .settings-tab.active::after {
      content: "";
      position: absolute;
      right: 18px;
      bottom: -1px;
      left: 18px;
      height: 3px;
      border-radius: 2px 2px 0 0;
      background: var(--brand-strong);
    }

    .panel {
      display: none;
    }

    .panel.active {
      display: block;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 58px;
      gap: 20px;
      margin-bottom: 14px;
    }

    .search-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .field-label {
      color: #314b4e;
      font-weight: 700;
    }

    .input {
      width: 240px;
      height: 38px;
      padding: 0 12px;
      border: 1px solid #d9e5e5;
      border-radius: 6px;
      color: var(--text);
      outline: none;
      background: #fff;
    }

    .input:focus {
      border-color: var(--brand-strong);
      box-shadow: 0 0 0 3px rgba(18, 190, 184, .12);
    }

    .btn {
      height: 38px;
      padding: 0 16px;
      border-radius: 6px;
      border: 1px solid transparent;
      font-weight: 700;
      color: #245054;
      background: #d9f4f3;
    }

    .btn:hover {
      background: #ccefee;
    }

    .btn.primary {
      color: #fff;
      background: var(--brand-strong);
    }

    .btn.primary:hover {
      background: #0da9a4;
    }

    .btn.ghost {
      color: var(--brand-dark);
      border-color: #d9e5e5;
      background: #fff;
    }

    .btn.danger {
      color: var(--danger);
      border-color: #f2d1d1;
      background: #fff6f6;
    }

    .table-wrap {
      overflow: hidden;
      border-radius: 16px 16px 0 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    thead {
      background: var(--soft);
    }

    th,
    td {
      height: 74px;
      padding: 0 20px;
      text-align: left;
      vertical-align: middle;
      border-bottom: 1px solid var(--line);
    }

    th {
      height: 62px;
      color: #314b4e;
      font-size: 16px;
      font-weight: 800;
    }

    th + th {
      border-left: 1px solid #e4efef;
    }

    td {
      color: #294245;
      font-size: 16px;
      font-weight: 650;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 4px 10px;
      border-radius: 6px;
      color: #2b5458;
      background: var(--brand);
      font-size: 14px;
      font-weight: 800;
    }

    .empty {
      display: none;
      height: 280px;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      font-weight: 700;
    }

    .empty.visible {
      display: flex;
    }

    .empty-icon {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #5d8588;
      background: #eef9f9;
      font-size: 26px;
    }

    .page-footer {
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 18px;
      color: #b8c4c5;
      font-size: 28px;
    }

    .page-number {
      width: 31px;
      height: 31px;
      display: grid;
      place-items: center;
      border: 2px solid #396469;
      border-radius: 8px;
      color: #24494e;
      background: var(--brand);
      font-size: 17px;
      font-weight: 700;
    }

    .toast {
      position: fixed;
      top: 94px;
      left: 50%;
      z-index: 30;
      min-width: 260px;
      max-width: 520px;
      padding: 12px 18px;
      border-radius: 8px;
      color: #24494e;
      background: #eafffb;
      box-shadow: 0 8px 28px rgba(38, 60, 63, .16);
      transform: translate(-50%, -16px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
      font-weight: 700;
    }

    .toast.visible {
      transform: translate(-50%, 0);
      opacity: 1;
    }

    .toast.error {
      color: #8c2c2c;
      background: #fff3f3;
    }

    .modal-mask {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(20, 38, 40, .38);
    }

    .modal-mask.open {
      display: flex;
    }

    .modal {
      width: 480px;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 18px 50px rgba(20, 38, 40, .24);
    }

    .modal-head {
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      border-bottom: 1px solid var(--line);
      font-size: 18px;
      font-weight: 800;
    }

    .close {
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 6px;
      color: #6f8588;
      background: transparent;
      font-size: 24px;
    }

    .close:hover {
      background: #f1f6f6;
    }

    .modal-body {
      padding: 24px 22px 18px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 92px 1fr;
      align-items: center;
      gap: 12px;
    }

    .help {
      margin: 10px 0 0 104px;
      color: var(--muted);
      line-height: 1.6;
    }

    .error-text {
      min-height: 22px;
      margin: 10px 0 0 104px;
      color: var(--danger);
      font-weight: 700;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      padding: 18px 22px 22px;
    }

    .confirm-box {
      width: 420px;
    }

    .confirm-copy {
      padding: 24px 22px 8px;
      color: #314b4e;
      line-height: 1.8;
      font-weight: 700;
    }

    .note {
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    @media (max-width: 1280px) {
      .main-nav {
        gap: 12px;
      }

      .nav-item {
        min-width: 88px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand-area">
      <div class="workspace">
        <div class="workspace-logo">☻</div>

      { id: "U10023886", nickname: "mary_tbay", addedAt: "2026-07-04 09:12:31" }
    ];

    let keyword = "";
    let pendingDeleteId = "";
    let currentLang = "zh";

    const tabs = document.querySelectorAll(".settings-tab");
    const profilePanel = document.getElementById("profilePanel");
    const customersPanel = document.getElementById("customersPanel");
    const customerTbody = document.getElementById("customerTbody");
    const emptyState = document.getElementById("emptyState");
    const searchInput = document.getElementById("searchInput");
    const toast = document.getElementById("toast");
    const addModal = document.getElementById("addModal");
    const nicknameInput = document.getElementById("nicknameInput");
    const addError = document.getElementById("addError");
    const confirmModal = document.getElementById("confirmModal");
    const confirmCopy = document.getElementById("confirmCopy");
    const languageToggle = document.getElementById("languageToggle");
    const languageText = document.getElementById("languageText");

    function t(key) {
      return i18n[currentLang][key] || i18n.zh[key] || key;
    }

    function applyLanguage(lang) {
      currentLang = lang;
      document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
      document.title = t("pageTitle");
      languageText.textContent = t("languageName");

      document.querySelectorAll("[data-i18n]").forEach(node => {
        node.textContent = t(node.dataset.i18n);
      });

      document.querySelectorAll("[data-i18n-attr]").forEach(node => {
        node.dataset.i18nAttr.split(";").forEach(rule => {
          const [attr, key] = rule.split(":");
          if (attr && key) node.setAttribute(attr, t(key));
        });
      });

      if (pendingDeleteId) {
        const item = customers.find(customer => customer.id === pendingDeleteId);
        if (item) confirmCopy.innerHTML = t("confirmDeleteCopy")(escapeHtml(item.nickname));
      }

      renderCustomers();
    }

    function switchTab(target) {
      tabs.forEach(tab => {
        const selected = tab.dataset.tab === target;
        tab.classList.toggle("active", selected);
        tab.setAttribute("aria-selected", selected ? "true" : "false");
      });

      profilePanel.classList.toggle("active", target === "profile");
      customersPanel.classList.toggle("active", target === "customers");
    }

    function nowText() {
      const d = new Date();
      const pad = n => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, c => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[c]));
    }

    function getVisibleCustomers() {
      const k = keyword.trim().toLowerCase();
      if (!k) return customers;
      return customers.filter(item => item.nickname.toLowerCase().includes(k));
    }

    function renderCustomers() {
      const visible = getVisibleCustomers();
      customerTbody.innerHTML = visible.map(item => `
        <tr>
          <td>${escapeHtml(item.id)}</td>
          <td>${escapeHtml(item.nickname)}</td>
          <td>${escapeHtml(item.addedAt)}</td>
          <td><button class="btn danger" data-delete="${escapeHtml(item.id)}">${t("delete")}</button></td>
        </tr>
      `).join("");
      emptyState.classList.toggle("visible", visible.length === 0);
    }

    function showToast(message, type = "success") {
      toast.textContent = message;
      toast.classList.toggle("error", type === "error");
      toast.classList.add("visible");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("visible"), 2200);
    }

    function openAddModal() {
      addError.textContent = "";
      nicknameInput.value = "";
      addModal.classList.add("open");
      addModal.setAttribute("aria-hidden", "false");
      setTimeout(() => nicknameInput.focus(), 0);
    }

    function closeAddModal() {
      addModal.classList.remove("open");
      addModal.setAttribute("aria-hidden", "true");
    }

    function addCustomer() {
      const nickname = nicknameInput.value.trim();
      addError.textContent = "";

      if (!nickname) {
        addError.textContent = t("errorNicknameRequired");
        return;
      }

      const user = userDirectory.find(item => item.nickname.toLowerCase() === nickname.toLowerCase());
      if (!user) {
        addError.textContent = t("errorUserNotFound");
        showToast(t("toastUserNotFound"), "error");
        return;
      }

      const exists = customers.some(item => item.id === user.id);
      if (exists) {
        addError.textContent = t("errorUserExists");
        showToast(t("toastUserExists"), "error");
        return;
      }

      customers.unshift({ id: user.id, nickname: user.nickname, addedAt: nowText() });
      keyword = "";
      searchInput.value = "";
      renderCustomers();
      closeAddModal();
      showToast(t("toastAddSuccess"));
    }

    function openDeleteModal(id) {
      const item = customers.find(customer => customer.id === id);
      if (!item) return;
      pendingDeleteId = id;
      confirmCopy.innerHTML = t("confirmDeleteCopy")(escapeHtml(item.nickname));
      confirmModal.classList.add("open");
      confirmModal.setAttribute("aria-hidden", "false");
    }

    function closeDeleteModal() {
      pendingDeleteId = "";
      confirmModal.classList.remove("open");
      confirmModal.setAttribute("aria-hidden", "true");
    }

    function deleteCustomer() {
      customers = customers.filter(item => item.id !== pendingDeleteId);
      renderCustomers();
      closeDeleteModal();
      showToast(t("toastDeleteSuccess"));
    }

    tabs.forEach(tab => {
      tab.addEventListener("click", () => switchTab(tab.dataset.tab));
    });

    languageToggle.addEventListener("click", () => {
      applyLanguage(currentLang === "zh" ? "en" : "zh");
    });

    document.getElementById("searchBtn").addEventListener("click", () => {
      keyword = searchInput.value;
      renderCustomers();
    });

    searchInput.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        keyword = searchInput.value;
        renderCustomers();
      }
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      keyword = "";
      searchInput.value = "";
      renderCustomers();
    });

    document.getElementById("openAddBtn").addEventListener("click", openAddModal);
    document.getElementById("closeAddBtn").addEventListener("click", closeAddModal);
    document.getElementById("cancelAddBtn").addEventListener("click", closeAddModal);
    document.getElementById("confirmAddBtn").addEventListener("click", addCustomer);
    nicknameInput.addEventListener("keydown", event => {
      if (event.key === "Enter") addCustomer();
    });

    customerTbody.addEventListener("click", event => {
      const button = event.target.closest("[data-delete]");
      if (button) openDeleteModal(button.dataset.delete);
    });

    document.getElementById("closeConfirmBtn").addEventListener("click", closeDeleteModal);
    document.getElementById("cancelDeleteBtn").addEventListener("click", closeDeleteModal);
    document.getElementById("confirmDeleteBtn").addEventListener("click", deleteCustomer);

    addModal.addEventListener("click", event => {
      if (event.target === addModal) closeAddModal();
    });

    confirmModal.addEventListener("click", event => {
      if (event.target === confirmModal) closeDeleteModal();
    });

    applyLanguage(currentLang);
  </script>
</body>
</html>
