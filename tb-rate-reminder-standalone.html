function raRefresh(){let changed=false;raData.forEach(a=>{if(a.status==='active'&&a.until<Date.now()){a.status='expired';a.event=new Date(a.until).toLocaleString('en-US',{month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit'});changed=true;}});if(changed)raSave();}
const raDate=()=>new Date().toLocaleString('en-US',{month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit'});

function raCard(a){const live=a.now>=a.target,triggered=a.status==='triggered',expired=a.status==='expired';return `<div class="ra-swipe"><button class="ra-delete" data-ra="delete" data-id="${a.id}" aria-label="Delete ${esc(a.brand)} reminder">${icon('trash')}</button><article class="ra-card ${a.status}" tabindex="0" aria-label="${esc(a.brand)} reminder; swipe left or press ArrowLeft to delete"><div class="ra-card-top"><span class="ra-tag">${esc(a.mode)}</span>${triggered?`<span class="ra-window-state ${live?'live':'missed'}">${live?'Still live':'Missed window'}</span>`:''}</div><h3>${esc(a.brand)} ${esc(a.currency)} · $${fmt(a.amount,0)} · ${esc(a.type)}${a.mode==='Normal'&&a.digits?` · ${esc(a.digits)}`:''}</h3><div class="ra-numbers"><span>Target ₦${fmt(a.target,0)}</span><span>${expired?'Last':'Now'} ₦${fmt(a.now,0)}</span></div>${!expired?`<div class="ra-track"><i style="width:${triggered&&live?100:Math.min(100,a.now/a.target*100)}%"></i></div>`:''}${a.status==='active'?`<div class="ra-foot"><span>₦${fmt(Math.max(0,a.target-a.now),0)} to go · set ${esc(a.created)}</span><button data-ra="edit" data-id="${a.id}" aria-label="Edit ${esc(a.brand)} reminder">Edit ${icon('arrow')}</button></div>`:`<p class="ra-event">${expired?`Expired ${esc(a.event||'')} · no trigger in 90 days`:live?`Fired ${esc(a.event||'')}`:`Hit ₦${fmt(a.target,0)} at ${esc(a.event||'')}`}</p><button class="${triggered&&live?'primary':'secondary'} wide ra-card-cta" data-ra="${triggered&&live?'sell':'rearm'}" data-id="${a.id}">${triggered&&live?'Sell now':'Re-arm'}</button>`}</article></div>`;}

function reminders(){raRefresh();const active=raData.filter(a=>a.status==='active').length,items=raData.filter(a=>a.status===raTab);return `<header class="topbar ra-top"><span class="icon-btn" aria-hidden="true"></span><h1>Rate Reminder List</h1><button class="icon-btn" data-ra="settings" aria-label="Reminder settings">${icon('settings')}</button></header><div class="content"><div class="ra-tabs" role="tablist" aria-label="Reminder status">${['active','triggered','expired'].map(t=>`<button role="tab" aria-selected="${t===raTab}" class="${t===raTab?'selected':''}" data-ra="tab" data-tab="${t}">${t[0].toUpperCase()+t.slice(1)}${t==='triggered'&&raData.some(a=>a.status===t)?`<span class="ra-count">${raData.filter(a=>a.status===t).length}</span>`:''}</button>`).join('')}</div>${raTab==='active'?`<p class="ra-alert-count">${active} of 10 alerts</p>`:''}<div role="tabpanel">${items.length?items.map(raCard).join(''):`<div class="ra-empty">${icon('bell')}<h3>No ${raTab} reminders</h3><p>${raTab==='active'?'Add a target rate and let us keep an eye on it.':raTab==='triggered'?'Reminders appear here when your target is reached.':'Expired reminders will appear here.'}</p><button class="primary" data-ra="new">Create Reminder</button></div>`}${['triggered','expired'].includes(raTab)?'<p class="ra-retention">Data is only retained for 30 days</p>':''}</div></div>`;}

let raSettings={overnight:false,window:'22-7',delivery:'hold',inApp:true,push:false,email:true,limit:5};try{Object.assign(raSettings,JSON.parse(localStorage.getItem(RAKEY+'-settings')||'{}'));}catch{}
raSettings.limit=[5,10,15].includes(Number(raSettings.limit))?Number(raSettings.limit):5;
let raConfirmPending=false,raFirstConfirmed=false;try{raFirstConfirmed=localStorage.getItem(RAKEY+'-first-submitted')==='yes';}catch{}
const raOriginalCloseModal=closeModal;closeModal=function(){raConfirmPending=false;raOriginalCloseModal();};
const raMarket={Amazon:1498,iTunes:1240,Steam:1485,Razer:1268,'American Express':1380};
let raDraft={mode:'Fast',type:'Physical',brand:'Steam',digits:'4118',amount:'',target:''};
function raForm(id){raRefresh();const a=raData.find(a=>a.id===id);if((!a||a.status!=='active')&&raData.filter(a=>a.status==='active').length>=10){showToast('You can have up to 10 active reminders.');return;}raEdit=a?.id||null;if(!a){raDraft={mode:'Fast',type:'Physical',brand:'Steam',digits:'4118',amount:'',target:''};go('new-reminder');return;}modal(a.status==='active'?'Edit alert':'Re-arm alert',`<form id="ra-edit-form" class="ra-form"><p class="ra-edit-product">${esc(a.brand)} ${esc(a.currency)} · $${fmt(a.amount,0)} · ${esc(a.type)}${a.mode==='Normal'&&a.digits?` · ${esc(a.digits)}`:''}</p><label for="ra-edit-target">Target rate</label><input id="ra-edit-target" placeholder="Enter target rate" type="text" inputmode="numeric" pattern="[0-9]+" value="${a.target}" required><p class="ra-hint">Current market rate is ₦${fmt(a.now)}. Target must be higher than current rate.</p><p class="ra-error" id="ra-edit-error" role="alert"></p><div class="ra-modal-actions"><button type="button" class="secondary" data-action="close">Cancel</button><button type="submit" class="primary">Save</button></div></form>`);}

function raAmountValid(value){const n=Number(value);return String(value).trim()!==''&&Number.isFinite(n)&&n>=10&&n<=2000&&Math.abs(n*100-Math.round(n*100))<1e-7;}
function raTargetError(value,now){if(String(value).trim()==='')return '';const n=Number(value);if(!Number.isFinite(n)||n<=now)return `Target rate must be higher than current rate (₦${fmt(now)}).`;if(n>now*10)return `Target rate must not exceed 10 times the current rate (₦${fmt(now*10)}).`;if(!/^[0-9]+$/.test(String(value))||!Number.isSafeInteger(n))return 'Enter a whole-number target rate.';return '';}
function raUpdateNew(){if(S.page!=='new-reminder')return;const now=raMarket[raDraft.brand];$('ra-current').hidden=!raAmountValid(raDraft.amount);$('ra-current').innerHTML=`Current market rate: ₦${fmt(now,0)} <span>(30-day high: ₦${fmt(now+55,0)})</span>`;const error=raTargetError(raDraft.target,now);$('ra-error').textContent=error;$('ra-error').hidden=!error;$('ra-target').setAttribute('aria-invalid',String(Boolean(error)));}

function raNewPage(){return `<header class="topbar ra-top"><button class="icon-btn" data-go="reminders" aria-label="Back to reminders">${icon('back')}</button><h1>New rate alert</h1><span style="width:44px"></span></header><form class="ra-form ra-new content" id="ra-form"><label>Transaction type</label><div class="ra-segment">${['Fast','Normal'].map(v=>`<button type="button" data-ra="choice" data-field="mode" data-value="${v}" aria-pressed="${raDraft.mode===v}" class="${raDraft.mode===v?'selected':''}">${v}</button>`).join('')}</div><label>Card type</label><div class="ra-segment">${['Physical','E-code'].map(v=>`<button type="button" data-ra="choice" data-field="type" data-value="${v}" aria-pressed="${raDraft.type===v}" class="${raDraft.type===v?'selected':''}">${v==='Physical'?'Physical Card':'E-Code'}</button>`).join('')}</div><label for="ra-brand">Select Gift Card</label><select id="ra-brand">${Object.keys(raMarket).map(v=>`<option ${v===raDraft.brand?'selected':''}>${v}</option>`).join('')}</select><label for="ra-currency">Select Currency</label><select id="ra-currency"><option>🇺🇸 USD</option></select>${raDraft.mode==='Normal'?`<label id="ra-digits-label">First 4 digits</label><div class="ra-segment ra-digits" role="group" aria-labelledby="ra-digits-label">${['4118','4097','Other'].map(v=>`<button type="button" data-ra="choice" data-field="digits" data-value="${v}" aria-pressed="${raDraft.digits===v}" class="${raDraft.digits===v?'selected':''}">${v}</button>`).join('')}</div>`:''}<label for="ra-amount" class="row between"><span>Amount</span><small>LIMIT: $10 - $2000</small></label><div class="ra-unit"><input id="ra-amount" type="number" min="10" max="2000" step="0.01" placeholder="Enter Trade Amount" value="${esc(raDraft.amount)}" required><span>USD</span></div><p id="ra-current" class="ra-market" ${raAmountValid(raDraft.amount)?'':'hidden'}>Current market rate: ₦${fmt(raMarket[raDraft.brand],0)} <span>(30-day high: ₦${fmt(raMarket[raDraft.brand]+55,0)})</span></p><label for="ra-target">Target rate</label><div class="ra-unit"><input id="ra-target" type="text" inputmode="numeric" pattern="[0-9]+" placeholder="Enter target rate" value="${esc(raDraft.target)}" required><span>NGN</span></div><p class="ra-error" id="ra-error" role="alert" hidden></p></form>`;}
function raSettingsModal(forSubmission=false){raConfirmPending=forSubmission;modal('Alert settings',`<div class="ra-settings-body"><p class="ra-hint">Hold & delivery</p><label class="ra-setting-row" for="ra-overnight"><b>Hold alerts overnight</b><input class="ra-switch" id="ra-overnight" type="checkbox" ${raSettings.overnight?'checked':''}></label><div class="ra-setting-selects"><select id="ra-window" aria-label="Quiet hours"><option value="22-7">10:00 PM - 7:00 AM</option><option value="23-8">11:00 PM - 8:00 AM</option></select><select id="ra-delivery" aria-label="Overnight delivery"><option value="hold">hold & deliver</option><option value="mute">mute</option></select></div><p class="ra-hint" id="ra-window-hint"></p><hr><p class="ra-hint">Default channels for new alerts</p><label class="ra-setting-row" for="ra-in-app"><b>In-App Notification</b><input class="ra-switch" id="ra-in-app" type="checkbox" ${raSettings.inApp?'checked':''}></label><label class="ra-setting-row" for="ra-push"><b>Push</b><input class="ra-switch" id="ra-push" type="checkbox" ${raSettings.push?'checked':''}></label><label class="ra-setting-row" for="ra-email"><b>Email</b><input class="ra-switch" id="ra-email" type="checkbox" ${raSettings.email?'checked':''}></label><button class="ra-warning" data-ra="permission">ⓘ Push is off in phone settings <span>Open ›</span></button><hr><label class="ra-hint" for="ra-email-limit">Email limit</label><select id="ra-email-limit">${[5,10,15].map(n=>`<option value="${n}" ${n===Number(raSettings.limit)?'selected':''}>Max ${n} alert emails / day</option>`).join('')}</select><p class="ra-hint">Extra triggers batch into one digest</p><hr><p class="ra-hint">Alert limits</p><div class="ra-setting-row"><b>Max active alerts</b><span>10</span></div><div class="ra-setting-row"><b>Auto-expire unfired after</b><span>90 days</span></div><button class="primary wide" data-ra="save-settings">${forSubmission?'Confirm & Set Alert':'Save'}</button></div>`);$('ra-window').value=raSettings.window;$('ra-delivery').value=raSettings.delivery;raSettingsHint();}
function raSettingsHint(){const held=$('ra-overnight').checked,end=$('ra-window').value==='22-7'?'7:00 AM':'8:00 AM';$('ra-window').disabled=!held;$('ra-delivery').disabled=!held;$('ra-window-hint').textContent=!held?'Overnight hold is off. Alerts arrive when triggered.':$('ra-delivery').value==='mute'?'Alerts that fire in this window are muted.':`Alerts that fire in this window arrive at ${end}`;$('ra-email-limit').disabled=!$('ra-email').checked;}
function render(reset=false){$('phone').dataset.page=S.page;$('screen').innerHTML=S.page==='reminders'?reminders():raNewPage();$('footer').innerHTML=`<div class="ra-floating"><button class="primary wide" ${S.page==='reminders'?'data-ra="new"':'type="submit" form="ra-form"'}>${S.page==='reminders'?'Create Alert':'Set Alert'}</button></div><span class="homebar"></span>`;if(S.page==='new-reminder')raUpdateNew();if(reset)$('screen').scrollTop=0;}
document.addEventListener('submit',e=>{if(!['ra-form','ra-edit-form'].includes(e.target.id))return;e.preventDefault();const editing=e.target.id==='ra-edit-form',a=raData.find(x=>x.id===raEdit),n=Number($(editing?'ra-edit-target':'ra-target').value),brand=editing?a.brand:$('ra-brand').value,now=editing?a.now:raMarket[brand];const targetError=raTargetError($(editing?'ra-edit-target':'ra-target').value,now);if(targetError){const errorNode=$(editing?'ra-edit-error':'ra-error');errorNode.textContent=targetError;errorNode.hidden=false;return;}if(editing){a.target=n;if(a.status!=='active'){a.status='active';a.created=raDate();a.until=Date.now()+90*86400000;}}else{const amount=Number($('ra-amount').value);if(!raAmountValid($('ra-amount').value)){ $('ra-error').textContent='Enter an amount from $10 to $2,000, up to 2 decimal places.';$('ra-error').hidden=false;return;}if(!raFirstConfirmed){raSettingsModal(true);return;}raData.unshift({id:'r'+Date.now(),brand,currency:'USD',amount,type:raDraft.type,mode:raDraft.mode,...(raDraft.mode==='Normal'?{digits:raDraft.digits}:{}),target:n,now,status:'active',created:raDate(),until:Date.now()+90*86400000,channels:{inApp:raSettings.inApp,push:raSettings.push,email:raSettings.email}});try{localStorage.setItem(RAKEY+'-first-submitted','yes');}catch{}}raSave();closeModal();raTab='active';go('reminders');showToast('Reminder saved.');});
document.addEventListener('input',e=>{if(S.page==='new-reminder'&&['ra-target','ra-amount'].includes(e.target.id)){raDraft[e.target.id==='ra-target'?'target':'amount']=e.target.value;raUpdateNew();}if(e.target.id==='ra-edit-target'){const a=raData.find(a=>a.id===raEdit);$('ra-edit-error').textContent=raTargetError(e.target.value,a.now);}});
document.addEventListener('change',e=>{if(e.target.id==='ra-brand'&&S.page==='new-reminder'){raDraft.brand=e.target.value;raUpdateNew();}if(['ra-overnight','ra-window','ra-delivery','ra-email'].includes(e.target.id))raSettingsHint();});
document.addEventListener('click',e=>{const b=e.target.closest('[data-ra]');if(!b)return;const a=raData.find(a=>a.id===b.dataset.id);switch(b.dataset.ra){case 'tab':raTab=b.dataset.tab;render(true);break;case 'new':raForm();break;case 'edit':raForm(a.id);break;case 'rearm':raForm(a.id);break;case 'delete':modal('Delete this alert?',`<div class="ra-delete-confirm"><p>This alert will stop monitoring rates immediately.</p><div class="ra-confirm-actions"><button class="secondary" data-action="close">Cancel</button><button class="primary" data-ra="confirm-delete" data-id="${a.id}">Delete</button></div></div>`);break;case 'confirm-delete':raData=raData.filter(a=>a.id!==b.dataset.id);raSave();closeModal();render();showToast('Reminder deleted.');break;case 'sell':modal('Current rate',`<p>${esc(a.brand)} ${esc(a.currency)} · $${fmt(a.amount,0)} · ${esc(a.type)}</p><div class="info-box"><small>Current market rate</small><h2>₦${fmt(a.now,0)} per $1</h2></div><p>Rates may change. Check the final rate when you sell this card in the Tbay app.</p><button class="primary wide" data-action="close">Got it</button>`);break;case 'choice':{const y=$('screen').scrollTop;raDraft[b.dataset.field]=b.dataset.value;render();raUpdateNew();$('screen').scrollTop=y;break;}case 'permission':showToast('Prototype: enable Push in your phone’s notification settings.');break;case 'settings':raSettingsModal();break;case 'save-settings':{const submitAfterSave=raConfirmPending;raSettings={overnight:$('ra-overnight').checked,window:$('ra-window').value,delivery:$('ra-delivery').value,inApp:$('ra-in-app').checked,push:$('ra-push').checked,email:$('ra-email').checked,limit:Number($('ra-email-limit').value)};raPush=raSettings.push;try{localStorage.setItem(RAKEY+'-settings',JSON.stringify(raSettings));}catch{}closeModal();if(submitAfterSave){raFirstConfirmed=true;$('ra-form').requestSubmit();}else showToast('Settings saved.');break;}case 'demo-trigger':case 'demo-expire':{const first=raData.find(a=>a.status==='active');if(!first){showToast('Create an active reminder first.');return;}first.status=b.dataset.ra==='demo-trigger'?'triggered':'expired';first.event=raDate();if(first.status==='triggered')first.now=first.target;raTab=first.status;raSave();go('reminders');if(first.channels?.inApp??raSettings.inApp)showToast(first.status==='triggered'?'Your target rate has been reached!':'Reminder expired.');break;}case 'reset':raData=raSeed();raSave();raTab='active';go('reminders');showToast('Reminder demo reset.');break;}});


function raIntegerField(el){return ['ra-target','ra-edit-target'].includes(el?.id);}
document.addEventListener('beforeinput',e=>{if(raIntegerField(e.target)&&e.data!==null&&!/^[0-9]*$/.test(e.data))e.preventDefault();});
document.addEventListener('paste',e=>{if(raIntegerField(e.target)&&!/^[0-9]*$/.test(e.clipboardData.getData('text')))e.preventDefault();});
document.addEventListener('keydown',e=>{if(raIntegerField(e.target)&&!e.ctrlKey&&!e.metaKey&&e.key.length===1&&!/^[0-9]$/.test(e.key))e.preventDefault();});
document.addEventListener('input',e=>{if(!raIntegerField(e.target))return;if(!/^[0-9]*$/.test(e.target.value))e.target.value=e.target.dataset.lastInteger??e.target.defaultValue;else e.target.dataset.lastInteger=e.target.value;},true);

let raPointer=null;document.addEventListener('pointerdown',e=>{const card=e.target.closest('.ra-card');if(!card||e.target.closest('button'))return;raPointer={card,x:e.clientX,y:e.clientY};});document.addEventListener('pointerup',e=>{if(!raPointer)return;const {card,x,y}=raPointer;raPointer=null;if(Math.abs(e.clientY-y)>45)return;const dx=e.clientX-x;if(dx< -35){document.querySelectorAll('.ra-swipe.revealed').forEach(el=>el.classList.remove('revealed'));card.parentElement.classList.add('revealed');}else if(dx>35)card.parentElement.classList.remove('revealed');});document.addEventListener('keydown',e=>{const card=e.target.closest('.ra-card');if(card&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();card.parentElement.classList.toggle('revealed',e.key==='ArrowLeft');}});

setInterval(()=>{if(S.page==='reminders'&&raData.some(a=>a.status==='active'&&a.until<Date.now()))render();},30000);

render();</script></body></html>
