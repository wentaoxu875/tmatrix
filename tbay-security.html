<div class="wordmark"><span>T</span>bay</div><div class="eyebrow">ACCOUNT SECURITY · PROTOTYPE</div>

<nav class="review-nav" aria-label="原型页面"><button data-route="profile"><span>01</span>个人中心</button><button data-route="security"><span>02</span>Security 安全设置</button><button data-route="password"><span>03</span>设置 / 修改登录密码</button><button data-route="email"><span>04</span>修改邮箱</button><button data-route="transaction-pin"><span>05</span>设置 / 修改交易 PIN</button></nav>
<div id="desktop-controls"></div>
</aside>
<section class="device" aria-label="Tbay mobile prototype"><div id="app" class="app"></div><div id="layer" class="layer" hidden></div><div id="toast" class="toast" role="status" aria-live="polite" hidden></div></section>
<aside class="right-rail" lang="zh-CN"><h2>当前操作路径</h2><div id="steps"></div><div class="right-note" id="flow-note"></div></aside>
</main>
<div class="review-sheet" id="review" hidden><section class="review-dialog" role="dialog" aria-modal="true" aria-labelledby="review-title" lang="zh-CN"><button class="review-close" data-action="close-review" aria-label="关闭演示设置">×</button><h2 id="review-title">演示设置</h2><div id="mobile-controls"></div></section></div>
<script>
/* Shared LOCAL PROTOTYPE state only. Digests simulate credential matching, not production storage or authentication. */
(()=>{
 'use strict';
 const key='tbay-security-demo-account';
 const digest=async value=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(value)))).map(b=>b.toString(16).padStart(2,'0')).join('');
 function read(){try{const a=JSON.parse(sessionStorage.getItem(key));return a&&a.id&&typeof a.email==='string'&&a.providers?a:null}catch{return null}}
 async function save(change){
  const previous=read(),account={id:'tbay-security-demo-account-001',email:'wentao75@gmail.com',hasPassword:true,hasPin:true,providers:{Google:'Google:standard-demo',Apple:'Apple:standard-demo'},previousEmails:[],...previous,...change};
  if(previous&&change.email&&change.email!==previous.email)account.previousEmails=[...new Set([...(previous.previousEmails||[]),previous.email])];
  if(Object.hasOwn(change,'password'))account.passwordDigest=change.password?await digest(change.password):null;
  if(Object.hasOwn(change,'pin'))account.pinDigest=change.pin?await digest(change.pin):null;
  delete account.password;delete account.pin;
  sessionStorage.setItem(key,JSON.stringify(account));return account;
 }
 async function ensure(){return read()||save({password:'Tbay1234',pin:'123456'})}
 async function matches(value,hash){return !!hash&&(await digest(value))===hash}
 window.TbaySecurityDemo={read,save,ensure,matches,reset:async()=>{sessionStorage.removeItem(key);return ensure()}};
})();
</script>
<script>

function icon(name,cls=''){return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${name==='info'?'<circle cx="12" cy="12" r="10"/>':''}<path d="${paths[name]||paths.shield}"/></svg>`}
const initialEmail='wentao75@gmail.com';
let activeOtp=null,authorization=null,pendingLogout=false;
const demo=TbaySecurityDemo;
function invalidateAuthorization(){if(activeOtp?.status==='verified')activeOtp.status='cancelled';authorization=null;state.verified=false}
function authorizationValid(purpose){return !!authorization&&state.verified&&authorization.accountId===demo.read()?.id&&authorization.purpose===purpose&&authorization.email===(purpose==='email'?state.newEmail:state.email)&&Date.now()<authorization.expiresAt&&activeOtp?.id===authorization.transactionId&&activeOtp.status==='verified'}
function consumeAuthorization(){if(activeOtp)activeOtp.status='consumed';authorization=null;state.verified=false}
function exitSecurity(confirmed=false){pendingLogout=false;invalidateAuthorization();activeOtp=null;state.challenge=null;state.loggedIn=false;state.password='';state.pin='';state.newEmail='';state.epoch++;closeModal(false);$('#app').innerHTML='';$('#app').inert=true;sessionStorage.removeItem('tbay-demo-account');sessionStorage.setItem('tbay-demo-signed-out','true');if(confirmed)sessionStorage.setItem('tbay-email-change-handoff',JSON.stringify({email:state.email,createdAt:Date.now()}));else sessionStorage.removeItem('tbay-email-change-handoff');location.replace('tbay-auth-flow.html#login')}
for(const event of ['click','input','change','submit','keydown'])document.addEventListener(event,e=>{if(pendingLogout){e.preventDefault();e.stopImmediatePropagation();exitSecurity()}},true);
const state={page:'profile',email:initialEmail,password:'Tbay1234',pin:'123456',hasPassword:true,hasPin:true,loggedIn:true,newEmail:'',verified:false,challenge:null,modal:null,busy:false,epoch:0};
let toastTimer,focusBeforeModal;
const mask=email=>{const [local,domain]=email.split('@');return (local.length>1?local.slice(0,1):'')+'*****'+(local.length>2?local.slice(-1):'')+'@'+domain};
const emailValid=email=>email.length<=254&&/^[A-Za-z0-9.!#$%&'*+/=?^_`{|}~-]+@[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?(?:\.[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?)+$/.test(email)&&!email.split('@')[0].includes('..');
function header(title,back=true){return `<header class="topnav ${title.includes('Transaction Password')?'long-title':''}">${back?`<button class="icon-btn" data-action="back" aria-label="Go back">${icon('back')}</button>`:'<span></span>'}<h1>${title}</h1><button class="mobile-review" data-action="review" aria-label="演示设置">⋯</button></header>`}
function primary(label,action,disabled=false){return `<button class="primary" ${action?`data-action="${action}" type="button"`:'type="submit"'} ${disabled?'disabled':''}>${label}</button>`}
function field(id,label,placeholder,type='text',value=''){return `<div class="field" id="${id}-field"><label for="${id}">${label}</label><div class="input-line"><input id="${id}" name="${id}" type="${type}" placeholder="${placeholder}" value="${esc(value)}" ${type==='password'?'maxlength="64" autocomplete="new-password"':type==='email'?'maxlength="254" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false"':''} aria-describedby="${id}-error">${type==='password'?`<button class="eye" type="button" data-eye="${id}" aria-label="Show ${label.toLowerCase()}" aria-pressed="false">${icon('eyeoff')}</button>`:''}</div><p class="error" id="${id}-error" role="alert"></p></div>`}
function pinField(id,label){return `<div class="field" id="${id}-field"><label id="${id}-label" for="${id}-1">${label}</label><div class="digits pin-entry" id="${id}" role="group" aria-labelledby="${id}-label">${Array.from({length:6},(_,n)=>`<input class="pin-digit" id="${id}-${n+1}" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="${label} digit ${n+1}" aria-describedby="${id}-error">`).join('')}</div><p class="error" id="${id}-error" role="alert"></p></div>`}
function pinValue(id){return $$('.pin-digit',$('#'+id)).map(i=>i.value).join('')}
function advancePin(input){const group=input.closest('.pin-entry'),inputs=$$('.pin-digit',group);if(!input.value)return;if(inputs.every(i=>i.value)&&group.id==='new-pin'){$('#confirm-pin-1').focus();return}input.nextElementSibling?.focus()}
function clearPinError(input){setError(input.closest('.pin-entry').id,'')}

function render(){let html='';switch(state.page){case 'profile':html=profile();break;case 'security':html=header('Security')+`<div class="security-list"><button class="security-row" data-route="transaction-pin"><strong>Transaction Password</strong><span>${state.hasPin?'Change PIN':'Set PIN'}</span>${icon('chevron')}</button><button class="security-row" data-route="password"><strong>Login Password</strong><span>${state.hasPassword?'Change Password':'Set Password'}</span>${icon('chevron')}</button><button class="security-row" data-route="email"><strong>Change Email</strong><span>Start process</span>${icon('chevron')}</button></div>`;break;case 'password':html=header(state.hasPassword?'Change Login Password':'Set Login Password')+`<div class="screen"><p class="lead">Verify your current email address to ${state.hasPassword?'change':'set'} your login password.</p>${currentEmail()}<div class="info">${icon('info')}<span>To secure your account, we need to verify your email before ${state.hasPassword?'changing':'setting'} your login password.</span></div><div class="bottom-action">${primary('Send Email Verification','send-password')}</div></div>`;break;case 'transaction-pin':html=header(state.hasPin?'Change Transaction Password':'Set Transaction Password')+`<div class="screen"><p class="lead">${state.hasPin?'Change':'Set'} a transaction password to protect withdrawals, asset security, and sensitive transactions.</p>${currentEmail()}<div class="info">${icon('info')}<span>To secure your account, we need to verify your email before ${state.hasPin?'changing':'setting'} your transaction password.</span></div><div class="bottom-action">${primary('Send Email Verification','send-pin')}</div></div>`;break;case 'new-pin':html=header('New Transaction PIN')+`<form id="pin-form" class="screen" novalidate><p class="lead">Enter and confirm a 6-digit transaction password.</p><div class="password-fields">${pinField('new-pin','Password','Enter 6 digits transaction password')}${pinField('confirm-pin','Confirm Password','Confirm the transaction password')}</div><div class="bottom-action">${primary('Confirm')}</div></form>`;break;case 'new-password':html=header('New Password Entry')+`<form id="password-form" class="screen" novalidate><p class="lead">Create a strong password to protect your account.</p><div class="password-fields">${field('new-password','New Password','Enter the new password','password')}${field('confirm-password','Confirm New Password','Confirm the new password','password')}<p class="hint">Use 8–20 characters with letters and numbers only.<br>Include at least one letter and one number.</p></div><div class="bottom-action">${primary('Confirm')}</div></form>`;break;case 'email':html=header('Change Your Email ID')+`<form id="email-form" class="screen" novalidate><p class="lead">Enter and verify your new email address to update the email ID linked to your Tbay account.</p>${currentEmail()}${field('new-email','Enter your new email address','Enter your new email address','email',state.newEmail)}<div class="bottom-action">${primary('Send Email Verification',null,!emailValid(state.newEmail.trim()))}</div></form>`;break;}$('#app').innerHTML=html;$('#app').scrollTop=0;$$('.review-nav button').forEach(b=>{b.classList.toggle('active',b.dataset.route===state.page||(state.page==='new-password'&&b.dataset.route==='password')||(state.page==='new-pin'&&b.dataset.route==='transaction-pin'));b.disabled=!state.loggedIn});updateSteps();renderControls()}
function controls(){return `<section class="review-card"><h2>账户状态 · 演示切换</h2><label class="switch-row">登录密码<select data-config="password" ${state.busy?'disabled':''}><option value="yes" ${state.hasPassword?'selected':''}>已设置</option><option value="no" ${!state.hasPassword?'selected':''}>未设置</option></select></label><label class="switch-row">交易 PIN<select data-config="pin" ${state.busy?'disabled':''}><option value="yes" ${state.hasPin?'selected':''}>已设置</option><option value="no" ${!state.hasPin?'selected':''}>未设置</option></select></label><button class="text-btn" data-action="reset" ${state.busy?'disabled':''}>重置演示</button></section><section class="review-card"><h2>演示数据</h2><p>邮箱验证码：<code>1234</code><br>当前交易 PIN：<code>${state.hasPin?(state.pin?esc(state.pin):'最近设置值'):'未设置'}</code><br>初始登录密码：<code>Tbay1234</code></p><p style="margin-top:10px">验证码按截图使用 4 位；60 秒可重发，5 分钟过期。输入完整后自动校验，也支持确认按钮。</p><p style="margin-top:10px">邮件与账户操作均为本地模拟；本标签页跨页共享演示账户，重置演示恢复默认。修改登录密码或交易 PIN 后保持登录；修改邮箱后自动退出。</p><button class="text-btn" data-action="expire" ${!state.challenge||state.busy?'disabled':''}>模拟验证码过期</button><br><button class="text-btn" data-action="simulate-unknown">模拟更新异常（下次操作登出）</button><p>演示账户保留 Google / Apple 各一个绑定。OTP 在账户内仅一个当前事务。</p><br><a href="Tbay-design.md" target="_blank">Tbay H5 设计规范 ↗</a></section>`}
function renderControls(){$('#desktop-controls').innerHTML=controls();$('#mobile-controls').innerHTML=controls()}
function updateSteps(){let list,index,note;if(['transaction-pin','new-pin'].includes(state.page)){list=['Security','验证当前邮箱','输入并确认 6 位 PIN','返回 Security'];index=state.page==='new-pin'?2:1;note='设置与修改均先验证当前邮箱。两次 PIN 一致后保存；成功后保持登录，邮箱变更使用最新 PIN 校验。'}else if(['password','new-password'].includes(state.page)){list=['Security','验证当前邮箱','设置新密码','返回 Security'];index=state.page==='new-password'?2:1;note='首次设置与修改共用邮箱验证流程。密码规则沿用项目规范。'}else if(state.page==='email'){list=['输入新邮箱','验证新邮箱','校验 6 位交易 PIN','修改成功并退出登录'];index=state.modal==='pin'?2:state.modal==='otp'?1:0;note='需先设置交易 PIN 才能修改邮箱。新邮箱验证码通过后，必须通过交易 PIN 校验才会修改邮箱。'}else{list=['Personal Center','Security','选择登录密码、PIN 或邮箱'];index=state.page==='security'?1:0;note='Security 提供 Transaction Password、Login Password 和 Change Email 三个入口。交易 PIN 入口随账户状态显示 Set PIN 或 Change PIN；未设置 PIN 时点击修改邮箱，仅提示先完成 PIN 设置。'}$('#steps').innerHTML=list.map((t,i)=>`<div class="step ${i===index?'current':''}"><b>${i+1}</b><strong>${t}</strong></div>`).join('');$('#flow-note').textContent=note}
function go(page){if(state.busy)return;if(!state.loggedIn){location.replace('tbay-auth-flow.html#login');return}if(page==='email'&&!state.hasPin){toast('Please set your transaction PIN first.');return}if(page==='new-password'&&!state.verified)page='password';if(page==='new-pin'&&(!state.verified||state.challenge?.purpose!=='pin-management'))page='transaction-pin';state.epoch++;closeModal(false);invalidateAuthorization();state.challenge=null;state.page=page;render()}
function toast(message,success=false,duration=2300){clearTimeout(toastTimer);$('#toast').innerHTML=(success?icon('check'):'')+esc(message);$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,duration)}
function setError(id,message){$('#'+id+'-error').textContent=message;$('#'+id+'-field').classList.toggle('invalid',!!message);const target=$('#'+id);(target.matches('.pin-entry')?$$('input',target):[target]).forEach(input=>input.setAttribute('aria-invalid',String(!!message)))}
function busy(button,label,callback){if(state.busy)return;state.busy=true;const epoch=state.epoch,old=button?.innerHTML;if(button){button.disabled=true;button.innerHTML=`<span class="spinner" aria-hidden="true"></span>${label}`;}const codeForm=$('#code-form');if(codeForm){codeForm.setAttribute('aria-busy','true');$$('.digit',codeForm).forEach(i=>i.readOnly=true)}$('#app').setAttribute('aria-busy','true');setTimeout(()=>{if(epoch!==state.epoch)return;state.busy=false;$('#app').removeAttribute('aria-busy');if(codeForm?.isConnected){codeForm.removeAttribute('aria-busy');$$('.digit',codeForm).forEach(i=>i.readOnly=false)}if(button?.isConnected){button.disabled=false;button.innerHTML=old}callback();renderControls()},450)}
function closeModal(restore=true){$('#layer').hidden=true;$('#layer').innerHTML='';$('#layer').className='layer';$('#app').inert=false;state.modal=null;if(restore&&focusBeforeModal?.isConnected)focusBeforeModal.focus();updateSteps()}
function openModal(type,content){focusBeforeModal=document.activeElement;state.modal=type;$('#app').inert=true;$('#layer').className='layer'+(type==='pin'?' pin-layer':'');$('#layer').innerHTML=content;$('#layer').hidden=false;updateSteps();requestAnimationFrame(()=>$('.digit')?.focus())}
function digits(count,pin=false){return `<div class="digits" role="group" aria-label="${pin?'6-digit transaction PIN':'4-digit email verification code'}">${Array.from({length:count},(_,i)=>`<input class="digit" type="${pin?'password':'text'}" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="${i===0&&!pin?'one-time-code':'off'}" aria-label="${pin?'PIN':'Code'} digit ${i+1}" aria-describedby="code-error">`).join('')}</div>`}
function startOtp(purpose,email,button){
 const prior=activeOtp;
 if(prior&&Date.now()<prior.resendAt){if(prior.status==='pending'&&prior.purpose===purpose&&prior.email===email&&Date.now()<prior.expiresAt){state.challenge=prior;showOtp()}else toast('Please wait before requesting another verification code.');return}
 busy(button,'Sending…',()=>{invalidateAuthorization();activeOtp={id:crypto.randomUUID(),accountId:demo.read().id,purpose,email,resendAt:Date.now()+60000,expiresAt:Date.now()+300000,attempts:0,status:'pending'};state.challenge=activeOtp;showOtp()})
}
function showOtp(){const c=state.challenge;openModal('otp',`<section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><button class="close" data-action="close-modal" aria-label="Close verification">${icon('close')}</button><h2 id="modal-title">Enter Verification Code</h2><p class="modal-subtitle">Verification code sent to<br>${esc(mask(c.email))}</p><form id="code-form" novalidate>${digits(4)}<p id="code-error" class="error" role="alert"></p><button class="resend" type="button" data-action="resend"></button>${primary('Confirm',null,true)}</form></section>`);tick();renderControls()}
function showPin(){openModal('pin',`<section class="pin-sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title"><button class="close" data-action="close-modal" aria-label="Close PIN verification">${icon('close')}</button><h2 id="modal-title">Enter 6-digit transaction PIN</h2><form id="code-form" novalidate>${digits(6,true)}<p id="code-error" class="error" role="alert"></p></form></section>`)}
function codeError(message){$('#code-error').textContent=message;$$('.digit').forEach(i=>{i.value='';i.setAttribute('aria-invalid','true')});if($('#code-form .primary'))$('#code-form .primary').disabled=true;$('.digit').focus()}
async function verifyCode(){
 if(state.busy)return;const pin=state.modal==='pin',code=$$('.digit').map(i=>i.value).join('');if(code.length!==(pin?6:4))return;
 const c=state.challenge,button=$('#code-form .primary');if(!c||activeOtp?.id!==c.id||c.accountId!==demo.read()?.id)return;
 if(!pin&&(c.status!=='pending'||Date.now()>=c.expiresAt)){codeError('Code expired. Please resend a new code.');return}
 if(pin&&!authorizationValid('email')){invalidateAuthorization();closeModal();toast('Your verification session has expired. Please verify your email again.');return}
 state.busy=true;const correct=pin?await demo.matches(code,demo.read().pinDigest):code==='1234';state.busy=false;
 if(!correct){c.attempts++;codeError(pin?'Incorrect PIN. Please try again.':'Incorrect code. Please try again.');return}
 busy(button,'Verifying…',async()=>{
  if(activeOtp?.id!==c.id)return;
  if(pin){if(!authorizationValid('email')){invalidateAuthorization();closeModal();toast('Your verification session has expired. Please verify your email again.');return}await finishEmail();return}
  if(c.status!=='pending'||Date.now()>=c.expiresAt){codeError('Code expired. Please resend a new code.');return}
  c.status='verified';state.verified=true;authorization={accountId:c.accountId,transactionId:c.id,purpose:c.purpose,email:c.email,expiresAt:Date.now()+300000};
  if(c.purpose==='pin-management'){closeModal(false);state.page='new-pin';render()}else if(c.purpose==='password'){closeModal(false);state.page='new-password';render()}else if(c.purpose==='email'){showPin()}
 })
}
async function finishEmail(){
 if(!authorizationValid('email'))return;
 const email=state.challenge.email;state.busy=true;
 try{await demo.save({email});state.email=email;consumeAuthorization();exitSecurity(true)}catch{state.busy=false;pendingLogout=true;toast('Please sign in again to confirm your account status.',false,60000)}
}
function tick(){if(state.modal!=='otp')return;const b=$('[data-action="resend"]'),seconds=Math.max(0,Math.ceil((state.challenge.resendAt-Date.now())/1000));b.disabled=seconds>0||state.busy;b.textContent=seconds?`Resend Code ${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`:'Resend Code'}setInterval(tick,500);
function back(){if(state.modal){invalidateAuthorization();closeModal();return}if(state.page==='new-password'){state.verified=false;go('password')}else if(state.page==='new-pin'){state.verified=false;go('transaction-pin')}else if(['password','email','transaction-pin'].includes(state.page))go('security');else if(state.page==='security')go('profile');else toast('You are in Personal Center.')}
async function reset(){await demo.reset();activeOtp=null;authorization=null;pendingLogout=false;Object.assign(state,{email:initialEmail,password:'Tbay1234',pin:'123456',hasPassword:true,hasPin:true,loggedIn:true,newEmail:'',verified:false,challenge:null});go('profile');toast('Demo reset.')}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled||state.busy)return;if(b.dataset.route){go(b.dataset.route);return}if(b.dataset.eye){const i=$('#'+b.dataset.eye),show=i.type==='password';i.type=show?'text':'password';b.innerHTML=icon(show?'eye':'eyeoff');b.setAttribute('aria-label',(show?'Hide ':'Show ')+$('label[for="'+i.id+'"]').textContent.toLowerCase());b.setAttribute('aria-pressed',String(show));return}switch(b.dataset.action){case 'back':back();break;case 'outside':toast('This preview focuses on account security.');break;case 'send-pin':startOtp('pin-management',state.email,b);break;case 'send-password':startOtp('password',state.email,b);break;case 'close-modal':invalidateAuthorization();closeModal();break;case 'resend':startOtp(state.challenge.purpose,state.challenge.email,b);break;case 'simulate-unknown':pendingLogout=true;toast('Please sign in again to confirm your account status.',false,60000);break;case 'reset':reset();break;case 'expire':if(state.challenge){state.challenge.expiresAt=0;state.challenge.resendAt=0;tick();toast('Demo verification code expired.')}break;case 'review':$('#review').hidden=false;$('#app').inert=true;$('#review .review-close').focus();break;case 'close-review':$('#review').hidden=true;$('#app').inert=!!state.modal;$('.mobile-review')?.focus();break}});
document.addEventListener('change',async e=>{const config=e.target.dataset.config;if(!config)return;if(state.busy){renderControls();return}state.hasPassword=config==='password'?e.target.value==='yes':state.hasPassword;state.hasPin=config==='pin'?e.target.value==='yes':state.hasPin;if(config==='pin')state.pin=state.hasPin?'123456':'';if(config==='password')state.password=state.hasPassword?'Tbay1234':'';activeOtp=null;invalidateAuthorization();await demo.save({hasPassword:state.hasPassword,hasPin:state.hasPin,...(config==='password'?{password:state.password}:{}),...(config==='pin'?{pin:state.pin}:{})});state.loggedIn=true;state.newEmail='';go('security');if(!$('#review').hidden)$('#app').inert=true});
document.addEventListener('input',e=>{const i=e.target;if(state.busy)return;if(i.classList.contains('pin-digit')){const text=i.value.replace(/\D/g,'');if(text.length>1){enterPinDigits(i,text)}else{i.value=text;clearPinError(i);advancePin(i)}return}if(i.classList.contains('digit')){i.value=i.value.replace(/\D/g,'').slice(-1);i.setAttribute('aria-invalid','false');$('#code-error').textContent='';if(i.value)i.nextElementSibling?.focus();const complete=$$('.digit').every(el=>el.value);if($('#code-form .primary'))$('#code-form .primary').disabled=!complete;if(complete)verifyCode();return}if($('#'+i.id+'-error'))setError(i.id,'');if(i.id==='new-email'){state.newEmail=i.value;invalidateAuthorization();$('#email-form .primary').disabled=!emailValid(i.value.trim())}});
document.addEventListener('paste',e=>{if(e.target.classList.contains('pin-digit')){e.preventDefault();if(!state.busy)enterPinDigits(e.target,e.clipboardData.getData('text'));return}if(!e.target.classList.contains('digit')||state.busy)return;const inputs=$$('.digit'),text=e.clipboardData.getData('text').replace(/\D/g,'').slice(0,inputs.length);if(!text)return;e.preventDefault();inputs.forEach((i,n)=>{i.value=text[n]||'';i.setAttribute('aria-invalid','false')});$('#code-error').textContent='';inputs[Math.min(text.length,inputs.length-1)].focus();if($('#code-form .primary'))$('#code-form .primary').disabled=text.length!==inputs.length;if(text.length===inputs.length)verifyCode()});
document.addEventListener('focusin',e=>{if(e.target.classList.contains('pin-digit'))e.target.select()});
document.addEventListener('keydown',e=>{if(e.target.classList.contains('pin-digit')){if(state.busy){e.preventDefault();return}const input=e.target;if(e.key==='Backspace'&&!input.value){e.preventDefault();const previous=input.previousElementSibling||(input.closest('.pin-entry').id==='confirm-pin'?$('#new-pin-6'):null);if(previous){previous.value='';clearPinError(previous);previous.focus()}}if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();(e.key==='ArrowLeft'?input.previousElementSibling:input.nextElementSibling)?.focus()}}if(e.target.classList.contains('digit')){if(state.busy){e.preventDefault();return}if(e.key==='Backspace'&&!e.target.value)e.target.previousElementSibling?.focus();if(e.key==='ArrowLeft')e.target.previousElementSibling?.focus();if(e.key==='ArrowRight')e.target.nextElementSibling?.focus()}const dialog=!$('#review').hidden?$('#review'):state.modal?$('#layer'):null;if(dialog){if(e.key==='Escape'&&!state.busy){if(dialog.id==='review'){$('#review').hidden=true;$('#app').inert=!!state.modal}else{invalidateAuthorization();closeModal()}e.preventDefault()}if(e.key==='Tab'){const items=$$('button:not(:disabled),input:not(:disabled),select:not(:disabled),a[href]',dialog).filter(el=>el.getClientRects().length),first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault()}}}});
document.addEventListener('submit',e=>{e.preventDefault();if(state.busy)return;const form=e.target,b=$('button[type="submit"]',form);if(form.id==='code-form'){verifyCode();return}if(form.id==='email-form'){const email=$('#new-email').value.trim().toLowerCase();state.newEmail=email;let error='';if(!emailValid(email))error='Enter a valid email address.';else if(email===state.email.toLowerCase())error='Your new email must be different from your current email.';else if(email==='used@example.com')error='This email is already in use. Try another email.';if(error){setError('new-email',error);$('#new-email').focus();return}startOtp('email',email,b);return}if(form.id==='pin-form'){if(!authorizationValid('pin-management')){go('transaction-pin');return}const pin=pinValue('new-pin'),confirm=pinValue('confirm-pin');setError('new-pin',!pin?'Required':!/^\d{6}$/.test(pin)?'Enter a 6-digit transaction PIN.':'');setError('confirm-pin',!confirm?'Required':!/^\d{6}$/.test(confirm)?'Enter a 6-digit transaction PIN.':pin!==confirm?'PINs do not match.':'');const invalid=$('.invalid input');if(invalid){invalid.focus();return}const wasSet=state.hasPin;busy(b,'Saving…',async()=>{state.busy=true;await demo.save({pin,hasPin:true});state.busy=false;state.pin=pin;state.hasPin=true;consumeAuthorization();go('security');toast(wasSet?'Transaction PIN changed successfully.':'Transaction PIN set successfully.',true)});return}if(form.id==='password-form'){if(!authorizationValid('password')){go('password');toast('Your verification session has expired. Please verify your email again.');return}const p=$('#new-password').value,c=$('#confirm-password').value;setError('new-password',!p?'Required':!/^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,20}$/.test(p)?'Use 8–20 characters with at least one letter and one number. No special characters.':'');setError('confirm-password',!c?'Required':p!==c?'Passwords do not match.':'');const invalid=$('.invalid input');if(invalid){invalid.focus();return}const wasSet=state.hasPassword;busy(b,'Saving…',async()=>{state.busy=true;await demo.save({password:p,hasPassword:true});state.busy=false;state.password=p;state.hasPassword=true;consumeAuthorization();go('security');toast(wasSet?'Password changed successfully.':'Password set successfully.',true)});return}});
async function resumeSecurity(){try{if(sessionStorage.getItem('tbay-demo-signed-out')==='true'){location.replace('tbay-auth-flow.html#login');return}const account=await demo.ensure();state.email=account.email;state.hasPassword=account.hasPassword;state.hasPin=account.hasPin;if(account.pinDigest&&account.pinDigest!==await crypto.subtle.digest('SHA-256',new TextEncoder().encode('123456')).then(b=>Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')))state.pin='';render()}catch{$('#app').innerHTML=header('Security')+'<div class="screen"><p class="error">Unable to load your account security settings. Please try again.</p></div>'}}
window.addEventListener('pageshow',event=>{if(event.persisted)resumeSecurity()});
resumeSecurity();
</script>
