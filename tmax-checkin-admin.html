<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>T-matrix · 签到管理</title>
  <style>
    :root{--header:#021529;--side:#001529;--sub:#000c17;--nav:#00c1ba;--nav-text:#2fecff;--action:#3cbafb;--page:#f3f5f9;--white:#fff;--text:rgba(0,0,0,.88);--muted:#666;--weak:#939191;--border:#d9d9d9;--line:#f0f0f0;--success:#52c41a;--danger:#ff4d4f;--warning:#faad14}
    *{box-sizing:border-box}html,body{margin:0;min-width:1180px;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;color:var(--text);background:var(--page);font-size:14px}button,input,select{font:inherit}
    .header{position:fixed;z-index:10;inset:0 0 auto;height:60px;display:flex;align-items:center;background:var(--header);box-shadow:0 2px 5px rgba(0,0,0,.1);color:#fff}.brand{width:190px;padding-left:26px;font-size:27px;font-weight:800;font-style:italic;letter-spacing:.3px}.brand span{font-style:normal;font-size:25px}.topnav{height:60px;display:flex;align-items:stretch}.topnav a{min-width:88px;padding:0 16px;display:grid;place-items:center;color:rgba(255,255,255,.65);text-decoration:none}.topnav a.active{background:var(--nav);color:#fff}.header-tools{margin-left:auto;padding-right:22px;display:flex;align-items:center;gap:22px}.lang{height:32px;padding:0 13px;border:1px solid #d9d9d9;border-radius:6px;background:#fff;color:#333}.user{display:flex;align-items:center;gap:9px;color:rgba(255,255,255,.85)}.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#567b9e;border:2px solid #bfd2df}
    .sidebar{position:fixed;z-index:9;left:0;top:60px;bottom:0;width:190px;overflow:auto;background:var(--side);color:rgba(255,255,255,.65)}.menu-group{height:46px;padding:0 18px;display:flex;align-items:center;justify-content:space-between}.menu-group.open{color:var(--nav-text)}.submenu{background:var(--sub)}.menu-item{height:55px;padding:0 20px 0 42px;display:flex;align-items:center;color:rgba(255,255,255,.65);text-decoration:none;cursor:pointer}.menu-item:hover{color:#fff}.menu-item.active{background:var(--nav);color:#fff}.menu-divider{height:1px;background:rgba(255,255,255,.05)}
    .workspace{margin:60px 0 0 190px;padding:10px 20px 28px;min-height:calc(100vh - 60px)}.breadcrumb{height:20px;margin-bottom:10px;color:var(--weak);font-size:13px}.main{min-height:calc(100vh - 108px);padding:20px;background:var(--white)}.page-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px}.page-head h1{margin:0 0 5px;font-size:18px}.page-head p{margin:0;color:var(--muted);font-size:12px}.btn{height:31px;min-width:60px;padding:5px 16px;border-radius:4px;border:1px solid var(--action);font-size:13px;cursor:pointer}.btn-primary{background:var(--action);color:#fff}.btn-secondary{background:rgba(60,186,251,.1);color:var(--action)}.btn-plain{background:#fff;color:#555;border-color:var(--border)}.btn-danger{color:var(--danger);border-color:#ffccc7;background:#fff2f0}.notice{margin-bottom:16px;padding:10px 12px;border:1px solid #bae7ff;background:#e6f7ff;color:#3a5568;font-size:12px;line-height:19px}.notice b{color:#096dd9}
    .filters{padding:16px 18px;background:#fafafa;border:1px solid var(--line);display:flex;align-items:end;gap:18px;flex-wrap:wrap}.field{display:grid;gap:6px}.field label{font-size:13px}.control{height:32px;width:190px;padding:4px 11px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--text);font-size:13px;outline:none}.control:focus{border-color:var(--action);box-shadow:0 0 0 2px rgba(60,186,251,.12)}.filter-actions{display:flex;gap:10px}
    .table-head{margin:20px 0 10px;display:flex;align-items:center;justify-content:space-between}.table-head strong{font-size:14px}.count{color:var(--weak);font-size:12px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px 8px 0 0}.table{width:100%;min-width:1340px;border-collapse:collapse;table-layout:fixed}.table th,.table td{height:44px;padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.table th{height:40px;background:#fafafa;font-weight:650}.table tr:hover td{background:#fafafa}.status{display:inline-flex;align-items:center;gap:6px}.status:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--success)}.status.off:before{background:#bfbfbf}.tag{display:inline-block;padding:1px 7px;border-radius:3px;color:#08979c;background:#e6fffb;border:1px solid #87e8de}.tag.manual{color:#2f54eb;background:#f0f5ff;border-color:#adc6ff}.actions{display:flex;gap:12px}.link-btn{border:0;padding:0;background:none;color:#1677ff;font-size:12px;cursor:pointer}.link-btn.stop{color:#ff4d4f}.pagination{height:50px;display:flex;justify-content:center;align-items:center;gap:7px;color:#555;font-size:12px}.page-btn{width:28px;height:28px;border:1px solid transparent;border-radius:6px;background:#fff;cursor:pointer}.page-btn.active{border-color:#1677ff;color:#1677ff;font-weight:650}.page-size{width:86px;height:28px;border:1px solid var(--border);border-radius:6px;background:#fff;font-size:12px}
    .overlay{position:fixed;z-index:30;inset:0;display:none;align-items:center;justify-content:center;padding:30px;background:rgba(0,21,41,.45)}.overlay.show{display:flex}.dialog{width:820px;max-height:calc(100vh - 60px);display:flex;flex-direction:column;border-radius:10px;background:#fff;box-shadow:0 18px 50px rgba(0,0,0,.22)}.dialog-head{min-height:60px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.dialog-head h2{margin:0;font-size:17px}.x{width:32px;height:32px;border:0;border-radius:6px;background:none;color:#777;font-size:23px;line-height:1;cursor:pointer}.x:hover{background:#f5f5f5}.dialog-body{padding:22px;overflow:auto}.form-grid{display:grid;grid-template-columns:1fr;gap:18px}.form-item{display:grid;align-content:start;gap:7px}.form-item.full{grid-column:1/-1}.basic-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:15px 16px;border:1px solid var(--line);border-radius:7px;background:#fafafa}.settings-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.required:before{content:"*";margin-right:4px;color:var(--danger)}.form-item label{font-size:13px}.form-item .control{width:100%}.static-text{height:32px;display:flex;align-items:center;color:var(--text);font-size:14px;font-weight:600}.help{color:var(--weak);font-size:11px;line-height:17px}.radio-group{height:32px;display:flex;align-items:center;gap:24px}.radio{display:flex;align-items:center;gap:7px;cursor:pointer}.radio input{width:15px;height:15px;margin:0;accent-color:var(--action)}.reward-box{padding:16px;border:1px solid var(--line);border-radius:7px;background:#fafafa}.reward-title{display:flex;justify-content:space-between;margin-bottom:12px}.reward-days{display:grid;grid-template-columns:repeat(7,1fr);gap:9px}.reward-day label{display:block;margin-bottom:6px;color:var(--muted);font-size:11px}.reward-day input{width:100%;height:32px;padding:4px 8px;border:1px solid var(--border);border-radius:5px;font-size:12px;outline:none}.reward-day input:focus{border-color:var(--action);box-shadow:0 0 0 2px rgba(60,186,251,.1)}.inline{display:flex;align-items:center;gap:7px}.inline .control{flex:1;min-width:0}.suffix{flex:0 0 auto;color:var(--muted);font-size:12px;white-space:nowrap}.dialog-foot{height:64px;padding:0 22px;display:flex;align-items:center;justify-content:flex-end;gap:10px;border-top:1px solid var(--line);background:#fafafa;border-radius:0 0 10px 10px}
    .confirm-dialog{width:420px;border-radius:8px;background:#fff;box-shadow:0 18px 50px rgba(0,0,0,.22)}.confirm-body{padding:22px 20px 20px}.confirm-icon{width:34px;height:34px;margin-bottom:12px;border-radius:50%;display:grid;place-items:center;background:#fff7e6;color:#fa8c16;font-size:20px;font-weight:800}.confirm-body h3{margin:0 0 10px;font-size:16px}.confirm-body p{margin:0;color:var(--muted);font-size:13px;line-height:21px}.confirm-site{color:var(--text);font-weight:700}.confirm-foot{height:56px;padding:0 20px;display:flex;align-items:center;justify-content:flex-end;gap:10px;border-top:1px solid var(--line)}.toast{position:fixed;z-index:50;left:50%;top:78px;transform:translate(-50%,-10px);padding:9px 15px;border-radius:5px;background:rgba(0,0,0,.82);color:#fff;font-size:12px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
  </style>
</head>
<body>
  <header class="header"><div class="brand"><span>T</span> - matrix</div><nav class="topnav"><a href="#" data-i18n="systemManagement">系统管理</a><a href="#" data-i18n="businessManagement">业务管理</a><a class="active" href="#" data-i18n="marketingManagement">营销管理</a><a href="#" data-i18n="dataStatistics">数据统计</a></nav><div class="header-tools"><select class="lang" id="languageSelect" aria-label="Language"><option value="zh">简体中文</option><option value="en">English</option></select><div class="user"><span class="avatar">♟</span><span>xiabing</span></div></div></header>
  <aside class="sidebar"><div class="menu-group"><span data-i18n="contentManagement">内容管理</span><span>⌄</span></div><div class="menu-group open"><span data-i18n="campaignManagement">活动管理</span><span>⌃</span></div><div class="submenu"><a class="menu-item" href="#" data-i18n="referralCampaign">邀请裂变</a><a class="menu-item active" href="#" data-i18n="checkinManagement">签到管理</a><a class="menu-item" href="#" data-i18n="newUserTasks">新手任务</a><a class="menu-item" href="#" data-i18n="growthIncentives">成长激励</a></div><div class="menu-divider"></div><a class="menu-item" href="#" data-i18n="couponManagement">优惠券管理</a><a class="menu-item" href="#" data-i18n="couponCampaigns">券活动管理</a><a class="menu-item" href="#" data-i18n="cashDistribution">现金发放</a><a class="menu-item" href="#" data-i18n="notificationManagement">消息通知管理</a></aside>
  <main class="workspace"><div class="breadcrumb" data-i18n="breadcrumb">营销管理 / 活动管理 / 签到管理</div><section class="main"><div class="table-wrap"><table class="table"><colgroup><col style="width:120px"><col style="width:120px"><col style="width:260px"><col style="width:160px"><col style="width:120px"><col style="width:140px"><col style="width:90px"><col style="width:170px"><col style="width:140px"></colgroup><thead><tr><th data-i18n="site">站点</th><th data-i18n="checkinMethod">签到方式</th><th data-i18n="sevenDayRewards">7 日奖励（Coins）</th><th data-i18n="conversionRate">兑换比例</th><th data-i18n="redemptionMultiple">兑换倍数</th><th data-i18n="orderDiscountCap">订单抵扣上限</th><th data-i18n="status">状态</th><th data-i18n="updatedAt">更新时间</th><th data-i18n="actions">操作</th></tr></thead><tbody id="tbody"></tbody></table></div><div class="pagination"><span data-i18n="totalItems">共 3 条</span><button class="page-btn">‹</button><button class="page-btn active">1</button><button class="page-btn">›</button><select class="page-size"><option data-i18n="tenPerPage">10 条/页</option><option data-i18n="twentyPerPage">20 条/页</option></select></div></section></main>
  <div class="overlay" id="overlay"><section class="dialog"><header class="dialog-head"><h2 id="dialogTitle" data-i18n="editConfiguration">编辑站点签到配置</h2><button class="x" id="closeBtn" aria-label="Close">×</button></header><div class="dialog-body"><form id="configForm"><div class="form-grid"><div class="basic-grid"><div class="form-item"><label data-i18n="site">站点</label><div class="static-text" id="siteInput"></div></div><div class="form-item"><label class="required" data-i18n="checkinMethod">签到方式</label><div class="radio-group"><label class="radio"><input type="radio" name="modeInput" value="manual" checked><span data-i18n="manualCheckin">手动签到</span></label><label class="radio"><input type="radio" name="modeInput" value="auto"><span data-i18n="automaticCheckin">自动签到</span></label></div></div></div><div class="form-item full"><div class="reward-box"><div class="reward-title"><strong class="required" data-i18n="rewardConfiguration">连续 7 日奖励配置</strong><span class="help" data-i18n="unitCoins">单位：Coins</span></div><div class="reward-days" id="rewardInputs"></div></div></div><div class="settings-grid"><div class="form-item"><label class="required" data-i18n="conversionRate">兑换比例</label><div class="inline"><span class="suffix">1 Points =</span><input class="control" id="ratioInput" type="number" min="1" max="99999" step="1" value="1" required><span class="suffix">Coins</span></div></div><div class="form-item"><label class="required" data-i18n="redemptionMultiple">兑换倍数</label><div class="inline"><input class="control" id="multipleInput" type="number" min="1" max="9999" step="1" value="100" required><span class="suffix">Coins</span></div></div><div class="form-item"><label class="required" data-i18n="orderCoinDiscountCap">订单抵扣上限</label><div class="inline"><input class="control" id="capInput" type="number" min="0.1" max="100" step="0.1" value="0.5" required><span class="suffix">%</span></div></div></div></div></form></div><footer class="dialog-foot"><button class="btn btn-plain" id="cancelBtn" data-i18n="cancel">取消</button><button class="btn btn-primary" id="saveBtn" data-i18n="saveConfiguration">保存配置</button></footer></section></div>
  <div class="overlay" id="confirmOverlay"><section class="confirm-dialog"><div class="confirm-body"><div class="confirm-icon">!</div><h3 id="confirmTitle">确认关闭签到活动？</h3><p id="confirmMessage"></p></div><footer class="confirm-foot"><button class="btn btn-plain" id="confirmCancel" data-i18n="cancel">取消</button><button class="btn btn-primary" id="confirmSubmit">确认</button></footer></section></div>
  <div class="toast" id="toast"></div>
  <script>
    const messages={
      zh:{pageTitle:'T-matrix · 签到管理',systemManagement:'系统管理',businessManagement:'业务管理',marketingManagement:'营销管理',dataStatistics:'数据统计',contentManagement:'内容管理',campaignManagement:'活动管理',referralCampaign:'邀请裂变',checkinManagement:'签到管理',newUserTasks:'新手任务',growthIncentives:'成长激励',couponManagement:'优惠券管理',couponCampaigns:'券活动管理',cashDistribution:'现金发放',notificationManagement:'消息通知管理',breadcrumb:'营销管理 / 活动管理 / 签到管理',site:'站点',checkinMethod:'签到方式',sevenDayRewards:'7 日奖励（Coins）',conversionRate:'兑换比例',redemptionMultiple:'兑换倍数',orderDiscountCap:'订单抵扣上限',status:'状态',updatedAt:'更新时间',actions:'操作',totalItems:'共 3 条',tenPerPage:'10 条/页',twentyPerPage:'20 条/页',editConfiguration:'编辑站点签到配置',manualCheckin:'手动签到',automaticCheckin:'自动签到',rewardConfiguration:'连续 7 日奖励配置',unitCoins:'单位：Coins',orderCoinDiscountCap:'订单抵扣上限',cancel:'取消',saveConfiguration:'保存配置',enabled:'开启',disabled:'关闭',enableAction:'开启',disableAction:'关闭',edit:'编辑',day:n=>`第 ${n} 天`,confirmTitle:action=>`确认${action}签到活动？`,confirmMessage:(action,site)=>`即将${action}站点 <span class="confirm-site">${site}</span> 的签到活动，是否继续？`,confirmAction:action=>`确认${action}`,enabledToast:'站点签到活动已开启',disabledToast:'站点签到活动已关闭',requiredToast:'请填写所有必填项',savedToast:'签到活动配置已保存'},
      en:{pageTitle:'T-matrix · Check-in Management',systemManagement:'System Management',businessManagement:'Business Management',marketingManagement:'Marketing Management',dataStatistics:'Data Statistics',contentManagement:'Content Management',campaignManagement:'Campaign Management',referralCampaign:'Referral Campaign',checkinManagement:'Check-in Management',newUserTasks:'New User Tasks',growthIncentives:'Growth Incentives',couponManagement:'Coupon Management',couponCampaigns:'Coupon Campaigns',cashDistribution:'Cash Distribution',notificationManagement:'Notification Management',breadcrumb:'Marketing Management / Campaign Management / Check-in Management',site:'Site',checkinMethod:'Check-in Method',sevenDayRewards:'7-Day Rewards (Coins)',conversionRate:'Conversion Rate',redemptionMultiple:'Redemption Multiple',orderDiscountCap:'Order Discount Cap',status:'Status',updatedAt:'Updated At',actions:'Actions',totalItems:'3 items',tenPerPage:'10 / page',twentyPerPage:'20 / page',editConfiguration:'Edit Site Check-in Configuration',manualCheckin:'Manual Check-in',automaticCheckin:'Automatic Check-in',rewardConfiguration:'Consecutive 7-Day Reward Configuration',unitCoins:'Unit: Coins',orderCoinDiscountCap:'Order Discount Cap',cancel:'Cancel',saveConfiguration:'Save Configuration',enabled:'Enabled',disabled:'Disabled',enableAction:'enable',disableAction:'disable',edit:'Edit',day:n=>`Day ${n}`,confirmTitle:action=>`Confirm ${action} check-in campaign?`,confirmMessage:(action,site)=>`The check-in campaign for <span class="confirm-site">${site}</span> will be ${action}d. Continue?`,confirmAction:action=>`Confirm ${action}`,enabledToast:'Site check-in campaign enabled',disabledToast:'Site check-in campaign disabled',requiredToast:'Please complete all required fields',savedToast:'Check-in configuration saved'}
    };
    let currentLang='zh';
    try{currentLang=localStorage.getItem('tmax-language')||'zh'}catch(e){}
    if(!messages[currentLang])currentLang='zh';
    const t=(key,...args)=>{const value=messages[currentLang][key];return typeof value==='function'?value(...args):value};
    const configs=[
      {site:'LuckCard',mode:'manual',rewards:[10,10,20,20,30,40,50],ratio:1,multiple:100,cap:0.5,status:'on',updated:'2026-08-14 16:32:08'},
      {site:'TroveLoop',mode:'auto',rewards:[5,10,15,20,30,40,50],ratio:10,multiple:100,cap:1,status:'on',updated:'2026-08-11 10:18:42'},
      {site:'TrustCard',mode:'manual',rewards:[10,10,10,20,20,30,40],ratio:1,multiple:50,cap:0.5,status:'off',updated:'2026-08-02 09:05:16'}
    ];
    const tbody=document.getElementById('tbody'),overlay=document.getElementById('overlay'),toast=document.getElementById('toast'),confirmOverlay=document.getElementById('confirmOverlay'),languageSelect=document.getElementById('languageSelect');let editing=-1,pendingStatusIndex=-1;
    function render(){tbody.innerHTML=configs.map((c,i)=>`<tr><td><b>${c.site}</b></td><td><span class="tag ${c.mode==='manual'?'manual':''}">${c.mode==='auto'?t('automaticCheckin'):t('manualCheckin')}</span></td><td title="${c.rewards.join(' / ')}">${c.rewards.join(' / ')}</td><td>1 Points = ${c.ratio} Coins</td><td>${c.multiple} Coins</td><td>${c.cap}%</td><td><span class="status ${c.status==='off'?'off':''}">${c.status==='on'?t('enabled'):t('disabled')}</span></td><td>${c.updated}</td><td><div class="actions"><button class="link-btn" onclick="editConfig(${i})">${t('edit')}</button><button class="link-btn ${c.status==='on'?'stop':''}" onclick="toggleStatus(${i})">${c.status==='on'?t('disabled'):t('enabled')}</button></div></td></tr>`).join('')}
    function showToast(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)}
    function buildRewards(values=[10,10,20,20,30,40,50]){document.getElementById('rewardInputs').innerHTML=values.map((v,i)=>`<div class="reward-day"><label>${t('day',i+1)}</label><input type="number" min="1" max="9999" step="1" value="${v}" required></div>`).join('')}
    function openDialog(c,i){editing=i;document.getElementById('dialogTitle').textContent=t('editConfiguration');document.getElementById('siteInput').textContent=c.site;document.querySelector(`input[name="modeInput"][value="${c.mode||'manual'}"]`).checked=true;document.getElementById('ratioInput').value=c.ratio??1;document.getElementById('capInput').value=c.cap??0.5;document.getElementById('multipleInput').value=c.multiple??100;buildRewards(c.rewards);overlay.classList.add('show')}
    function closeDialog(){overlay.classList.remove('show')}
    function updateConfirmDialog(){if(pendingStatusIndex<0)return;const c=configs[pendingStatusIndex],action=c.status==='on'?t('disableAction'):t('enableAction');document.getElementById('confirmTitle').textContent=t('confirmTitle',action);document.getElementById('confirmMessage').innerHTML=t('confirmMessage',action,c.site);document.getElementById('confirmSubmit').textContent=t('confirmAction',action)}
    function applyLanguage(){document.documentElement.lang=currentLang==='zh'?'zh-CN':'en';document.title=t('pageTitle');languageSelect.value=currentLang;document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));render();const rewardFields=[...document.querySelectorAll('#rewardInputs input')],rewardValues=rewardFields.length?rewardFields.map(x=>x.value):undefined;buildRewards(rewardValues);updateConfirmDialog()}
    window.editConfig=i=>openDialog(configs[i],i);window.toggleStatus=i=>{pendingStatusIndex=i;updateConfirmDialog();confirmOverlay.classList.add('show')};
    document.getElementById('closeBtn').onclick=closeDialog;document.getElementById('cancelBtn').onclick=closeDialog;overlay.addEventListener('click',e=>{if(e.target===overlay)closeDialog()});
    document.getElementById('confirmCancel').onclick=()=>{confirmOverlay.classList.remove('show');pendingStatusIndex=-1};confirmOverlay.addEventListener('click',e=>{if(e.target===confirmOverlay){confirmOverlay.classList.remove('show');pendingStatusIndex=-1}});document.getElementById('confirmSubmit').onclick=()=>{if(pendingStatusIndex<0)return;const c=configs[pendingStatusIndex];c.status=c.status==='on'?'off':'on';c.updated='2026-08-14 17:18:00';confirmOverlay.classList.remove('show');pendingStatusIndex=-1;render();showToast(c.status==='on'?t('enabledToast'):t('disabledToast'))};
    document.getElementById('saveBtn').onclick=()=>{const form=document.getElementById('configForm'),ratioInput=document.getElementById('ratioInput'),capInput=document.getElementById('capInput'),multipleInput=document.getElementById('multipleInput'),rewardFields=[...document.querySelectorAll('#rewardInputs input')];if(ratioInput.value===''||capInput.value===''||multipleInput.value===''||rewardFields.some(x=>x.value==='')){showToast(t('requiredToast'));return}if(!form.reportValidity())return;const current=configs[editing],data={site:current.site,mode:document.querySelector('input[name="modeInput"]:checked').value,rewards:rewardFields.map(x=>Number(x.value)),ratio:Number(ratioInput.value),multiple:Number(multipleInput.value),cap:Number(capInput.value),status:current.status,updated:'2026-08-14 17:12:00'};configs[editing]=data;closeDialog();render();showToast(t('savedToast'))};
    function switchLanguage(value){currentLang=value;try{localStorage.setItem('tmax-language',currentLang)}catch(e){}applyLanguage()}
    languageSelect.onchange=()=>switchLanguage(languageSelect.value);
    applyLanguage();
  </script>
</body>
</html>
