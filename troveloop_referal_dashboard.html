<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Troveloop 邀请裂变看板</title>
  <style>
    :root {
      --nav: #061a2b;
      --nav-deep: #03111d;
      --cyan: #12c7c0;
      --cyan-dark: #0db5ae;
      --blue: #247cff;
      --blue-soft: #eaf3ff;
      --bg: #f2f3f5;
      --panel: #ffffff;
      --line: #e8eaf0;
      --muted: #8b929f;
      --text: #1f2329;
      --sub: #4e5969;
      --danger: #f25f5c;
      --green: #18a058;
      --yellow: #f6b445;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 1280px;
      color: var(--text);
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      font-size: 14px;
      letter-spacing: 0;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 188px 1fr;
      grid-template-rows: 58px 1fr;
    }

    .topbar {
      grid-column: 1 / 3;
      height: 58px;
      display: flex;
      align-items: center;
      background: var(--nav);
      color: #dfe9f5;
    }

    .brand {
      width: 188px;
      height: 58px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding-left: 28px;
      font-size: 28px;
      font-weight: 700;
      font-style: italic;
      color: #fff;
    }

    .brand-mark {
      width: 24px;
      height: 24px;
      border: 3px solid #e7f3ff;
      border-right: 0;
      border-bottom: 0;
      border-radius: 3px 0 0 0;
      position: relative;
    }

    .brand-mark::after {
      content: "";
      position: absolute;
      left: 7px;
      top: 7px;
      width: 15px;
      height: 3px;
      background: #e7f3ff;
      border-radius: 2px;
    }

    .top-tabs {
      display: flex;
      align-self: stretch;
    }

    .top-tab {
      min-width: 88px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #c7d2df;
      font-size: 14px;
    }

    .top-tab.active {
      background: var(--cyan);
      color: #fff;
    }

    .top-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 20px;
      padding-right: 28px;
    }

    .language {
      min-width: 100px;
      height: 32px;
      border-radius: 5px;
      border: 1px solid #d8dce5;
      background: #fff;
      color: #2b2f36;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 10px;
      outline: none;
      cursor: pointer;
    }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: linear-gradient(135deg, #e8f2ff, #5a8cd8);
      border: 2px solid rgba(255, 255, 255, .7);
    }

    .user {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
      font-size: 13px;
    }

    .sidebar {
      grid-row: 2;
      background: var(--nav);
      color: #9ba9b8;
      min-height: calc(100vh - 58px);
    }

    .side-group-title,
    .side-item {
      height: 56px;
      display: flex;
      align-items: center;
      padding: 0 18px 0 52px;
      position: relative;
    }

    .side-group-title {
      color: #34e1eb;
      background: #06243a;
      font-weight: 500;
    }

    .side-group-title::after {
      content: "^";
      position: absolute;
      right: 18px;
      top: 19px;
      color: #33e8f2;
      font-weight: 700;
    }

    .side-item {
      background: var(--nav-deep);
      color: #aab4bf;
    }

    .side-item.active {
      color: #fff;
      background: var(--cyan-dark);
      font-weight: 600;
    }

    .content {
      grid-column: 2;
      grid-row: 2;
      padding: 0 20px 28px;
      overflow: auto;
    }

    .crumb {
      height: 44px;
      display: flex;
      align-items: center;
      color: #9aa1ad;
      font-size: 12px;
    }

    .panel {
      min-height: calc(100vh - 102px);
      background: var(--panel);
      padding: 26px 20px 34px;
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 26px;
    }

    .title-left {
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.4;
      font-weight: 700;
    }

    .hint {
      color: #30343b;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      user-select: none;
    }

    .hint-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #1f2329;
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      line-height: 1;
    }

    .metric-popover {
      position: absolute;
      left: 128px;
      top: 30px;
      width: 380px;
      border: 1px solid #dfe3eb;
      border-radius: 6px;
      background: #fff;
      box-shadow: 0 8px 22px rgba(18, 31, 51, .14);
      z-index: 5;
      display: none;
      padding: 14px 16px;
      color: #1f2329;
    }

    .metric-popover.show {
      display: block;
    }

    .metric-popover-title {
      margin-bottom: 12px;
      font-size: 15px;
      font-weight: 700;
    }

    .metric-popover p {
      margin: 0 0 8px;
      line-height: 1.45;
      font-size: 14px;
    }

    .metric-popover p:last-child {
      margin-bottom: 0;
    }

    .filters {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .field {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .label {
      color: #30343b;
    }

    select,
    input[type="date"] {
      height: 32px;
      border: 1px solid #d7dbe3;
      border-radius: 5px;
      padding: 0 12px;
      background: #fff;
      color: #2b2f36;
      min-width: 160px;
      outline: none;
      font-size: 14px;
    }

    input[type="date"] {
      min-width: 144px;
      padding-right: 8px;
    }

    .date-range {
      display: inline-flex;
      align-items: center;
      height: 32px;
      border: 1px solid #d7dbe3;
      border-radius: 5px;
      overflow: hidden;
      background: #fff;
    }

    .date-range input {
      border: 0;
      border-radius: 0;
    }

    .date-sep {
      width: 28px;
      color: #9aa1ad;
      text-align: center;
    }

    .segmented {
      height: 32px;
      display: inline-flex;
      border: 1px solid var(--blue);
      border-radius: 5px;
      overflow: hidden;
      background: #fff;
    }

    .segmented button,
    .metric-tabs button,
    .btn {
      height: 32px;
      border: 0;
      background: #fff;
      color: #2b2f36;
      padding: 0 16px;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
    }

    .segmented button + button {
      border-left: 1px solid #dbe8ff;
    }

    .segmented button.active {
      background: #fff;
      color: var(--blue);
    }

    .btn {
      border: 1px solid #d7dbe3;
      border-radius: 5px;
      min-width: 64px;
    }

    .btn.primary {
      border-color: var(--blue);
      background: var(--blue);
      color: #fff;
      font-weight: 600;
    }

    .metric-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0;
      margin: 10px 0 18px;
    }

    .metric-tabs button {
      border: 1px solid #d7dbe3;
      margin-left: -1px;
      min-width: 104px;
    }

    .metric-tabs button:first-child {
      border-radius: 5px 0 0 5px;
      margin-left: 0;
    }

    .metric-tabs button:last-child {
      border-radius: 0 5px 5px 0;
    }

    .metric-tabs button.active {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
      position: relative;
      z-index: 1;
    }

    .chart-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 2px 16px 0;
      color: #3a3f48;
    }

    .legend {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      color: #3f4652;
      font-size: 13px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-right: 14px;
      cursor: pointer;
      user-select: none;
      transition: color .15s ease, opacity .15s ease;
    }

    .legend-item.off {
      color: #a8b0bc;
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .legend-item.off .legend-dot {
      background: #c9ced8 !important;
    }

    .chart-wrap {
      height: 354px;
      padding: 4px 10px 0;
      margin-bottom: 24px;
      border-bottom: 1px solid transparent;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .grid-line {
      stroke: #eef0f5;
      stroke-dasharray: 3 5;
    }

    .axis-text {
      fill: #9aa1ad;
      font-size: 12px;
    }

    .line-path {
      fill: none;
      stroke: var(--blue);
      stroke-width: 1.5;
    }

    .point {
      fill: var(--blue);
      stroke: #fff;
      stroke-width: 2;
    }

    .table-card {
      border-radius: 6px;
      overflow: hidden;
      background: #fff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th,
    td {
      height: 56px;
      padding: 0 12px;
      text-align: center;
      border-bottom: 1px solid #ebeef3;
      color: #252932;
    }

    td {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    th {
      background: #fafafa;
      font-weight: 700;
      font-size: 13px;
      height: auto;
      min-height: 56px;
      padding-top: 10px;
      padding-bottom: 10px;
      white-space: normal;
      overflow: visible;
      text-overflow: clip;
      overflow-wrap: anywhere;
      word-break: break-word;
      line-height: 1.35;
    }

    th + th {
      border-left: 1px solid #ebeef3;
    }

    tr.total td {
      background: #fbfbfc;
      font-weight: 700;
    }

    .rate {
      color: var(--blue);
      font-weight: 600;
    }

    .money {
      color: #111827;
      font-weight: 600;
    }

    .pagination {
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: #4e5969;
    }

    .page-current {
      width: 32px;
      height: 32px;
      border: 1px solid var(--blue);
      color: var(--blue);
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #fff;
    }

    .page-size {
      height: 32px;
      min-width: 94px;
      border: 1px solid #d7dbe3;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #2b2f36;
      background: #fff;
    }

    .toast {
      position: fixed;
      right: 24px;
      top: 78px;
      background: #1f2329;
      color: #fff;
      border-radius: 5px;
      padding: 11px 14px;
      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
      transition: .2s ease;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .18);
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 1360px) {
      body {
        min-width: 1180px;
      }

      th,
      td {
        padding: 0 8px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark"></span>
        <span>- matrix</span>
      </div>
      <nav class="top-tabs" aria-label="顶部导航">
        <div class="top-tab" data-i18n="navSystem">系统管理</div>
        <div class="top-tab" data-i18n="navBusiness">业务管理</div>
        <div class="top-tab" data-i18n="navMarketing">营销管理</div>
        <div class="top-tab active" data-i18n="navStats">数据统计</div>
      </nav>
      <div class="top-actions">
        <select class="language" id="languageSwitch" aria-label="Language">
          <option value="zh" selected>简体中文</option>
          <option value="en">English</option>
        </select>
        <div class="user"><span class="avatar"></span><span>xiabing</span></div>
      </div>
    </header>

    <aside class="sidebar">
      <div class="side-group-title" data-i18n="sideMerchantStats">服务商统计</div>
      <div class="side-item" data-i18n="sideServiceQuality">服务质量</div>
      <div class="side-group-title" data-i18n="sideBaseData">基础数据</div>
      <div class="side-item" data-i18n="sideNewUsers">新用户数据</div>
      <div class="side-item" data-i18n="sideOrders">订单数据</div>
      <div class="side-group-title" data-i18n="sideMarketingData">营销数据</div>
      <div class="side-item" data-i18n="sideCoupons">券发放数据</div>
      <div class="side-item active" data-i18n="sideReferral">邀请裂变</div>
    </aside>

    <main class="content">
      <div class="crumb" data-i18n="breadcrumb">数据统计 / 营销数据 / 邀请裂变看板</div>
      <section class="panel">
        <div class="title-row">
          <div class="title-left">
            <h1 data-i18n="pageTitle">邀请裂变看板</h1>
            <span class="hint" id="metricHelp"><span id="metricHelpText">指标说明</span><span class="hint-dot">i</span></span>
            <div class="metric-popover" id="metricPopover">
            </div>
          </div>
        </div>

        <div class="filters" aria-label="筛选条件">
          <div class="field">
            <span class="label" id="siteLabel">站点：</span>
            <select id="site">
              <option selected>Troveloop</option>
              <option>T-matrix</option>
              <option>Travel Plus</option>
            </select>
          </div>
          <div class="field">
            <span class="label" id="sourceLabel">来源：</span>
            <select id="source">
              <option value="all" selected>全部</option>
              <option value="android">安卓</option>
              <option value="ios">IOS</option>
              <option value="h5">H5</option>
            </select>
          </div>
          <div class="field">
            <span class="label" id="timeLabel">时间：</span>
            <div class="date-range">
              <input id="startDate" type="date" value="2026-06-25">
              <span class="date-sep">—</span>
              <input id="endDate" type="date" value="2026-07-01">
            </div>
          </div>
          <div class="segmented" aria-label="颗粒度">
            <button type="button" data-grain="day" class="active">日</button>
            <button type="button" data-grain="week">周</button>
            <button type="button" data-grain="month">月</button>
          </div>
          <button class="btn primary" type="button" id="search">搜索</button>
          <button class="btn" type="button" id="reset">重置</button>
          <button class="btn" type="button" id="export">导出</button>
        </div>

        <div class="metric-tabs" aria-label="关键指标切换">
          <button type="button" class="active" data-chart="funnel">关键路径用户</button>
          <button type="button" data-chart="referralQuality">推荐用户分布</button>
          <button type="button" data-metric="Referral shares">分享点击</button>
          <button type="button" data-metric="Registration rate">注册率</button>
          <button type="button" data-metric="Rewards distributed">总奖励金额(Points)</button>
          <button type="button" data-metric="Referral Quality Rate">有效推荐率</button>
          <button type="button" data-metric="CPA">单用户成本(Points)</button>
        </div>

        <div class="chart-head">
          <div class="legend" id="legend">活动页访问量</div>
        </div>
        <div class="chart-wrap">
          <svg id="chart" viewBox="0 0 1500 330" role="img" aria-label="邀请裂变趋势图"></svg>
        </div>

        <div class="table-card">
          <table>
            <thead>
              <tr>
                <th style="width: 190px;" data-col="date">日期</th>
                <th data-col="visits">活动页访问量</th>
                <th data-col="shares">分享点击数</th>
                <th data-col="registrations">注册用户数</th>
                <th data-col="regRate">注册率</th>
                <th data-col="valid">有效推荐用户</th>
                <th data-col="invalid">无效推荐用户</th>
                <th data-col="txnInvalid">无效有交易用户</th>
                <th data-col="noTxnInvalid">无效无交易用户</th>
                <th data-col="reward">总奖励金额(Points)</th>
                <th data-col="qualityRate">有效推荐率</th>
                <th data-col="cpa">CPA</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
          <div class="pagination">
            <span id="totalRows">共 7 条</span>
            <span>‹</span>
            <span class="page-current">1</span>
            <span>›</span>
            <span class="page-size">10 条/页⌄</span>
          </div>
        </div>
      </section>
    </main>
  </div>
  <div class="toast" id="toast">已导出当前筛选结果</div>

  <script>
    const i18n = {
      zh: {
        pageTitle: "邀请裂变看板",
        docTitle: "Troveloop 邀请裂变看板",
        navSystem: "系统管理",
        navBusiness: "业务管理",
        navMarketing: "营销管理",
        navStats: "数据统计",
        sideMerchantStats: "服务商统计",
        sideServiceQuality: "服务质量",
        sideBaseData: "基础数据",
        sideNewUsers: "新用户数据",
        sideOrders: "订单数据",
        sideMarketingData: "营销数据",
        sideCoupons: "券发放数据",
        sideReferral: "邀请裂变",
        breadcrumb: "数据统计 / 营销数据 / 邀请裂变看板",
        metricHelp: "指标说明",
        siteLabel: "站点：",
        sourceLabel: "来源：",
        timeLabel: "时间：",
        search: "搜索",
        reset: "重置",
        export: "导出",
        total: "总计",
        rows: count => `共 ${count} 条`,
        pageSize: "10 条/页⌄",
        refreshed: "已按当前条件刷新数据",
        resetDone: "已重置筛选条件",
        exported: "已导出当前筛选结果",
        sourceOptions: { all: "全部", android: "安卓", ios: "IOS", h5: "H5" },
        grain: { day: "日", week: "周", month: "月" },
        metricNames: {
          "Referral page visits": "活动页访问量",

          "Registrations": "注册用户数",
          "Registration rate": "注册率",
          "Valid referrals": "有效推荐用户",
          "Invalid referrals": "无效推荐用户",
          "Txn Invalid Referral": "无效有交易用户",
          "No Txn Invalid Referral": "无效无交易用户",
          "Rewards distributed": "总奖励金额(Points)",
          "Referral Quality Rate": "有效推荐率",
          "CPA": "单用户成本(Points)"
        },
        metricTabs: {
          funnel: "关键路径用户",
          referralQuality: "推荐用户分布",
          "Referral page visits": "访问量",
          "Referral shares": "分享点击",
          "Registrations": "注册用户",
          "Registration rate": "注册率",
          "Valid referrals": "有效推荐",

          "Txn Invalid Referral": "无效有交易用户",
          "No Txn Invalid Referral": "无效无交易用户",
          "Rewards distributed": "总奖励金额(Points)",
          "Referral Quality Rate": "有效推荐率",
          "CPA": "单用户成本(Points)"
        },
        columns: {
          date: "日期",
          visits: "活动页访问量",
          shares: "分享点击数",
          registrations: "注册用户数",
          regRate: "注册率",
          valid: "有效推荐用户",
          invalid: "无效推荐用户",
          txnInvalid: "无效有交易用户",
          noTxnInvalid: "无效无交易用户",
          reward: "总奖励金额(Points)",
          qualityRate: "有效推荐率",
          cpa: "单用户成本(Points)"
        },
        popoverLines: [
          "活动页访问量：统计时间内访问邀请裂变活动的 UV；",
          "分享点击数：统计时间内点击分享按钮的用户数；",
          "注册用户数：统计时间内带邀请码注册的用户数；",
          "注册率：注册用户数/分享点击数；",
          "有效推荐用户：统计时间内新增有效推荐用户数；",
          "无效推荐用户：统计时间内新增无效推荐用户数；",
          "无效有交易用户：无效用户中有交易的用户数；",
          "无效无交易用户：无效用户中无交易的用户数；",
          "总奖励金额(Points)：统计时间内发放奖励金额之和；",
          "有效推荐率：有效推荐用户/注册用户数；",
          "单用户成本(Points)：总奖励金额(Points)/有效推荐用户数；"
        ]
      },
      en: {
        pageTitle: "Referral Dashboard",
        docTitle: "Troveloop Referral Dashboard",
        navSystem: "System",
        navBusiness: "Business",
        navMarketing: "Marketing",
        navStats: "Statistics",
        sideMerchantStats: "Merchant Stats",
        sideServiceQuality: "Service Quality",
        sideBaseData: "Base Data",
        sideNewUsers: "New Users",
        sideOrders: "Order Data",
        sideMarketingData: "Marketing Data",
        sideCoupons: "Coupon Data",
        sideReferral: "Referral",
        breadcrumb: "Statistics / Marketing Data / Referral Dashboard",
        metricHelp: "Metric Notes",
        siteLabel: "Site:",
        sourceLabel: "Source:",
        timeLabel: "Time:",
        search: "Search",
        reset: "Reset",
        export: "Export",
        total: "Total",
        rows: count => `${count} rows`,
        pageSize: "10 / page⌄",
        refreshed: "Data refreshed",
        resetDone: "Filters reset",
        exported: "Current results exported",
        sourceOptions: { all: "All", android: "Android", ios: "iOS", h5: "H5" },
        grain: { day: "Day", week: "Week", month: "Month" },
        metricNames: {
          "Referral page visits": "Referral page visits",
          "Referral shares": "Referral shares",
          "Registrations": "Registrations",
          "Registration rate": "Registration rate",
          "Valid referrals": "Valid referrals",
          "Invalid referrals": "Invalid referrals",
          "Txn Invalid Referral": "Txn Invalid Referral",
          "No Txn Invalid Referral": "No Txn Invalid Referral",
          "Rewards distributed": "Rewards distributed",
          "Referral Quality Rate": "Referral Quality Rate",
          "CPA": "CPA"
        },
        metricTabs: {
          funnel: "Referral Funnel",
          referralQuality: "Referral Quality",
          "Referral shares": "Referral shares",
          "Registration rate": "Registration rate",
          "Rewards distributed": "Rewards distributed",
          "Referral Quality Rate": "Referral Quality Rate",
          "CPA": "CPA"
        },
        columns: {
          date: "Date",
          visits: "Referral page visits",
          shares: "Referral shares",
          registrations: "Registrations",
          regRate: "Registration rate",
          valid: "Valid referrals",
          invalid: "Invalid referrals",
          txnInvalid: "Txn Invalid Referral",
          noTxnInvalid: "No Txn Invalid Referral",
          reward: "Rewards distributed",
          qualityRate: "Referral Quality Rate",
          cpa: "CPA"
        },
        popoverLines: [
          "Referral page visits: UVs visiting the referral campaign during the selected time;",
          "Referral shares: Users who clicked the share button during the selected time;",
          "Registrations: Users who registered with an invitation code during the selected time;",
          "Registration rate: registrations / referral shares;",
          "Valid referrals: New valid referrals during the selected time;",
          "Invalid referrals: New invalid referrals during the selected time;",
          "Txn Invalid Referral: Invalid referrals who have transactions;",
          "No Txn Invalid Referral: Invalid referrals who have no transactions;",
          "Rewards distributed: Total reward amount issued during the selected time;",
          "Referral Quality Rate: valid referrals / registrations;",
          "CPA: Rewards distributed / valid referrals;"
        ]
      }
    };

    const dailyRows = [
      { date: "总计", visits: 32840, shares: 8214, registrations: 2436, regRate: 29.66, valid: 684, invalid: 142, txnInvalid: 56, noTxnInvalid: 86, reward: 58920, qualityRate: 28.08, cpa: 86.14, total: true },
      { date: "2026-07-01", visits: 5420, shares: 1368, registrations: 422, regRate: 30.85, valid: 124, invalid: 18, txnInvalid: 8, noTxnInvalid: 10, reward: 10480, qualityRate: 29.38, cpa: 84.52 },
      { date: "2026-06-30", visits: 4986, shares: 1280, registrations: 391, regRate: 30.55, valid: 108, invalid: 21, txnInvalid: 9, noTxnInvalid: 12, reward: 9120, qualityRate: 27.62, cpa: 84.44 },
      { date: "2026-06-29", visits: 5614, shares: 1452, registrations: 438, regRate: 30.17, valid: 119, invalid: 23, txnInvalid: 10, noTxnInvalid: 13, reward: 10160, qualityRate: 27.17, cpa: 85.38 },
      { date: "2026-06-28", visits: 4208, shares: 988, registrations: 274, regRate: 27.73, valid: 73, invalid: 19, txnInvalid: 7, noTxnInvalid: 12, reward: 6240, qualityRate: 26.64, cpa: 85.48 },
      { date: "2026-06-27", visits: 4840, shares: 1186, registrations: 336, regRate: 28.33, valid: 91, invalid: 22, txnInvalid: 8, noTxnInvalid: 14, reward: 7820, qualityRate: 27.08, cpa: 85.93 },
      { date: "2026-06-26", visits: 4022, shares: 940, registrations: 259, regRate: 27.55, valid: 71, invalid: 20, txnInvalid: 7, noTxnInvalid: 13, reward: 6040, qualityRate: 27.41, cpa: 85.07 },
      { date: "2026-06-25", visits: 3750, shares: 1000, registrations: 316, regRate: 31.60, valid: 98, invalid: 19, txnInvalid: 7, noTxnInvalid: 12, reward: 9060, qualityRate: 31.01, cpa: 92.45 }
    ];

    const weeklyRows = [
      { date: "总计", visits: 126920, shares: 30264, registrations: 8926, regRate: 29.49, valid: 2468, invalid: 548, txnInvalid: 221, noTxnInvalid: 327, reward: 214260, qualityRate: 27.65, cpa: 86.82, total: true },
      { date: "2026-06-29 ~ 2026-07-06", visits: 32840, shares: 8214, registrations: 2436, regRate: 29.66, valid: 684, invalid: 142, txnInvalid: 56, noTxnInvalid: 86, reward: 58920, qualityRate: 28.08, cpa: 86.14 },
      { date: "2026-06-22 ~ 2026-06-29", visits: 29760, shares: 6970, registrations: 2046, regRate: 29.35, valid: 551, invalid: 119, txnInvalid: 48, noTxnInvalid: 71, reward: 47680, qualityRate: 26.93, cpa: 86.53 },
      { date: "2026-06-15 ~ 2026-06-22", visits: 31540, shares: 7584, registrations: 2240, regRate: 29.54, valid: 628, invalid: 137, txnInvalid: 56, noTxnInvalid: 81, reward: 53940, qualityRate: 28.04, cpa: 85.89 },
      { date: "2026-06-08 ~ 2026-06-15", visits: 32780, shares: 7496, registrations: 2204, regRate: 29.40, valid: 605, invalid: 150, txnInvalid: 61, noTxnInvalid: 89, reward: 53720, qualityRate: 27.45, cpa: 88.79 }
    ];

    const monthlyRows = [
      { date: "总计", visits: 384500, shares: 90230, registrations: 26584, regRate: 29.46, valid: 7042, invalid: 1584, txnInvalid: 632, noTxnInvalid: 952, reward: 612880, qualityRate: 26.49, cpa: 87.03, total: true },
      { date: "2026-07", visits: 5420, shares: 1368, registrations: 422, regRate: 30.85, valid: 124, invalid: 18, txnInvalid: 8, noTxnInvalid: 10, reward: 10480, qualityRate: 29.38, cpa: 84.52 },
      { date: "2026-06", visits: 142340, shares: 33620, registrations: 9938, regRate: 29.56, valid: 2680, invalid: 596, txnInvalid: 238, noTxnInvalid: 358, reward: 232600, qualityRate: 26.97, cpa: 86.79 },
      { date: "2026-05", visits: 123870, shares: 29142, registrations: 8504, regRate: 29.18, valid: 2210, invalid: 506, txnInvalid: 201, noTxnInvalid: 305, reward: 194200, qualityRate: 25.99, cpa: 87.87 },
      { date: "2026-04", visits: 112870, shares: 26100, registrations: 7720, regRate: 29.58, valid: 2028, invalid: 464, txnInvalid: 185, noTxnInvalid: 279, reward: 175600, qualityRate: 26.27, cpa: 86.59 }
    ];

    let state = {
      chart: "funnel",
      grain: "day",
      source: "all",
      site: "Troveloop",
      lang: "zh"
    };

    const columns = [
      ["visits", false],
      ["shares", false],
      ["registrations", false],
      ["regRate", true],
      ["valid", false],
      ["invalid", false],
      ["txnInvalid", false],
      ["noTxnInvalid", false],
      ["reward", false],
      ["qualityRate", true],
      ["cpa", false]
    ];

    const metricKey = {
      "Referral page visits": "visits",
      "Referral shares": "shares",
      "Registrations": "registrations",
      "Registration rate": "regRate",
      "Valid referrals": "valid",
      "Invalid referrals": "invalid",
      "Txn Invalid Referral": "txnInvalid",
      "No Txn Invalid Referral": "noTxnInvalid",
      "Rewards distributed": "reward",
      "Referral Quality Rate": "qualityRate",
      "CPA": "cpa"
    };

    const rateMetrics = new Set(["Registration rate", "Referral Quality Rate"]);
    const chartGroups = {
      funnel: ["Referral page visits", "Registrations", "Valid referrals"],
      referralQuality: ["Valid referrals", "Invalid referrals", "Txn Invalid Referral", "No Txn Invalid Referral"]
    };
    const visibleMetrics = {
      funnel: [...chartGroups.funnel],
      referralQuality: [...chartGroups.referralQuality]
    };
    const seriesColors = ["#247cff", "#18a058", "#f6b445", "#f25f5c"];

    function currentRows() {
      const base = state.grain === "week" ? weeklyRows : state.grain === "month" ? monthlyRows : dailyRows;
      const factorMap = { all: 1, android: .42, ios: .36, h5: .22 };
      const factor = factorMap[state.source] || 1;
      return base.map(row => {
        if (state.source === "all") return { ...row };
        const next = { ...row };
        ["visits", "shares", "registrations", "valid", "invalid", "txnInvalid", "noTxnInvalid", "reward"].forEach(key => {
          next[key] = Math.round(row[key] * factor);
        });
        next.regRate = next.shares ? +(next.registrations / next.shares * 100).toFixed(2) : 0;
        next.qualityRate = next.registrations ? +(next.valid / next.registrations * 100).toFixed(2) : 0;
        next.cpa = next.valid ? +(next.reward / next.valid).toFixed(2) : 0;
        return next;
      });
    }

    function formatValue(value, isRate, key) {
      if (isRate) return Number(value).toFixed(2) + "%";
      const locale = state.lang === "zh" ? "zh-CN" : "en-US";
      if (key === "reward") return Number(value).toLocaleString(locale, { maximumFractionDigits: 0 });
      return Number(value).toLocaleString(locale);
    }

    function displayDate(row) {
      return row.total ? i18n[state.lang].total : row.date;
    }

    function renderTable(rows) {
      const body = document.getElementById("tableBody");
      body.innerHTML = rows.map(row => {
        const cells = columns.map(([key, isRate]) => {
          const className = isRate ? "rate" : key === "reward" ? "money" : "";
          return `<td class="${className}" title="${formatValue(row[key], isRate, key)}">${formatValue(row[key], isRate, key)}</td>`;
        }).join("");
        return `<tr class="${row.total ? "total" : ""}"><td>${displayDate(row)}</td>${cells}</tr>`;
      }).join("");
      document.getElementById("totalRows").textContent = i18n[state.lang].rows(rows.length - 1);
    }

    function renderChart(rows) {
      const svg = document.getElementById("chart");
      const allMetrics = chartGroups[state.chart] || [state.chart];
      const metrics = chartGroups[state.chart]
        ? allMetrics.filter(metric => visibleMetrics[state.chart].includes(metric))
        : allMetrics;
      const plotRows = rows.filter(row => !row.total).slice().reverse();
      const values = metrics.flatMap(metric => plotRows.map(row => row[metricKey[metric]]));
      const maxValue = Math.max(...values, 1);
      const niceMax = maxValue < 100 ? Math.ceil(maxValue / 10) * 10 || 10 : Math.ceil(maxValue / 1000) * 1000;
      const width = 1500;
      const height = 330;
      const pad = { top: 20, right: 36, bottom: 46, left: 46 };
      const innerW = width - pad.left - pad.right;
      const innerH = height - pad.top - pad.bottom;
      const x = index => pad.left + (plotRows.length === 1 ? innerW / 2 : index * innerW / (plotRows.length - 1));
      const y = value => pad.top + innerH - (value / niceMax) * innerH;

      const grid = Array.from({ length: 6 }, (_, i) => {
        const gy = pad.top + i * innerH / 5;
        const label = niceMax - i * niceMax / 5;
        const locale = state.lang === "zh" ? "zh-CN" : "en-US";
        const labelText = metrics.every(metric => rateMetrics.has(metric)) ? label.toFixed(0) + "%" : Math.round(label).toLocaleString(locale);
        return `<line class="grid-line" x1="${pad.left}" y1="${gy}" x2="${width - pad.right}" y2="${gy}"></line>
          <text class="axis-text" x="${pad.left - 10}" y="${gy + 4}" text-anchor="end">${labelText}</text>`;
      }).join("");

      const xLabels = plotRows.map((row, index) => {
        const tx = x(index);
        return `<text class="axis-text" x="${tx}" y="${height - 18}" text-anchor="middle">${row.date}</text>`;
      }).join("");

      const series = metrics.map(metric => {
        const key = metricKey[metric];
        const seriesIndex = allMetrics.indexOf(metric);
        const color = seriesColors[seriesIndex % seriesColors.length];
        const path = plotRows.map((row, index) => `${index === 0 ? "M" : "L"} ${x(index)} ${y(row[key])}`).join(" ");
        const points = plotRows.map((row, index) => {
          const label = formatValue(row[key], rateMetrics.has(metric), key);
          const sep = state.lang === "zh" ? "：" : ": ";
          return `<circle class="point" cx="${x(index)}" cy="${y(row[key])}" r="5" style="fill:${color}"><title>${i18n[state.lang].metricNames[metric]} ${row.date}${sep}${label}</title></circle>`;
        }).join("");
        return `<path class="line-path" d="${path}" style="stroke:${color}"></path>${points}`;
      }).join("");

      svg.innerHTML = `${grid}${xLabels}${series}`;
      document.getElementById("legend").innerHTML = allMetrics.map((metric, index) => {
        const color = seriesColors[index % seriesColors.length];
        const isOff = chartGroups[state.chart] && !visibleMetrics[state.chart].includes(metric);
        return `<span class="legend-item${isOff ? " off" : ""}" data-legend-metric="${metric}"><span class="legend-dot" style="background:${color}"></span>${i18n[state.lang].metricNames[metric]}</span>`;
      }).join("");
    }

    function renderAll() {
      const rows = currentRows();
      renderChart(rows);
      renderTable(rows);
    }

    function showToast(text) {
      const toast = document.getElementById("toast");
      toast.textContent = text;
      toast.classList.add("show");
      window.setTimeout(() => toast.classList.remove("show"), 1800);
    }

    function renderLanguage() {
      const dict = i18n[state.lang];
      document.documentElement.lang = state.lang === "zh" ? "zh-CN" : "en";
      document.title = dict.docTitle;
      document.querySelectorAll("[data-i18n]").forEach(el => {
        el.textContent = dict[el.dataset.i18n];
      });
      document.getElementById("metricHelpText").textContent = dict.metricHelp;
      document.getElementById("siteLabel").textContent = dict.siteLabel;
      document.getElementById("sourceLabel").textContent = dict.sourceLabel;
      document.getElementById("timeLabel").textContent = dict.timeLabel;
      document.getElementById("search").textContent = dict.search;
      document.getElementById("reset").textContent = dict.reset;
      document.getElementById("export").textContent = dict.export;
      document.querySelectorAll("#source option").forEach(option => {
        option.textContent = dict.sourceOptions[option.value];
      });
      document.querySelectorAll(".segmented button").forEach(button => {
        button.textContent = dict.grain[button.dataset.grain];
      });
      document.querySelectorAll(".metric-tabs button").forEach(button => {
        button.textContent = dict.metricTabs[button.dataset.chart || button.dataset.metric];
      });
      document.querySelectorAll("th[data-col]").forEach(th => {
        th.textContent = dict.columns[th.dataset.col];
      });
      document.querySelector(".page-size").textContent = dict.pageSize;
      document.getElementById("toast").textContent = dict.exported;
      document.getElementById("metricPopover").innerHTML = [
        `<div class="metric-popover-title">${dict.metricHelp}</div>`,
        ...dict.popoverLines.map(line => `<p>${line}</p>`)
      ].join("");
      renderAll();
    }

    document.querySelectorAll(".metric-tabs button").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".metric-tabs button").forEach(item => item.classList.remove("active"));
        button.classList.add("active");
        state.chart = button.dataset.chart || button.dataset.metric;
        renderAll();
      });
    });

    document.getElementById("legend").addEventListener("click", event => {
      const item = event.target.closest(".legend-item");
      if (!item || !chartGroups[state.chart]) return;
      const metric = item.dataset.legendMetric;
      const current = visibleMetrics[state.chart];
      if (current.includes(metric)) {
        if (current.length === 1) return;
        visibleMetrics[state.chart] = current.filter(item => item !== metric);
      } else {
        visibleMetrics[state.chart] = [...current, metric];
      }
      renderAll();
    });

    document.querySelectorAll(".segmented button").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".segmented button").forEach(item => item.classList.remove("active"));
        button.classList.add("active");
        state.grain = button.dataset.grain;
        renderAll();
      });
    });

    document.getElementById("search").addEventListener("click", () => {
      state.site = document.getElementById("site").value;
      state.source = document.getElementById("source").value;
      renderAll();
      showToast(i18n[state.lang].refreshed);
    });

    document.getElementById("reset").addEventListener("click", () => {
      document.getElementById("site").value = "Troveloop";
      document.getElementById("source").value = "all";
      document.getElementById("startDate").value = "2026-06-25";
      document.getElementById("endDate").value = "2026-07-01";
      state = { ...state, chart: state.chart, grain: "day", source: "all", site: "Troveloop" };
      document.querySelectorAll(".segmented button").forEach(item => item.classList.toggle("active", item.dataset.grain === "day"));
      renderAll();
      showToast(i18n[state.lang].resetDone);
    });

    document.getElementById("export").addEventListener("click", () => {
      const rows = currentRows();
      const col = i18n[state.lang].columns;
      const header = [col.date, col.visits, col.shares, col.registrations, col.regRate, col.valid, col.invalid, col.txnInvalid, col.noTxnInvalid, col.reward, col.qualityRate, col.cpa];
      const csv = [header.join(",")].concat(rows.map(row => {
        return [
          displayDate(row),
          row.visits,
          row.shares,
          row.registrations,
          row.regRate + "%",
          row.valid,
          row.invalid,
          row.txnInvalid,
          row.noTxnInvalid,
          row.reward,
          row.qualityRate + "%",
          row.cpa
        ].join(",");
      })).join("\n");
      const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = state.lang === "zh" ? "Troveloop邀请裂变看板.csv" : "Troveloop Referral Dashboard.csv";
      link.click();
      URL.revokeObjectURL(url);
      showToast(i18n[state.lang].exported);
    });

    document.getElementById("languageSwitch").addEventListener("change", event => {
      state.lang = event.target.value;
      renderLanguage();
    });

    document.getElementById("metricHelp").addEventListener("click", event => {
      event.stopPropagation();
      document.getElementById("metricPopover").classList.toggle("show");
    });

    document.addEventListener("click", event => {
      const popover = document.getElementById("metricPopover");
      if (!popover.contains(event.target)) popover.classList.remove("show");
    });

    renderLanguage();
  </script>
